<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εξετάσεις Ραδιοερασιτεχνών — Εισαγωγικό Επίπεδο</title>
<style>
  :root {
    --bg: #0d0e0c;
    --panel: #161714;
    --panel-2: #1d1f1b;
    --line: #2a2d27;
    --line-bright: #3a3e36;
    --ink: #e8e1d0;
    --ink-dim: #a39d8b;
    --ink-faint: #6e6856;
    --amber: #ffb347;
    --amber-glow: #ff8c1a;
    --green: #84d676;
    --green-glow: #4ade80;
    --red: #ff6b6b;
    --red-glow: #ef4444;
    --blue: #6cb8ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 140, 26, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(108, 184, 255, 0.025) 0%, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 1;
  }

  .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-feature-settings: "ss01"; }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    position: relative;
    z-index: 2;
  }

  /* ========== HEADER ========== */
  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 44px; height: 44px;
    border: 1.5px solid var(--amber);
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background: radial-gradient(circle at center, rgba(255,140,26,0.15) 0%, transparent 70%);
  }
  .logo::before, .logo::after {
    content: "";
    position: absolute;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber-glow);
  }
  .logo::before {
    width: 2px;
    height: 22px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  .logo::after {
    width: 16px;
    height: 2px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  .brand-text h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .brand-text .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }

  .signal {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 2px var(--green-glow); }
  }

  /* ========== HOME ========== */
  .home-intro {
    margin-bottom: 40px;
  }
  .home-intro h2 {
    font-size: 38px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .home-intro h2 .accent { color: var(--amber); font-style: italic; }
  .home-intro p {
    color: var(--ink-dim);
    font-size: 17px;
    max-width: 60ch;
  }

  .modes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  @media (max-width: 1100px) {
    .modes { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .modes { grid-template-columns: 1fr; }
  }

  .mode-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 22px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    color: var(--ink);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .mode-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--amber);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.25s ease;
  }
  .mode-card:hover {
    background: var(--panel-2);
    border-color: var(--line-bright);
  }
  .mode-card:hover::before { transform: scaleY(1); }

  .mode-card .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 12px;
  }
  .mode-card h3 {
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .mode-card p {
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.5;
  }

  .options-block {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 24px;
  }
  .options-block h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 16px;
  }

  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .chapter-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    color: var(--ink);
    font-size: 14px;
  }
  .chapter-chip:hover { border-color: var(--line-bright); }
  .chapter-chip.active {
    background: rgba(255, 179, 71, 0.08);
    border-color: var(--amber);
  }
  .chapter-chip .check {
    width: 14px; height: 14px;
    border: 1px solid var(--ink-faint);
    border-radius: 2px;
    flex-shrink: 0;
    position: relative;
    transition: all 0.15s;
  }
  .chapter-chip.active .check {
    background: var(--amber);
    border-color: var(--amber);
  }
  .chapter-chip.active .check::after {
    content: "✓";
    color: var(--bg);
    font-size: 11px;
    font-weight: 700;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    font-family: sans-serif;
  }
  .chapter-chip .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* ========== EXAM / PRACTICE VIEW ========== */
  .session-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
    gap: 16px;
    flex-wrap: wrap;
  }
  .session-bar .left, .session-bar .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .stat .val {
    color: var(--ink);
    font-size: 14px;
    margin-left: 6px;
  }
  .stat .val.amber { color: var(--amber); }
  .stat .val.red { color: var(--red); }

  .quit-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quit-btn:hover {
    color: var(--red);
    border-color: var(--red);
  }

  .progress-track {
    height: 2px;
    background: var(--line);
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--amber-glow), var(--amber));
    box-shadow: 0 0 8px rgba(255,140,26,0.5);
    transition: width 0.3s ease;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .q-meta .num { color: var(--amber); }
  .q-meta .divider { color: var(--line-bright); }

  .question-text {
    font-size: 24px;
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: -0.005em;
    margin-bottom: 28px;
    color: var(--ink);
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .answer {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    color: var(--ink);
    font-family: inherit;
    font-size: 17px;
    line-height: 1.5;
    width: 100%;
  }
  .answer:hover:not(.disabled) {
    border-color: var(--line-bright);
    background: var(--panel-2);
  }
  .answer .marker {
    width: 24px; height: 24px;
    border: 1px solid var(--ink-faint);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    transition: all 0.15s;
    margin-top: 1px;
  }
  .answer.selected {
    border-color: var(--amber);
    background: rgba(255, 179, 71, 0.06);
  }
  .answer.selected .marker {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--bg);
    font-weight: 700;
  }

  /* practice mode feedback */
  .answer.correct {
    border-color: var(--green);
    background: rgba(132, 214, 118, 0.08);
  }
  .answer.correct .marker {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg);
    font-weight: 700;
  }
  .answer.incorrect {
    border-color: var(--red);
    background: rgba(255, 107, 107, 0.06);
  }
  .answer.incorrect .marker {
    background: var(--red);
    border-color: var(--red);
    color: var(--bg);
    font-weight: 700;
  }
  .answer.disabled { cursor: default; }
  .answer.dimmed { opacity: 0.5; }

  /* ========== ACTIONS ========== */
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-top: 24px;
  }

  .btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-bright);
    padding: 12px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover:not(:disabled) {
    border-color: var(--ink);
    background: var(--panel-2);
  }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .btn-primary {
    background: var(--amber);
    color: var(--bg);
    border-color: var(--amber);
    font-weight: 600;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--amber-glow);
    border-color: var(--amber-glow);
    color: var(--bg);
  }
  .btn-large {
    padding: 16px 32px;
    font-size: 13px;
  }

  /* ========== RESULTS ========== */
  .results {
    text-align: center;
    padding: 24px 0;
  }
  .results .verdict {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .results .verdict.pass { color: var(--green); }
  .results .verdict.fail { color: var(--red); }

  .score-display {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 96px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
  }
  .score-display .out-of {
    color: var(--ink-faint);
    font-size: 36px;
  }
  .results h2 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .results .sub {
    color: var(--ink-dim);
    margin-bottom: 32px;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 32px;
  }
  .result-stat {
    background: var(--panel);
    padding: 18px 14px;
  }
  .result-stat .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .result-stat .value {
    font-size: 22px;
    color: var(--ink);
  }
  .result-stat .value.green { color: var(--green); }
  .result-stat .value.red { color: var(--red); }
  .result-stat .value.amber { color: var(--amber); }

  .results-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  /* review list */
  .review-section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 16px;
    text-align: left;
  }
  .review-item {
    border-left: 2px solid var(--red);
    padding: 16px 0 16px 18px;
    margin-bottom: 18px;
    text-align: left;
  }
  .review-item .qhead {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .review-item .qtext {
    font-size: 17px;
    margin-bottom: 12px;
    line-height: 1.45;
  }
  .review-item .review-row {
    display: flex;
    gap: 8px;
    margin: 4px 0;
    font-size: 15px;
    align-items: flex-start;
  }
  .review-item .review-row .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 70px;
    padding-top: 2px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .review-item .your { color: var(--red); }
  .review-item .right { color: var(--green); }

  /* practice explanation */
  .explanation {
    background: var(--panel);
    border-left: 3px solid var(--amber);
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .explanation .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 6px;
    display: block;
  }
  .explanation.wrong { border-left-color: var(--red); }
  .explanation.wrong .lbl { color: var(--red); }
  .explanation.right { border-left-color: var(--green); }
  .explanation.right .lbl { color: var(--green); }

  /* timer */
  .timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.05em;
  }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  /* question diagram */
  .q-image-wrap {
    margin: 0 0 28px;
    padding: 18px;
    background: #f6f1e3;
    border: 1px solid var(--line);
    text-align: center;
    border-radius: 2px;
  }
  .q-image-wrap.small {
    padding: 10px;
    margin-bottom: 14px;
    max-width: 320px;
  }
  .q-image {
    max-width: 100%;
    max-height: 360px;
    height: auto;
    display: inline-block;
  }
  .q-image-wrap.small .q-image {
    max-height: 200px;
  }

  /* fade in animation */
  .fade-in {
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === BROWSE / INDEX VIEW === */
  .browse-controls {
    margin-bottom: 24px;
  }
  .browse-search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 16px;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .browse-search:focus {
    border-color: var(--amber);
  }
  .browse-search::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }
  .browse-chapters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .browse-chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .browse-chip:hover { border-color: var(--line-bright); }
  .browse-chip.active {
    background: rgba(255, 179, 71, 0.1);
    border-color: var(--amber);
    color: var(--ink);
  }
  .browse-chip .cnt {
    color: var(--ink-faint);
    margin-left: 4px;
  }

  .browse-list {
    border-top: 1px solid var(--line);
  }
  .browse-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-style: italic;
  }

  .browse-item {
    border-bottom: 1px solid var(--line);
  }
  .browse-row {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--ink);
    padding: 14px 4px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 16px;
    transition: background 0.1s;
  }
  .browse-row:hover {
    background: var(--panel);
  }
  .browse-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 0.05em;
    flex-shrink: 0;
    padding-top: 3px;
    min-width: 44px;
  }
  .browse-ch {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    flex-shrink: 0;
    padding: 4px 0;
    min-width: 60px;
  }
  .browse-q {
    flex: 1;
    line-height: 1.45;
  }
  .browse-icon {
    color: var(--ink-faint);
    font-size: 13px;
    flex-shrink: 0;
    padding-top: 3px;
  }
  .browse-expand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--ink-faint);
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    padding-top: 1px;
  }

  .browse-detail {
    padding: 4px 0 20px 60px;
    animation: fadeIn 0.2s ease;
  }
  @media (max-width: 640px) {
    .browse-detail { padding-left: 12px; }
  }
  .browse-answers {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .browse-answer {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-left: 2px solid var(--line);
    margin-bottom: 6px;
    font-size: 15px;
    line-height: 1.45;
  }
  .browse-answer.correct {
    border-left-color: var(--green);
    background: rgba(132, 214, 118, 0.06);
  }
  .browse-answer .ba-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
    flex-shrink: 0;
    padding-top: 1px;
    min-width: 18px;
  }
  .browse-answer.correct .ba-num {
    color: var(--green);
  }
  .browse-answer .ba-mark {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;

\n     x=\"75.779007\"\n     y=\"45.39513\"\n     id=\"text11382-1-51\"><tspan\n       id=\"tspan11380-7-0\"\n       style=\"font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9.87778px;font-family:'Courier New';-inkscape-font-specification:'Courier New';fill:#000000;fill-opacity:1;stroke:none;stroke-width:1;stroke-opacity:1\"\n       x=\"75.779007\"\n       y=\"45.39513\">2</tspan></text></svg>\n";
const DOCUMENTS = {"preamble":{"title":"Προοίμιο Ερωτηματολογίου","subtitle":"Εξετάσεις για την Απόκτηση Πτυχίου Ραδιοερασιτέχνη — Κατηγορία Εισαγωγικού Επιπέδου (SY)","publisher":"Υπουργείο Υποδομών, Μεταφορών και Δικτύων\nΓενική Γραμματεία Τηλεπικοινωνιών & Ταχυδρομείων\nΔιεύθυνση Διαχείρισης και Ελέγχου Φάσματος Ραδιοσυχνοτήτων","date":"Αθήνα, Μάρτιος 2012","sections":[{"heading":"1. Κατηγορίες Πτυχίων","body":"Τα πτυχία των ραδιοερασιτεχνών χωρίζονται σε δύο κατηγορίες: στην «κατηγορία 1» (κατηγορία HAREC) και στην «κατηγορία εισαγωγικού επιπέδου» (entry level)."},{"heading":"2. Προϋποθέσεις","body":"Οι υποψήφιοι, προκειμένου να συμμετάσχουν στις εξετάσεις για απόκτηση πτυχίου «κατηγορίας 1» ή «κατηγορίας εισαγωγικού επιπέδου», πρέπει να πληρούν τις παρακάτω προϋποθέσεις:\n\n2.1. Να είναι πολίτες Κράτους Μέλους της Ευρωπαϊκής Ένωσης ή του Ευρωπαϊκού Οικονομικού Χώρου. Εφόσον είναι πολίτες άλλων χωρών, να διαθέτουν άδεια παραμονής στην Ελλάδα.\n\n2.2. Κατά την ημέρα υποβολής της αίτησης συμμετοχής τους στις εξετάσεις, να έχουν συμπληρωμένο το δωδέκατο (12ο) έτος της ηλικίας τους και να έχουν αποδεικτικό αποφοίτησης από δημοτικό σχολείο."},{"heading":"3. Αρμόδια Υπηρεσία (ΑΠΥ)","body":"Οι εξετάσεις για την απόκτηση πτυχίου ραδιοερασιτέχνη διενεργούνται από τις Διευθύνσεις Μεταφορών και Επικοινωνιών της Περιφέρειας (ΑΠΥ) στην οποία ανήκει η μόνιμη κατοικία των ενδιαφερομένων."},{"heading":"4. Χρόνος Εξετάσεων — Διαδικασία","body":"4.1. ΟΙ ΕΞΕΤΑΣΕΙΣ ΔΙΕΞΑΓΟΝΤΑΙ ΑΠΟΚΛΕΙΣΤΙΚΑ ΜΕ ΗΛΕΚΤΡΟΝΙΚΟ ΤΡΟΠΟ.\n\n4.2. Οι εξετάσεις διενεργούνται μία (1) φορά ανά εξάμηνο στην Ελληνική γλώσσα. Οι ΑΠΥ ανακοινώνουν έγκαιρα και με κάθε πρόσφορο μέσο την ακριβή ημερομηνία των εξετάσεων, τον τόπο και τις λοιπές λεπτομέρειες προκειμένου οι ενδιαφερόμενοι να υποβάλουν αίτηση με τα απαιτούμενα δικαιολογητικά.\n\n4.3. Οι εξετάσεις πραγματοποιούνται εφόσον έχουν συγκεντρωθεί τουλάχιστον τρεις (3) υποψήφιοι. Εφόσον δεν συγκεντρώνονται τουλάχιστον τρεις (3) υποψήφιοι σε συγκεκριμένη ΑΠΥ, μπορούν οι υποψήφιοι (ή ο μοναδικός υποψήφιος), εάν και οι ίδιοι το επιθυμούν, να παραπέμπονται σε άλλη ΑΠΥ της ιδίας Περιφέρειας, μετά από προηγούμενη συνεννόηση.\n\n4.4. Αιτήσεις γίνονται δεκτές μέχρι πέντε (5) εργάσιμες ημέρες πριν την ημερομηνία διενέργειας των εξετάσεων. Πέντε (5) εργάσιμες ημέρες πριν την ημερομηνία διενέργειας των εξετάσεων αναρτάται στην ΑΠΥ πίνακας με τα ονόματα των υποψηφίων που γίνονται δεκτοί στις εξετάσεις, καθώς και οι λοιπές αναγκαίες πληροφορίες.\n\n4.5. Ύστερα από συνεννόηση μεταξύ των ΑΠΥ της ίδιας Περιφέρειας, μπορεί να αναλαμβάνει το έργο διενέργειας των εξετάσεων για απόκτηση πτυχίου ραδιοερασιτέχνη μία ΑΠΥ για λογαριασμό και των υπολοίπων. Η αρμοδιότητα έκδοσης πτυχίου παραμένει στην ΑΠΥ όπου βρίσκεται η μόνιμη κατοικία του ενδιαφερομένου."},{"heading":"5. Δικαιολογητικά","body":"5.1. Αίτηση.\n\n5.2. Αντίγραφο δελτίου αστυνομικής ταυτότητος ή διαβατηρίου ή άδειας οδήγησης για την ταυτοποίηση του ενδιαφερομένου και τη διαπίστωση της ημερομηνίας γέννησης.\n\n5.3. Σε περιπτώσεις υπηκόων άλλων χωρών που διαμένουν νόμιμα στην Ελλάδα, αποδεικτικά έγγραφα που σχετίζονται με τα στοιχεία τους, την ηλικία, υπηκοότητα και την μόνιμη διαμονή τους, συμπεριλαμβανομένης και της άδειας παραμονής στις περιπτώσεις που προβλέπεται.\n\n5.4. Υπεύθυνη δήλωση στην οποία να αναφέρεται η ταχυδρομική διεύθυνση της μονίμου κατοικίας του.\n\n5.5. Προβλεπόμενο παράβολο.\n\n5.6. Δύο φωτογραφίες (υποβάλλονται μετά την επιτυχή έκβαση των εξετάσεων, για την έκδοση του πτυχίου)."},{"heading":"6. Τρόπος εξετάσεων για την κατηγορία Εισαγωγικού επιπέδου","body":"6.1. Οι υποψήφιοι εξετάζονται σε ερωτηματολόγια πολλαπλών επιλογών στην Ελληνική γλώσσα.\n\n6.2. Η ύλη των εξετάσεων περιλαμβάνεται στο ΠΑΡΑΡΤΗΜΑ 2 της απόφασης 38200/1136/2011 (ΦΕΚ 1969 Β΄) και χωρίζεται στα εξής κεφάλαια:\n  • ΚΕΦΑΛΑΙΟ Α΄ — ΤΕΧΝΙΚΑ ΘΕΜΑΤΑ\n  • ΚΕΦΑΛΑΙΟ Β΄ — ΛΕΙΤΟΥΡΓΙΚΟΙ ΚΑΝΟΝΕΣ ΚΑΙ ΔΙΑΔΙΚΑΣΙΕΣ\n  • ΚΕΦΑΛΑΙΟ Γ΄ — ΕΘΝΙΚΟ & ΔΙΕΘΝΕΣ ΝΟΜΙΚΟ ΠΛΑΙΣΙΟ ΥΠΗΡΕΣΙΑΣ ΕΡΑΣΙΤΕΧΝΗ\n  • ΚΕΦΑΛΑΙΟ Δ΄ — ΒΑΣΙΚΑ ΠΡΑΚΤΙΚΑ ΘΕΜΑΤΑ\n\n6.3. Ο αριθμός των ερωτήσεων ανέρχεται σε εκατό (100) και κατανέμονται για την κατηγορία «εισαγωγικού επιπέδου» σε ποσοστά 20%, 20%, 20% και 40% αντίστοιχα από τα κεφάλαια Α΄, Β΄, Γ΄ και Δ΄ της ύλης των εξετάσεων.\n\n6.4. Θεωρούνται ότι επέτυχαν στις γραπτές εξετάσεις όσοι υποψήφιοι απάντησαν σωστά τουλάχιστον σε 80 από τις 100 ερωτήσεις.\n\n6.5. Όσοι καταθέσουν επικυρωμένο φωτοαντίγραφο τίτλου σπουδών τριτοβάθμιας εκπαίδευσης (Πανεπιστημίου ή ΤΕΙ) της ημεδαπής ή ισοτίμων σχολών της αλλοδαπής, κατεύθυνσης ηλεκτρονικής ή ηλεκτρολογίας ή τηλεπικοινωνιών, απαλλάσσονται από τη γραπτή εξέταση στο κεφάλαιο Α΄ «Τεχνικά Θέματα». Στην περίπτωση αυτή, το ερωτηματολόγιο δεν περιέχει τις αντίστοιχες είκοσι (20) ερωτήσεις από το κεφάλαιο Α΄ και θεωρούνται ότι επέτυχαν στις εξετάσεις όσοι υποψήφιοι απάντησαν σωστά τουλάχιστον σε εξήντα τέσσερις (64) από τις ογδόντα (80) υπόλοιπες ερωτήσεις."},{"heading":"7. Νομοθεσία — Πληροφορίες","body":"α. Υπουργική Απόφαση 38200/1136/2011 (ΦΕΚ 1969 Β΄) — βλ. το Έγγραφο «Κανονισμός Λειτουργίας Ερασιτεχνικών Σταθμών Ασυρμάτου» σε αυτή την εφαρμογή.\n\nβ. Επίσημες πληροφορίες παρέχονται μέσω της ιστοσελίδας του αρμόδιου Υπουργείου."}]},"fek":{"title":"Κανονισμός λειτουργίας ερασιτεχνικών σταθμών ασυρμάτου","subtitle":"Υπουργική Απόφαση 38200/1136 — ΦΕΚ Τεύχος Β' Αρ. Φύλλου 1969","publisher":"ΕΦΗΜΕΡΙΣ ΤΗΣ ΚΥΒΕΡΝΗΣΕΩΣ\nΤΗΣ ΕΛΛΗΝΙΚΗΣ ΔΗΜΟΚΡΑΤΙΑΣ","date":"2 Σεπτεμβρίου 2011","preamble":"Ο ΥΦΥΠΟΥΡΓΟΣ ΥΠΟΔΟΜΩΝ, ΜΕΤΑΦΟΡΩΝ ΚΑΙ ΔΙΚΤΥΩΝ\n\nΈχοντας υπόψη:\n\n1. τις διατάξεις:\nα) της παρ. 1 του άρθρου 15 του ν.δ. 1244/1972 όπως αντικαταστάθηκε με την παρ. 2 του άρθρου 2 του ν.2801/2000 (ΦΕΚ Α' 46) περί «ρυθμίσεων θεμάτων Υπουργείου Μεταφορών και Επικοινωνιών και άλλες διατάξεις».\nβ) της παρ. 5 του άρθρου 15 του ν.δ. 1244/1972 που προστέθηκε με την παρ. 3 του άρθρου 2 του ν.2801/2000 (ΦΕΚ Α' 46) καθώς και της παρ. 10 του άρθρου 2 του ν.2801/2000 (ΦΕΚ Α' 46).\nγ) του Π.Δ. 63/2011 (ΦΕΚ Α' 145) «Διορισμός Αντιπροέδρου της Κυβέρνησης, Υπουργών, Αναπληρωτών Υπουργών και Υφυπουργών».\nδ) του Π.Δ. 293/1999 (ΦΕΚ Α' 263) «Οργανισμός του Υπουργείου Μεταφορών και Επικοινωνιών», όπως ισχύει.\nε) της κοινής υπουργικής απόφασης του Πρωθυπουργού και Υπουργού Υποδομών Μεταφορών και Δικτύων 35789/5795 (ΦΕΚ Β' 1778) «Ανάθεση αρμοδιοτήτων στον Υφυπουργό Υποδομών, Μεταφορών και Δικτύων Ιωάννη Μαγκριώτη»\nστ) της υπουργικής απόφασης 68000/763/9-12-2002 (ΦΕΚ Β' 1579) «Κανονισμός λειτουργίας ερασιτεχνικών σταθμών ασυρμάτου».\nζ) της κοινής υπουργικής απόφασης 25000/740 (ΦΕΚ Β' 1252 «Αναπροσαρμογή παραβόλων και τελών για την απόκτηση Γενικού πτυχίου ραδιοτηλεγραφητή-ραδιοτηλεφωνητή, πτυχίο ραδιοερασιτέχνη, έκδοση ή ανανέωση ή τροποποίηση αδείας λειτουργίας ερασιτεχνικού ή πειραματικού σταθμού ασυρμάτου ή ραδιοσταθμού CB. - Επιβολή παραβόλων και τελών για τη χορήγηση ειδικού διακριτικού κλίσης σε ραδιοερασιτέχνες και για την έγκριση αδειοδότηση και συμπερίληψη σταθμού στους εγκεκριμένους πίνακες Αναμεταδοτών, Επαναληπτών και Ραδιοφάρων της υπηρεσίας ραδιοερασιτέχνη».\n\n2. Την ανάγκη έκδοσης νέου Κανονισμού Ραδιοερασιτεχνών προσαρμοσμένου στις νεώτερες εκδόσεις των Συστάσεων T/R 61-01 και T/R 61-02 της Ευρωπαϊκής Συνδιάσκεψης Τηλεπικοινωνιών και Ταχυδρομείων (CEPT).\n\n3. Το γεγονός ότι από την απόφαση αυτή δεν προκαλείται δαπάνη σε βάρος του κρατικού προϋπολογισμού,\n\nαποφασίζουμε:","articles":[{"number":"Άρθρο 1","title":"Σκοπός","body":"Σκοπός του παρόντος Κανονισμού είναι ο καθορισμός των όρων εγκατάστασης και λειτουργίας των ραδιοερασιτεχνικών σταθμών, των διαδικασιών χορήγησης των αδειών, τα της έγκρισης πινάκων αναμεταδοτών-επαναληπτών-ραδιοφάρων, τα της εγκατάστασης και λειτουργίας σταθμών ασυρμάτου από αλλοδαπούς ραδιοερασιτέχνες στην Ελληνική επικράτεια, τα των εξετάσεων για την απόκτηση ραδιοερασιτεχνικών πτυχίων, οι ψηφιακές, δορυφορικές και τηλεοπτικές επικοινωνίες της υπηρεσίας ερασιτέχνη και γενικώς το πλαίσιο άσκησης των ραδιοερασιτεχνικών δραστηριοτήτων."},{"number":"Άρθρο 2","title":"Ορισμοί","body":"Για την εφαρμογή του Κανονισμού αυτού οι ακόλουθοι όροι έχουν την έννοια που τους αποδίδεται παρακάτω:\n\n1. «Τηλεπικοινωνία»: Η μετάδοση, εκπομπή ή λήψη σημείων, σημάτων, γραπτού κειμένου, εικόνων, ήχων ή πληροφοριών κάθε είδους που πραγματοποιείται με ασύρματα ραδιοηλεκτρικά ή άλλα ηλεκτρομαγνητικά συστήματα.\n\n2. «Υπηρεσία ραδιοεπικοινωνίας»: Υπηρεσία που περιλαμβάνει τη μεταβίβαση, την εκπομπή και/ή τη λήψη ραδιοκυμάτων για ειδικούς σκοπούς τηλεπικοινωνίας\n\n3. «Υπηρεσία ερασιτέχνη» ή «υπηρεσία ραδιοερασιτέχνη»: Υπηρεσία ραδιοεπικοινωνίας που έχει ως σκοπό την αυτοδιδασκαλία, την αλληλοεπικοινωνία, την τεχνολογική έρευνα και την τηλεπικοινωνιακή υποστήριξη επιχειρήσεων βοήθειας σε περιπτώσεις καταστάσεων έκτακτης ανάγκης και καταστροφών που διεξάγεται από ερασιτέχνες, δηλαδή από πρόσωπα κατάλληλα εξουσιοδοτημένα που ασχολούνται με τη ραδιοηλεκτρική τεχνική αποκλειστικά για προσωπικό σκοπό και χωρίς οικονομικό όφελος.\n\n4. «Υπηρεσία ερασιτέχνη μέσω δορυφόρου»: Υπηρεσία ραδιοεπικοινωνίας που χρησιμοποιεί διαστημικούς σταθμούς σε δορυφόρους της Γης για τους ίδιους σκοπούς όπως η υπηρεσία ερασιτέχνη.\n\n5. «Ερασιτέχνης» ή «Ραδιοερασιτέχνης»: Άτομο το οποίο διαθέτει άδεια που του δίνει τη δυνατότητα να διεξάγει νόμιμα την υπηρεσία ραδιοερασιτέχνη. Για τις ανάγκες του κανονισμού, οι όροι «ερασιτέχνης» και «ραδιοερασιτέχνης» έχουν το ίδιο νόημα.\n\n6. «Σταθμός (ή σταθμός ραδιοεπικοινωνίας)»: Ένας ή περισσότεροι πομποί ή δέκτες ή συνδυασμός πομπών και δεκτών, συμπεριλαμβανομένων κεραιών και πρόσθετων συσκευών, σε ορισμένη θέση, που είναι αναγκαίοι για τη διεξαγωγή συγκεκριμένης υπηρεσίας ραδιοεπικοινωνίας (ή για την υπηρεσία ραδιοαστρονομίας). Κάθε σταθμός χαρακτηρίζεται από το είδος της υπηρεσίας στην οποία συμμετέχει και από το αν λειτουργεί σε μόνιμη ή προσωρινή βάση.\n\n6.1. Σταθερός σταθμός: σταθμός εγκατεστημένος σε μόνιμη ή εναλλακτική θέση.\n\n6.2. Κινητός σταθμός: σταθμός εγκατεστημένος μόνιμα σε μεταφορικό μέσο, προοριζόμενος να χρησιμοποιείται κατά τη διάρκεια της κίνησης ή της στάσης του μέσου. Αναλόγως του μεταφορικού μέσου που είναι εγκατεστημένος ο ως άνω σταθμός διακρίνεται σε:\nα) «κινητό σταθμό ξηράς» ο οποίος είναι σταθμός εγκατεστημένος επί οχήματος.\nβ) «κινητό σταθμό αεροσκάφους» ο οποίος είναι κινητός σταθμός εγκατεστημένος επί αεροσκάφους.\nγ) «κινητό σταθμό πλοίου» ο οποίος είναι κινητός σταθμός εγκατεστημένος επί πλοίου.\n\n6.3. Φορητός σταθμός: ο κινητός σταθμός που φέρεται αποκλειστικά από άνθρωπο και τροφοδοτείται από πηγή που δύναται να φέρει ο χειριστής του σταθμού. Ο φορητός σταθμός μπορεί να τροφοδοτείται από σταθερή πηγή ηλεκτρισμού σε προσωρινή θέση εγκατάστασης τόπο διαμονής του ραδιοερασιτέχνη (π.χ. χώρο φιλοξενίας, ξενοδοχείο, κατασκήνωση κ.λπ.).\n\n6.4. Μη επανδρωμένος σταθμός: σταθμός που λειτουργεί σε μόνιμη ή προσωρινή βάση χωρίς τη συνεχή παρουσία χειριστή (π.χ. αναμεταδότες, επαναλήπτες, ραδιοφάροι).\n\n7. «Σταθμός ραδιοερασιτέχνη» ή «σταθμός ερασιτέχνη»: Ο σταθμός της υπηρεσίας ερασιτέχνη.\n\n8. «Κατασκευή κεραίας»: Το σύστημα των κεραιών εκπομπής και λήψης ραδιοσημάτων μετά των κατασκευών στήριξής τους, εξαρτημάτων και παρελκομένων. Τα παθητικά κάτοπτρα ανάκλασης ραδιοσημάτων θεωρούνται επίσης ως κατασκευές κεραίας. Στο ύψος της κεραίας περιλαμβάνεται και ο φωτισμός ασφαλείας ή το αλεξικέραυνο.\n\n9. «Πτυχίο ραδιοερασιτέχνη»: είναι το αποδεικτικό γνώσεων και ικανοτήτων που απονέμεται στον ραδιοερασιτέχνη έπειτα από την επιτυχή δοκιμασία του στις εξετάσεις «απόκτησης πτυχίου ραδιοερασιτέχνη».\n\n10. «Εναρμονισμένο πιστοποιητικό εξετάσεων ραδιοερασιτέχνη» (HARMONISED AMATEUR RADIO EXAMINATION CERTIFICATE - HAREC): Είναι το πτυχίο ραδιοερασιτέχνη (υπό μορφή πιστοποιητικού ή βεβαίωσης) και χορηγείται σε φυσικά πρόσωπα έπειτα από εξετάσεις σε ύλη που είναι εναρμονισμένη με την ισχύουσα Σύσταση της CEPT T/R 61-02.\n\n11. «Παρεμβολή»: Το αποτέλεσμα ανεπιθύμητης ενέργειας, που οφείλεται σε μία ή συνδυασμό περισσοτέρων εκπομπών ή επαγωγών κατά τη λήψη σε ένα σύστημα ραδιοεπικοινωνίας και εκδηλώνεται με κάθε είδους υποβάθμιση της απόδοσης, λανθασμένης ερμηνείας ή απώλειας πληροφορίας η οποία θα μπορούσε να αποφευχθεί εάν η ανεπιθύμητη ενέργεια ήταν απούσα.\n\n12. «Επιβλαβείς ή επιζήμιες παρεμβολές»: οι παρεμβολές οι οποίες θέτουν σε κίνδυνο τη λειτουργία υπηρεσίας ραδιοπλοήγησης ή άλλων υπηρεσιών ασφαλείας ή όσες, καθ' οιονδήποτε τρόπο, υποβαθμίζουν σοβαρά, εμποδίζουν ή επανειλημμένα διακόπτουν μία υπηρεσία ραδιοεπικοινωνιών που λειτουργεί σύμφωνα με τους εφαρμοστέους κοινοτικούς ή εθνικούς κανονισμούς.\n\n13. «Κατανομή ραδιοσυχνότητας σε δευτερεύουσα βάση»: Αφορά ραδιοσυχνότητες των οποίων η χρήση για παροχή υπηρεσιών, υπόκεινται στους εξής περιορισμούς:\n\n13.1. Δεν προκαλούν παρεμβολές στους σταθμούς υπηρεσίας που εμφανίζεται στην κατανομή σε πρωτεύουσα βάση, αδιακρίτως αν οι συχνότητες τους εκχωρήθηκαν νωρίτερα ή πρόκειται να εκχωρηθούν μεταγενέστερα.\n\n13.2. Δεν δικαιούνται προστασία από παρεμβολές που προκαλούνται από σταθμούς μιας υπηρεσίας που εμφανίζεται στην κατανομή σε πρωτεύουσα βάση, στους οποίους οι συχνότητες εκχωρήθηκαν νωρίτερα ή πρόκειται να εκχωρηθούν μεταγενέστερα.\n\n13.3. Έχουν δικαίωμα προστασίας από παρεμβολές που προκαλούνται από σταθμούς της ίδιας υπηρεσίας ή άλλης υπηρεσίας που εμφανίζεται επίσης σε δευτερεύουσα βάση εφόσον οι συχνότητες τους εκχωρήθηκαν μεταγενέστερα.\n\n14. «Ψηφιακή επικοινωνία (digimode)»: είναι η μετάδοση ψηφιακών δεδομένων.\n\n15. «Τηλεοπτική επικοινωνία (ATV - Amateur TeleVision)»: είναι η ασύρματη μετάδοση εικόνων, μεγάλου εύρους συχνοτήτων εκπομπής, της υπηρεσίας ραδιοερασιτέχνη.\n\n16. «Τηλεοπτική επικοινωνία αργής σάρωσης (SSTV-Slow Scan TV)»: είναι η ασύρματη μετάδοση σταθερών εικόνων, μικρού εύρους συχνοτήτων εκπομπής.\n\n17. «Δορυφορική επικοινωνία (satellite communication)»: είναι η μετάδοση φωνής ή ψηφιακών δεδομένων ή η τηλεγραφία, μέσω τεχνητών δορυφόρων της υπηρεσίας ραδιοερασιτέχνη.\n\n18. «Επικοινωνία μέσω σελήνης (moonbounce communication / EME-Earth Moon Earth)»: είναι η μετάδοση σύντομων μηνυμάτων, με χειριστήριο ή με ψηφιακά δεδομένα, στενού εύρους συχνοτήτων εκπομπής, με σκέδαση στην επιφάνεια της σελήνης.\n\n19. «Επικοινωνία μέσω μετεωριτών (MS-Meteor Scatter communication)»: είναι η μετάδοση σύντομων μηνυμάτων (τηλεγραφίας, φωνής ή ψηφιακών δεδομένων) με σκέδαση σε σμήνη μετεωριτών ή τυχαίους μετεωρίτες που αναφλέγονται στη γήινη ατμόσφαιρα.\n\n20. «Επικοινωνία διάχυτου φάσματος (spread spectrum communication)»: είναι η μετάδοση αναλογικών σημάτων ή ψηφιακών δεδομένων σε προκαθορισμένη αλληλουχία διαφορετικών συχνοτήτων (frequency hopping) ή σε μεγάλο στιγμιαίο εύρος συχνοτήτων εκπομπής (direct sequence).\n\n21. «Επικοινωνία ραδιοακρόασης SWL (Short wave listening)»: είναι η ραδιοακρόαση στις επιτρεπόμενες ζώνες συχνοτήτων της υπηρεσίας ερασιτέχνη και κυρίως μεταξύ 1700 kHz and 30 MHz, με χρήση διαφόρων τεχνολογιών. Η ραδιοακρόαση αποσκοπεί στην ενημέρωση επί τεχνικών θεμάτων ραδιοεπικοινωνιών και στην ψυχαγωγία των ενδιαφερομένων μέσω της παρακολούθησης της δραστηριότητας στις ζώνες των ραδιοερασιτεχνικών συχνοτήτων.\n\n22. «Ισχύς κορυφής της περιβάλλουσας εξόδου πομπού (PEP-Peak Envelope Power)»: είναι η ισχύς εξόδου πομπού κατά τη στιγμή της κορυφής της περιβάλλουσας της κυματομορφής εκπομπής και μετράται με κατάλληλα βαττόμετρα.\n\n23. «Αρμόδια περιφερειακή υπηρεσία (ΑΠΥ)»: Η οικεία υπηρεσία της Περιφέρειας που ασκεί τις αρμοδιότητες του τομέα Ε' «Μεταφορών–Επικοινωνιών», του Άρθρου 186 «Αρμοδιότητες Περιφερειών» του ν. 3852/2010 «Νέα Αρχιτεκτονική της Αυτοδιοίκησης και της Αποκεντρωμένης Διοίκησης - Πρόγραμμα Καλλικράτης» (ΦΕΚ Α' 87). Η ΑΠΥ έχει αρμοδιότητα κατά γεωγραφική περιοχή στην οποία ανήκει η έδρα ή η μόνιμη κατοικία των ενδιαφερομένων. Δικαιολογητικά για έκδοση, τροποποίηση ή ανανέωση άδειας ραδιοερασιτέχνη μπορούν να υποβάλλονται και στα Κέντρα Εξυπηρέτησης Πολιτών.\n\n24. «Κεντρική Υπηρεσία του Υπουργείου Υποδομών Μεταφορών και Δικτύων»: Η Διεύθυνση του Υπουργείου Υποδομών Μεταφορών και Δικτύων η οποία έχει ορισθεί ως αρμόδια για τα θέματα της υπηρεσίας ερασιτέχνη."},{"number":"Άρθρο 3","title":"Εξετάσεις για την απόκτηση πτυχίου Ραδιοερασιτέχνη","body":"1. Τα πτυχία των ραδιοερασιτεχνών χωρίζονται σε δύο κατηγορίες στην «κατηγορία 1» (κατηγορία HAREC) και στην «κατηγορία εισαγωγικού επιπέδου» (entry level).\n\n2. Τα πτυχία ραδιοερασιτεχνών «κατηγορίας 1», είναι εναρμονισμένα πτυχία HAREC σύμφωνα με τη Σύσταση TR-61-02 όπως ισχύει.\n\n3. Τα πτυχία ραδιοερασιτεχνών «κατηγορίας εισαγωγικού επιπέδου» (entry level), είναι εναρμονισμένα με την Αναφορά της Επιτροπής Ηλεκτρονικών Επικοινωνιών της CEPT «ECC REPORT 89 - A radio amateur entry level examination and licence».\n\n4. Οι υποψήφιοι προκειμένου να συμμετάσχουν στις εξετάσεις για απόκτηση πτυχίου «κατηγορίας 1» η «κατηγορίας εισαγωγικού επιπέδου» πρέπει να πληρούν τις παρακάτω προϋποθέσεις:\n\n4.1. Να είναι πολίτες Κράτους Μέλους της Ευρωπαϊκής Ένωσης ή του Ευρωπαϊκού Οικονομικού Χώρου. Εφόσον είναι πολίτες άλλων χωρών, να διαθέτουν άδεια παραμονής στην Ελλάδα.\n\n4.2. Κατά την ημέρα υποβολής της αίτησης συμμετοχής τους στις εξετάσεις, να έχουν συμπληρωμένο το δωδέκατο (12ο) έτος της ηλικίας τους και να έχουν αποδεικτικό αποφοίτησης από δημοτικό σχολείο.\n\n5. Οι εξετάσεις για την απόκτηση πτυχίου ραδιοερασιτέχνη διενεργούνται από τις ΑΠΥ μία (1) φορά ανά εξάμηνο στην Ελληνική γλώσσα. Οι ΑΠΥ ανακοινώνουν έγκαιρα και με κάθε πρόσφορο μέσο, την ακριβή ημερομηνία των εξετάσεων, τον τόπο και τις λοιπές λεπτομέρειες προκειμένου οι ενδιαφερόμενοι να υποβάλουν αίτηση με τα απαιτούμενα δικαιολογητικά.\n\n6. Οι εξετάσεις πραγματοποιούνται εφόσον έχουν συγκεντρωθεί τουλάχιστον τρείς (3) υποψήφιοι. Εφόσον δεν συγκεντρώνονται τουλάχιστον τρείς (3) υποψήφιοι σε συγκεκριμένη ΑΠΥ, μπορούν οι υποψήφιοι (ή ο μοναδικός υποψήφιος) εάν και οι ίδιοι το επιθυμούν, να παραπέμπονται σε άλλη ΑΠΥ της ιδίας Περιφέρειας, μετά από προηγούμενη συνεννόηση.\n\n7. Για τη συμμετοχή στις εξετάσεις προς απόκτηση πτυχίου ραδιοερασιτέχνη οποιασδήποτε κατηγορίας, υποβάλλονται στην ΑΠΥ όπου βρίσκεται η μόνιμη κατοικία του ενδιαφερομένου, τα εξής δικαιολογητικά:\n\n7.1. Αίτηση.\n\n7.2. Αντίγραφο δελτίου αστυνομικής ταυτότητος ή διαβατηρίου ή άδειας οδήγησης για την ταυτοποίηση του ενδιαφερομένου και τη διαπίστωση της ημερομηνίας γέννησης.\n\n7.3. Σε περιπτώσεις υπηκόων άλλων χωρών που διαμένουν νόμιμα στην Ελλάδα, αποδεικτικά έγγραφα που σχετίζονται με τα στοιχεία τους, την ηλικία, υπηκοότητα και την μόνιμη διαμονή τους συμπεριλαμβανομένης και της άδειας παραμονής στις περιπτώσεις που προβλέπεται.\n\n7.4. Υπεύθυνη δήλωση στην οποία να αναφέρεται η ταχυδρομική διεύθυνση της μονίμου κατοικίας του.\n\n7.5. Προβλεπόμενο παράβολο.\n\n7.6. Δύο φωτογραφίες (υποβάλλονται μετά την επιτυχή έκβαση των εξετάσεων, για την έκδοση του πτυχίου).\n\n8. Αιτήσεις γίνονται δεκτές μέχρι πέντε (5) εργάσιμες ημέρες πριν την ημερομηνία διενέργειας των εξετάσεων. Πέντε (5) εργάσιμες ημέρες πριν την ημερομηνία διενέργειας των εξετάσεων αναρτάται στην ΑΠΥ πίνακας με τα ονόματα των υποψηφίων που γίνονται δεκτοί στις εξετάσεις, καθώς και οι λοιπές αναγκαίες πληροφορίες.\n\n9. Ύστερα από συνεννόηση μεταξύ των ΑΠΥ της ίδιας Περιφέρειας, μπορεί να αναλαμβάνει το έργο διενέργειας των εξετάσεων για απόκτηση πτυχίου ραδιοερασιτέχνη μία ΑΠΥ για λογαριασμό και των υπολοίπων. Η αρμοδιότητα έκδοσης πτυχίου παραμένει στην ΑΠΥ όπου βρίσκεται η μόνιμη κατοικία του ενδιαφερομένου.\n\n10. Οι ραδιοερασιτέχνες της «κατηγορίας εισαγωγικού επιπέδου» (ENTRY LEVEL) προκειμένου να αναβαθμίσουν την άδεια τους σε «κατηγορία 1» (άδεια CEPT) πρέπει να λάβουν πτυχίο «κατηγορίας 1»."},{"number":"Άρθρο 4","title":"Εξεταστική Επιτροπή","body":"1. Με απόφαση της ΑΠΥ συγκροτείται «Εξεταστική Επιτροπή» διενέργειας εξετάσεων για την απόκτηση πτυχίου ραδιοερασιτέχνη. Με την απόφαση αυτή ορίζεται ο πρόεδρος της Εξεταστικής Επιτροπής και δύο (2) τακτικά μέλη, με τους αναπληρωματικούς τους.\n\n2. Η Εξεταστική Επιτροπή συγκροτείται από υπαλλήλους της ΑΠΥ. Η Εξεταστική Επιτροπή συγκαλείται έπειτα από πρόσκληση του προέδρου της και λαμβάνει αποφάσεις κατά πλειοψηφία."},{"number":"Άρθρο 5","title":"Διαδικασίες Εξετάσεων, Εξεταζόμενα Μαθήματα και Βαθμολογία","body":"1. Οι υποψήφιοι εξετάζονται γραπτώς σε ερωτηματολόγια πολλαπλών επιλογών στην Ελληνική γλώσσα.\n\n2. Η ύλη των εξετάσεων περιλαμβάνεται στο ΠΑΡΑΡΤΗΜΑ 2 της απόφασης αυτής και χωρίζεται στα εξής κεφάλαια:\n\n2.1. ΚΕΦΑΛΑΙΟ Α΄ – ΤΕΧΝΙΚΑ ΘΕΜΑΤΑ.\n\n2.2. ΚΕΦΑΛΑΙΟ Β΄ – ΛΕΙΤΟΥΡΓΙΚΟΙ ΚΑΝΟΝΕΣ ΚΑΙ ΔΙΑΔΙΚΑΣΙΕΣ.\n\n2.3. ΚΕΦΑΛΑΙΟ Γ' – ΕΘΝΙΚΟ & ΔΙΕΘΝΕΣ ΝΟΜΙΚΟ ΠΛΑΙΣΙΟ ΥΠΗΡΕΣΙΑΣ ΕΡΑΣΙΤΕΧΝΗ.\n\n2.4. ΚΕΦΑΛΑΙΟ Δ'– ΒΑΣΙΚΑ ΠΡΑΚΤΙΚΑ ΘΕΜΑΤΑ.\n\n3. Ειδικά, οι υποψήφιοι για απόκτηση πτυχίου ραδιοερασιτέχνη «κατηγορίας εισαγωγικού επιπέδου» εξετάζονται σε βασικές γνώσεις επί πρακτικών, λειτουργικών, τεχνικών και θεσμικών θεμάτων της ανωτέρω ύλης.\n\n4. Η κεντρική υπηρεσία του ΥΥΜΔ στα πλαίσια ειδικών δράσεών της, έργων, ειδικών εργασιών ή μελετών, μεριμνά:\n\n4.1. για την προμήθεια κατάλληλου λογισμικού με το οποίο θα πραγματοποιείται η ηλεκτρονική εξέταση και την εγκατάσταση του στις ΑΠΥ, για την εκπαίδευση προσωπικού, καθώς και για τις λοιπές αναγκαίες λεπτομέρειες.\n\n4.2. για τη συγκρότηση, συντήρηση και ανανέωση βάσης δεδομένων στο Υπουργείο Υποδομών Μεταφορών και Δικτύων, με ικανό αριθμό ερωτήσεων από την ύλη των εξετάσεων κατάλληλα διαχωρισμένων στους βαθμούς δυσκολίας που αντιστοιχίζονται στην «κατηγορία 1» ή/και στην «κατηγορία εισαγωγικού επιπέδου».\n\n4.3. για τον τύπο των εντύπων που θα εκτυπώνει το λογισμικό και όλες τις συναφείς λεπτομέρειες.\n\n4.4. για την παροχή στις ΑΠΥ οδηγιών που αποσκοπούν στην αποτελεσματικότερη διενέργεια των εξετάσεων και για την αποστολή νεωτέρων ενημερώσεων των σχετικών ηλεκτρονικών αρχείων.\n\n4.5. για τη διάθεση στο κοινό των ερωτήσεων που σχετίζεται με τις εξετάσεις ραδιοερασιτεχνών, μέσω του ιστοτόπου του Υπουργείου Υποδομών Μεταφορών και Δικτύων.\n\n5. Εξετάσεις με την μορφή ερωτηματολογίων πολλαπλών επιλογών (ηλεκτρονική εξέταση):\n\n5.1. Η δοκιμασία περιλαμβάνει την εξέταση των υποψηφίων σε ερωτηματολόγιο πολλαπλών επιλογών. Οι αριθμός των ερωτήσεων ανέρχεται σε εκατό (100) και κατανέμονται για την «κατηγορία 1» σε ποσοστά 50%, 30%, 20% αντίστοιχα από τα κεφάλαια Α', Β', Γ' της ύλης των εξετάσεων και για την κατηγορία «εισαγωγικού επιπέδου» σε ποσοστά 20%, 20%, 20% και 40% αντίστοιχα από τα κεφάλαια Α', Β', Γ' και Δ' της ύλης των εξετάσεων.\n\n5.2. Θεωρούνται ότι επέτυχαν στις γραπτές εξετάσεις όσοι υποψήφιοι απάντησαν σωστά τουλάχιστον σε 80 από τις 100 ερωτήσεις.\n\n5.3. Όσοι καταθέσουν επικυρωμένο φωτοαντίγραφο τίτλου σπουδών τριτοβάθμιας εκπαίδευσης (Πανεπιστημίου ή ΤΕΙ) της ημεδαπής ή ισοτίμων σχολών της αλλοδαπής, κατεύθυνσης ηλεκτρονικής ή ηλεκτρολογίας ή τηλεπικοινωνιών, απαλλάσσονται από την γραπτή εξέταση στο κεφάλαιο Α΄ «Τεχνικά Θέματα». Στην περίπτωση αυτή, το ερωτηματολόγιο πολλαπλών επιλογών διαμορφώνεται ως εξής:\n\nα) για την «κατηγορία 1» δεν περιέχει τις αντίστοιχες πενήντα (50) ερωτήσεις και θεωρούνται ότι επέτυχαν στις εξετάσεις όσοι υποψήφιοι απάντησαν σωστά τουλάχιστον σε σαράντα (40) από τις πενήντα (50) υπόλοιπες ερωτήσεις.\n\nβ) για την κατηγορία «εισαγωγικού επιπέδου» δεν περιέχει τις αντίστοιχες είκοσι (20) ερωτήσεις και θεωρούνται ότι επέτυχαν στις εξετάσεις όσοι υποψήφιοι απάντησαν σωστά τουλάχιστον σε εξήντα τέσσερις (64) από τις ογδόντα (80) υπόλοιπες ερωτήσεις.\n\n5.4. Η δοκιμασία διεξάγεται αποκλειστικά με ηλεκτρονικό τρόπο με την χρήση εγκατεστημένου ηλεκτρονικού συστήματος εξετάσεων Ραδιοερασιτεχνών, στις ΑΠΥ.\n\n5.5. Η δοκιμασία διαρκεί δύο (2) ώρες. Οι υποψήφιοι μπορούν να αποχωρούν από την αίθουσα οποτεδήποτε εντός της διάρκειας των εξετάσεων εκτός από τους δύο (2) τελευταίους υποψηφίους οι οποίοι αποχωρούν ταυτόχρονα. Στην περίπτωση εξέτασης υποψηφίου με αναπηρία, σύμφωνα με την παρ.11 του παρόντος άρθρου, ο συνολικός χρόνος της δοκιμασίας μπορεί να επεκτείνεται κατά μέγιστο μία (1) ώρα ανά περίπτωση, κατά την κρίση της Εξεταστικής Επιτροπής.\n\n5.6. Αφού ολοκληρωθεί η διαδικασία των εξετάσεων, η Εξεταστική Επιτροπή:\n\nα) Εκτυπώνει «Ενημερωτικό Δελτίο Αποτελεσμάτων» για κάθε υποψήφιο, το οποίο παραδίδει στους υποψηφίους που είναι παρόντες.\n\nβ) Εκτυπώνει συνολικά αποτελέσματα της εξέτασης, με τα ονοματεπώνυμα των υποψηφίων, τη βαθμολογία τους, την ένδειξη «ΕΠΕΤΥΧΕ» ή ΑΠΟΡΡΙΦΘΗΚΕ» και λοιπές λεπτομέρειες. Η Εξεταστική Επιτροπή υποβάλλει τα συνολικά αποτελέσματα στην ΑΠΥ, η οποία στη συνέχεια μεριμνά για την ανάρτησή τους στο υπηρεσιακό κατάστημα και την αποστολή τους στις άλλες ΑΠΥ από τις οποίες προέρχονται ενδεχομένως υποψήφιοι.\n\n6. Εφόσον κατά τη διάρκεια των εξετάσεων διαπιστωθεί απόπειρα εξαπάτησης της Εξεταστικής Επιτροπής από υποψήφιο, πέραν άλλων τυχόν νομικών κυρώσεων, ο υποψήφιος απορρίπτεται.\n\n7. Οι υποψήφιοι που δεν προσέρχονται προς εξέταση την καθορισμένη ημερομηνία και ώρα θεωρούνται αποτυχόντες.\n\n8. Τα «Ενημερωτικά Δελτία Αποτελεσμάτων» των υποψηφίων, φυλάσσονται στην ΑΠΥ που διενήργησε τις εξετάσεις για ένα (1) έτος. Μετά την παρέλευση του έτους καταστρέφονται.\n\n9. Οι αποτυχόντες μπορούν να προσέλθουν για εξέταση σε επόμενες εξεταστικές περιόδους με την υποχρέωση να υποβάλουν νέα αίτηση με όλα τα προβλεπόμενα δικαιολογητικά.\n\n10. Τα πτυχία των επιτυχόντων εκδίδονται από τις ΑΠΥ σε δύο αντίγραφα, από τα οποία ένα παραδίδεται (ή αποστέλλεται ταχυδρομικά) στον αδειούχο και το άλλο παραμένει στο υπηρεσιακό αρχείο.\n\n11. Τα άτομα με αναπηρία (τυφλοί, παραπληγικοί, ημιπληγικοί, άτομα με μεγάλη κινητική αναπηρία κ.λ.π.) με ποσοστό 50% και άνω βεβαιωμένο από τις αρμόδιες υγειονομικές αρχές, είναι δυνατόν να εξετάζονται σε συνθήκες αρμόζουσες ανάλογα με την πάθηση τους, κατά την κρίση της Εξεταστικής Επιτροπής και ανάλογα με τις δυνατότητες της υπηρεσίας που διενεργεί τις εξετάσεις.\n\n12. Απαλλάσσονται από κάθε είδους εξέταση οι κάτοχοι γενικού πτυχίου χειριστή ασυρμάτου του Υπουργείου Υποδομών Μεταφορών και Δικτύων και οι διπλωματούχοι ραδιοτηλεγραφητές Α΄ και Β΄ τάξης του Εμπορικού Ναυτικού. Οι ανωτέρω μπορούν να καταθέτουν σχετική αίτηση για την απόκτηση πτυχίου ραδιοερασιτέχνη «κατηγορίας 1» με τα σχετικά δικαιολογητικά και σύμφωνα με τις διαδικασίες που προβλέπονται, καθ' όλη τη διάρκεια του έτους. Η αίτηση συνοδεύεται επίσης από θεωρημένα έγγραφα που αποδεικνύουν την υπαγωγή των ενδιαφερομένων στις αντίστοιχες περιπτώσεις."},{"number":"Άρθρο 6","title":"Κατηγορίες ραδιοερασιτεχνικών αδειών","body":"1. Οι εκδιδόμενες άδειες ραδιοερασιτεχνών διακρίνονται σε δύο κατηγορίες, στην «κατηγορία 1» η οποία είναι ισοδύναμη-αντίστοιχη της άδειας \"CEPT radio amateur license\" της Σύστασης Τ/R 61-01 της Ευρωπαϊκής Συνδιάσκεψης Ταχυδρομείων και Τηλεπικοινωνιών (CEPT) όπως ισχύει και στην «κατηγορία εισαγωγικού επιπέδου» η οποία είναι εναρμονισμένη με την Αναφορά της Επιτροπής Ηλεκτρονικών Επικοινωνιών της CEPT «ECC REPORT 89 – A radio amateur entry level examination and licence» όπως ισχύει. Η «κατηγορία εισαγωγικού επιπέδου» απευθύνεται σε ενδιαφερόμενους που επιθυμούν να ασχοληθούν εισαγωγικά με τον ραδιοερασιτεχνισμό ή/και την ακρόαση ραδιοσταθμών (SWL-Short wave listening) χωρίς να απαιτείται λεπτομερειακή γνώση τεχνικών και επιστημονικών θεμάτων του ραδιοηλεκτρικού τομέα. Τα δικαιώματα χρήσης των αδειών αυτών έχουν ως εξής:\n\n1.1. Οι κάτοχοι άδειας «κατηγορίας 1» (άδεια CEPT) έχουν δικαίωμα χρήσης όλων των εκχωρημένων υποζωνών συχνοτήτων στην «υπηρεσία ραδιοερασιτέχνη» και στην «υπηρεσία ραδιοερασιτέχνη μέσω Δορυφόρου» σύμφωνα με τον Εθνικό Κανονισμό Κατανομής Ζωνών Συχνοτήτων και τις διατάξεις του παρόντος κανονισμού. Η άδεια «κατηγορίας 1» χορηγείται σε κατόχους πτυχίου «κατηγορίας 1» ή σε κάτοχο αντιστοίχου πτυχίου HAREC της αλλοδαπής ή σχετικής βεβαίωσης σύμφωνα με τη Σύσταση Τ/R 61-02 και επιτρέπει στον κάτοχό της, σύμφωνα με τις διατάξεις του παρόντος, την άσκηση ραδιοερασιτεχνικής δραστηριότητας στην Ελληνική επικράτεια καθώς και στις χώρες που έχουν αποδεχθεί την υπόψη Σύσταση στα πλαίσια αμοιβαιότητας και σύμφωνα με τις αντίστοιχες εθνικές νομοθεσίες και τους περιορισμούς της Σύστασης.\n\n1.2. Οι κάτοχοι άδειας «κατηγορίας εισαγωγικού επιπέδου» έχουν περιορισμένα δικαιώματα χρήσης των εκχωρημένων υποζωνών συχνοτήτων στην «υπηρεσία ερασιτέχνη» και στην «υπηρεσία ερασιτέχνη μέσω Δορυφόρου» σύμφωνα με τον Εθνικό Κανονισμό Κατανομής Ζωνών Συχνοτήτων (ΕΚΚΖΣ) και τις διατάξεις του παρόντος κανονισμού. Η άδεια «κατηγορίας εισαγωγικού επιπέδου» χορηγείται σε κατόχους αντίστοιχου πτυχίου ραδιοερασιτέχνη «κατηγορίας εισαγωγικού επιπέδου» και επιτρέπει στον κάτοχό της την άσκηση ραδιοερασιτεχνικής δραστηριότητας στην Ελληνική επικράτεια.\n\n2. Για τους ραδιοερασιτεχνικούς αναμεταδότες-επαναλήπτες-ραδιοφάρους χορηγούνται ειδικές άδειες «κατηγορίας 1» από τις ΑΠΥ και εκδίδεται σχετικός Πανελλαδικός Πίνακας από την Κεντρική Υπηρεσία του ΥΥΜΔ."},{"number":"Άρθρο 7","title":"Άδεια εγκατάστασης και λειτουργίας ραδιοερασιτεχνικού σταθμού ασυρμάτου","body":"Άδεια ραδιοερασιτεχνικού σταθμού ασυρμάτου λαμβάνουν:\n\n1. Τα φυσικά πρόσωπα που δεν τους έχει αφαιρεθεί οριστικά άδεια ραδιοερασιτεχνικού σταθμού ασυρμάτου, πληρούν τις προϋποθέσεις του παρόντος κανονισμού και:\n\n1.1. Είναι κάτοχοι Ελληνικού πτυχίου ραδιοερασιτέχνη HAREC ή\n\n1.2. Είναι κάτοχοι αντιστοίχου πτυχίου ραδιοερασιτέχνη HAREC της αλλοδαπής ή σχετικής βεβαίωσης σύμφωνα με το παράρτημα 5 της Σύστασης CEPT T/R 61-02 όπως ισχύει.\n\n1.3. Είναι κάτοχοι Ελληνικού πτυχίου ραδιοερασιτέχνη «κατηγορίας εισαγωγικού επιπέδου»\n\n1.4. Είναι κάτοχοι αδείας ραδιοερασιτέχνη η οποία εκδόθηκε από χώρα με την οποία υφίσταται ισχύουσα συμφωνία αμοιβαιότητας με την Ελλάδα (για άδειες SV0).\n\n2. Τα μη κερδοσκοπικά σωματεία ή σύλλογοι που πληρούν τις παρακάτω προϋποθέσεις:\n\n2.1. Έχουν συσταθεί και λειτουργούν νόμιμα.\n\n2.2. Από το καταστατικό τους προκύπτει ότι αποσκοπούν στην υποστήριξη και ανάπτυξη της υπηρεσίας ραδιοερασιτέχνη.\n\n2.3. Υπάρχει απόφαση του σωματείου ή συλλόγου με την οποία ορίζεται μέλος του, αδειούχος ραδιοερασιτέχνης «κατηγορίας 1», ως ο υπεύθυνος λειτουργίας του ραδιοερασιτεχνικού σταθμού (club station).\n\n3. Τα Εκπαιδευτικά Ιδρύματα της τριτοβάθμιας εκπαίδευσης της χώρας που έχουν ως αντικείμενο τις ραδιοεπικοινωνίες και πληρούν τις παρακάτω προϋποθέσεις:\n\n3.1. Έχουν συστήσει εργαστήριο σχετικό με τις ραδιοεπικοινωνίες.\n\n3.2. Υπάρχει απόφαση του Εκπαιδευτικού Ιδρύματος με την οποία ορίζεται ως υπεύθυνος λειτουργίας του ραδιοερασιτεχνικού σταθμού (club station), αδειούχος ραδιοερασιτέχνης «κατηγορίας 1».\n\n4. Προς εκπλήρωση της αποστολής τους το ΥΥΜΔ, η ΕΕΤΤ και η Γενική Γραμματεία Πολιτικής Προστασίας λαμβάνουν από μία ή περισσότερες ραδιοερασιτεχνικές άδειες. Στις περιπτώσεις αυτές οι άδειες εκδίδονται από την οικεία ΑΠΥ χωρίς να απαιτούνται άλλα δικαιολογητικά. Για τη λειτουργία τέτοιου σταθμού ορίζεται υποχρεωτικά από τους υπόψη φορείς, αδειούχος ραδιοερασιτέχνης ως υπεύθυνος του σταθμού."},{"number":"Άρθρο 8","title":"Χορήγηση αδειών λειτουργίας ραδιοερασιτεχνικών σταθμών πλην αδειών SV0 ή ειδικών αδειών αναμεταδοτών-επαναληπτών-ραδιοφάρων","body":"1. Οι άδειες λειτουργίας ραδιοερασιτεχνικών σταθμών φυσικών προσώπων εκδίδονται από τις ΑΠΥ μετά από αίτηση η οποία συνοδεύεται από τα εξής δικαιολογητικά:\n\n1.1. Φωτοαντίγραφο ταυτότητας ή διαβατηρίου.\n\n1.2. Υπεύθυνη Δήλωση (του άρθρου 8 του ν.1599/1986) με την οποία δηλώνεται ο μόνιμος χώρος εγκατάστασης του σταθμού, οι εναλλακτικές θέσεις εγκατάστασης αυτού και η διεύθυνση μονίμου κατοικίας.\n\n1.3. Επικυρωμένο φωτοαντίγραφο ραδιοερασιτεχνικού πτυχίου ή πιστοποιητικού ή βεβαίωσης περί εναρμονισμένου πιστοποιητικού εξετάσεων ραδιοερασιτέχνη HAREC της ημεδαπής ή της αλλοδαπής.\n\n1.4. Υπεύθυνη δήλωση (του άρθρου 8 του ν.1599/1986) με την οποία δηλώνεται ότι κατά το παρελθόν δεν του έχει αφαιρεθεί άδεια ερασιτεχνικού σταθμού.\n\n1.5. Προβλεπόμενο παράβολο.\n\n1.6. Σε περίπτωση ανηλίκου, υπεύθυνη δήλωση του κηδεμόνα του με την οποία παρέχεται η συναίνεσή του για την άσκηση των ραδιοερασιτεχνικών δραστηριοτήτων του ανηλίκου.\n\n2. Η διάρκεια ισχύος των αδειών είναι δεκαετής. Οι άδειες είναι προσωπικές και αμεταβίβαστες.\n\n3. Οι άδειες λειτουργίας ραδιοερασιτεχνικών σταθμών νομικών προσώπων που έχουν το σχετικό δικαίωμα, εκδίδονται μετά από αίτηση στην ΑΠΥ. Η αίτηση συνοδεύεται από τα κατά περίπτωση νομιμοποιητικά έγγραφα (καταστατικό μη κερδοσκοπικού σωματείου ή συλλόγου ή η ιδρυτική πράξη του εργαστηρίου, απόφαση του νομικού προσώπου περί ορισμού υπευθύνου ραδιοερασιτέχνη, δήλωση του μόνιμου χώρου εγκατάστασης του σταθμού καθώς και προβλεπόμενο παράβολο) από τα οποία προκύπτει η πλήρωση των σχετικών προϋποθέσεων του παρόντος Κανονισμού."},{"number":"Άρθρο 9","title":"Ανανέωση - Τροποποίηση αδειών λειτουργίας ραδιοερασιτεχνικών σταθμών πλην των αδειών SV0 και των ειδικών αδειών αναμεταδοτών-επαναληπτών-ραδιοφάρων","body":"1. Η ανανέωση της άδειας γίνεται κατόπιν αιτήσεως του ενδιαφερόμενου. Η αίτηση μπορεί να υποβάλλεται στην ΑΠΥ το νωρίτερο μέχρι και έξι (6) μήνες πριν τη λήξη της αδείας. Η αίτηση συνοδεύεται από τα εξής δικαιολογητικά:\n\n1.1. Φωτοαντίγραφο ταυτότητας ή διαβατηρίου.\n\n1.2. Υπεύθυνη Δήλωση (του άρθρου 8 του ν.1599/1986) με την οποία δηλώνεται ο μόνιμος χώρος εγκατάστασης του σταθμού βάσης, οι εναλλακτικές θέσεις εγκατάστασης αυτού και η διεύθυνση μονίμου κατοικίας.\n\n1.3. Προβλεπόμενο παράβολο.\n\n1.4. Για τα νομικά πρόσωπα, τα σχετικά δικαιολογητικά (αποφάσεις, καταστατικά ιδρύσεως κλπ) από τα οποία προκύπτει η εκπλήρωση των απαιτουμένων προϋποθέσεων.\n\n2. Η τροποποίηση γίνεται με αίτηση του κατόχου της άδειας σε περιπτώσεις αλλαγής κάποιου ή κάποιων από τα στοιχεία της αδείας του (κατηγορία, χώρος εγκατάστασης σταθμού βάσης, διεύθυνση κατοικίας κλπ). Η σχετική αίτηση συνοδεύεται από τα εξής δικαιολογητικά:\n\n2.1. Επίσημα έγραφα ή υπεύθυνη δήλωση (του άρθρου 8 του ν.1599/1986) ανάλογα με την περίπτωση, που να αποδεικνύουν την αλλαγή των προς τροποποίηση στοιχείων.\n\n2.2. Προβλεπόμενο παράβολο.\n\n2.3. Για τα νομικά πρόσωπα, τα σχετικά δικαιολογητικά (αποφάσεις, καταστατικά κλπ) από τα οποία προκύπτει η εκπλήρωση των απαιτουμένων προϋποθέσεων.\n\n3. Η ανανέωση ή και η τροποποίηση της άδειας πραγματοποιείται από την ΑΠΥ με την έκδοση νέου εντύπου ραδιοερασιτεχνικής αδείας.\n\n4. Η διάρκεια ισχύος της άδειας είναι δεκαετής και ανανεώνεται κάθε φορά με αίτηση του ενδιαφερόμενου για νέα περίοδο δέκα (10) ετών. Ο κάτοχος ραδιοερασιτεχνικής αδείας οφείλει να μεριμνά για την έγκαιρη ανανέωση ισχύος της άδειάς του. Με τη λήξη ισχύος της ραδιοερασιτεχνικής άδειας αίρεται αυτομάτως κάθε δικαίωμα άσκησης ραδιοερασιτεχνικών δραστηριοτήτων που προβλέπονται στον παρόντα κανονισμό, συμπεριλαμβανόμενων και δικαιωμάτων εγκατάστασης κεραίας ραδιοερασιτεχνικού σταθμού. Σε περίπτωση αίτησης ανανέωσης για νέα χρονική περίοδο, η δεκαετία αρχίζει να προσμετράται από την ημερομηνία έκδοσης της νέας-ανανεωμένης άδειας.\n\n5. Σε περιπτώσεις αιτημάτων μόνο για τροποποίηση της άδειας, πρέπει αυτή να είναι σε ισχύ και η ημερομηνία λήξης δεν αλλάζει. Ο κάτοχος ραδιοερασιτεχνικής άδειας οφείλει να μεριμνά για την έγκαιρη τροποποίηση της άδειας του.\n\n6. Σε περιπτώσεις τροποποίησης της άδειας λόγω αλλαγής μονίμου τόπου κατοικίας του ραδιοερασιτέχνη σε διαφορετική γεωγραφική ραδιοερασιτεχνική περιοχή, τροποποιείται αναλόγως και το πρόθεμα του διακριτικού κλήσεως."},{"number":"Άρθρο 10","title":"Αρμοδιότητες Υπηρεσιών","body":"1. Στις ΑΠΥ ανατίθενται οι αρμοδιότητες που αφορούν στην:\n\n1.1. διενέργεια εξετάσεων για απόκτηση πτυχίου ραδιοερασιτέχνη,\n\n1.2. έκδοση των πτυχίων,\n\n1.3. έκδοση, τροποποίηση, ανανέωση των Ελληνικών αδειών συμπεριλαμβανομένων και των αδειών της σειράς «SV0» (sierra victor zero),\n\n1.4. έκδοση, τροποποίηση, ανανέωση των αδειών ραδιοερασιτεχνικών σταθμών της Εθνικής Επιτροπής Τηλεπικοινωνιών & Ταχυδρομείων (ΕΕΤΤ), της Γενικής Γραμματείας Πολιτικής Προστασίας και της Γενικής Γραμματείας Επικοινωνιών,\n\n1.5. έκδοση ειδικών αδειών αναμεταδοτών-επαναληπτών-ραδιοφάρων,\n\n1.6. ειδική αδειοδότηση για την πραγματοποίηση δοκιμών (Επικοινωνία μέσω σελήνης ή Επικοινωνία μέσω μετεωριτών κλπ), με χρήση ειδικών τύπων εκπομπής και με μεγαλύτερη ισχύ της επιτρεπομένης σύμφωνα με το άρθρο 21,\n\n1.7. έλεγχο των ημερολογίων των ραδιοερασιτεχνικών σταθμών,\n\n1.8. έλεγχο του παρόντος κανονισμού και επιβολή προβλεπομένων κυρώσεων.\n\n2. Οι ΑΠΥ τηρούν Μητρώο των αδειών που έχουν εκδώσει.\n\n3. Στην Κεντρική Υπηρεσία του ΥΥΜΔ ανατίθενται οι αρμοδιότητες:\n\n3.1. κατανομής-έγκρισης των ραδιοερασιτεχνικών διακριτικών κλήσεως στις ΑΠΥ,\n\n3.2. μέριμνας για συγκρότηση και διανομή στις ΑΠΥ των ηλεκτρονικών ερωτηματολογίων (πολλαπλών επιλογών) για τις εξετάσεις απόκτησης πτυχίου ραδιοερασιτέχνη,\n\n3.3. καθορισμού του τύπου των εντύπων όλων των πτυχίων και αδειών ραδιοερασιτεχνών (συμπεριλαμβανομένων και των αδειών SV0) καθώς και της έκδοσης και διανομής στις ΑΠΥ των εντύπων αυτών,\n\n3.4. καθορισμού του «τύπου» αιτήσεων για θέματα ειδικής αδειοδότησης και τα της έκδοσης πινάκων αναμεταδοτών-επαναληπτών-ραδιοφάρων που έχουν αδειοδοτηθεί από τις ΑΠΥ,\n\n3.5. ανάληψης ή υποστήριξης διαφόρων δράσεων που αποσκοπούν στην ορθή εφαρμογή του παρόντος κανονισμού και στην ανάπτυξη του ραδιοερασιτεχνισμού (ευαισθητοποίηση της κοινής γνώμης, διοργάνωση συνεδρίων, εκθέσεων, ενημερωτικών σεμιναρίων που απευθύνονται σε υπαλλήλους των ΑΠΥ, εκπαιδευτικών σεμιναρίων σε ραδιοερασιτέχνες που εντάσσονται στον Επιχειρησιακό Σχεδιασμό της Γενικής Γραμματείας Πολιτικής Προστασίας, έκδοση ειδικών ενημερωτικών εντύπων κλπ),\n\n3.6. έκδοσης οδηγιών για την ορθή εφαρμογή του παρόντος Κανονισμού και την ασφαλέστερη λειτουργία των ραδιοερασιτεχνικών σταθμών, καθώς και ενημερωτικών εγκυκλίων που περιλαμβάνουν τις εκχωρημένες στην υπηρεσία ερασιτέχνη υποζώνες συχνοτήτων και διευκρινίσεις για τον τρόπο χρήσης τους.\n\n3.7. έκδοσης οδηγιών, σε συνεργασία με την Εθνική Επιτροπή Ατομικής Ενέργειας (ΕΕΑΕ), για την προστασία των ραδιοερασιτεχνών από ηλεκτρομαγνητική ακτινοβολία, τη λήψη κατάλληλων μέτρων κ.λπ.,\n\n3.8. υποστήριξης και συντονισμού των ΑΠΥ σε θέματα έγκρισης ειδικών διακριτικών κλήσεως και έκδοσης ειδικών αδειών αναμεταδοτών-επαναληπτών-ραδιοφάρων,\n\n3.9. μέριμνας για τον σχεδιασμό και την υλοποίηση των σχετικών διαδικασιών και ενός ολοκληρωμένου πληροφοριακού συστήματος υποβοήθησης του έργου των ΑΠΥ και της Κεντρικής Υπηρεσίας του ΥΥΜΔ για θέματα διαχείρισης ειδικών διακριτικών κλήσεως, κατανομής διακριτικών κλήσεως στις ΑΠΥ, ηλεκτρονικής έκδοσης ραδιοερασιτεχνικών αδειών μέσω του διαδικτύου, τήρησης ηλεκτρονικών Μητρώων των αδειών ερασιτεχνικών σταθμών ασυρμάτου, αναμεταδοτών-επαναληπτών-ραδιοφάρων, ειδικών εκχωρήσεων συχνοτήτων για την πραγματοποίηση δοκιμών κ.λπ.\n\n4. Για τα θέματα εποπτείας του ραδιοφάσματος και της προστασίας από παρεμβολές επιλαμβάνεται η Εθνική Επιτροπή Τηλεπικοινωνιών-Ταχυδρομείων (ΕΕΤΤ) ενώ για τα θέματα προφύλαξης του κοινού από ηλεκτρομαγνητικά πεδία επιλαμβάνεται η ΕΕΑΕ, σύμφωνα με τις ισχύουσες διατάξεις."},{"number":"Άρθρο 11","title":"Κυρώσεις","body":"1. Οι άδειες λειτουργίας ραδιοερασιτεχνικών σταθμών ανακαλούνται οριστικά ή αναστέλλεται προσωρινά η ισχύς τους, αναλόγως της βαρύτητας της παραβάσεως, ύστερα από ακρόαση του ενδιαφερομένου και μετά από αιτιολογημένη απόφαση της ΑΠΥ που χορήγησε την άδεια, στις παρακάτω περιπτώσεις:\n\n1.1. Όταν δεν πληρούνται πλέον οι όροι έκδοσης της άδειας λειτουργίας του ραδιοερασιτεχνικού σταθμού.\n\n1.2. Όταν ο αδειούχος παραβεί τις διατάξεις του παρόντος κανονισμού.\n\n1.3. Όταν ο αδειούχος είναι υπαίτιος παρεμβολής η επιβλαβούς-επιζήμιας παρεμβολής σε συσκευές ή συστήματα που πληρούν τις σχετικές προδιαγραφές τεχνικού περιεχομένου σύμφωνα με τους ισχύοντες κανονισμούς λειτουργίας τους και τις ισχύουσες διατάξεις για την ηλεκτρομαγνητική συμβατότητα.\n\n1.4. Όταν ο αδειούχος παραβεί τις διατάξεις του Κανονισμού Ραδιοεπικοινωνιών της Διεθνούς Ένωσης Τηλεπικοινωνιών (ITU), ιδίως στις περιπτώσεις παρενόχλησης των αερομεταφορών και των ραδιοεπικοινωνιών.\n\n2. Στους παραβάτες επιβάλλονται οι προβλεπόμενες ποινές του άρθρου 11 του ν.δ.1244/1972, καθώς και τα προβλεπόμενα πρόστιμα στο άρθρο 2 παρ.6 του ν.2801/2001. Για παραβάσεις που εμπίπτουν στο πεδίο εφαρμογής του ν.3431/2006 όπως ισχύει, επιλαμβάνεται η ΕΕΤΤ."},{"number":"Άρθρο 12","title":"Διακριτικά κλήσεως","body":"1. Σε κάθε ραδιοερασιτεχνική άδεια, συμπεριλαμβανομένων και των ειδικών αδειών ραδιοερασιτεχνικών αναμεταδοτών-επαναληπτών-ραδιοφάρων δίδεται διακριτικό κλήσης αποτελούμενο από το πρόθεμα και τον αριθμό της αντίστοιχης ραδιοερασιτεχνικής περιοχής (SV 7, SY 8 κλπ) ή το μηδέν (για τις περιπτώσεις των αδειών «SV0» βάσει άδειας της αλλοδαπής). Μετά το πρόθεμα ακολουθεί ένας ή δύο ή τρείς ή τέσσερεις χαρακτήρες (λατινικά γράμματα ή αριθμοί) ο τελευταίος των οποίων είναι γράμμα, σύμφωνα και με το ΠΑΡΑΡΤΗΜΑ 1.\n\n2. Σε περίπτωση χρήσης του ραδιοερασιτεχνικού σταθμού:\n\n2.1. από εναλλακτική θέση χρησιμοποιείται το πρόθεμα που αντιστοιχεί στη γεωγραφική ερασιτεχνική περιοχή στην οποία υπάγεται η εναλλακτική θέση, ακολουθούμενο από το πλήρες διακριτικό κλήσεως (π.χ. SV3/SV1xxx). Στην περίπτωση που η εναλλακτική θέση ανήκει στην ίδια γεωγραφική ερασιτεχνική περιοχή της κύριας θέσης εγκατάστασης του σταθμού, χρησιμοποιείται το πλήρες διακριτικό κλήσεως με την κατάληξη /Α (Alternative),\n\n2.2. ως φορητού χρησιμοποιείται το διακριτικό του σταθμού με την κατάληξη /P (Portable),\n\n2.3. επί οχήματος χρησιμοποιείται το διακριτικό του σταθμού με την κατάληξη /M (Mobile),\n\n2.4. επί πλοίου χρησιμοποιείται το διακριτικό του σταθμού με την κατάληξη /MM (Maritime Mobile),\n\n2.5. επί αεροσκάφους χρησιμοποιείται το διακριτικό του σταθμού με την κατάληξη /AM (Aeronautical Mobile).\n\n3. Τα διακριτικά κλήσεως σε καμία περίπτωση δεν επαναχορηγούνται σε άλλους ραδιοερασιτέχνες.\n\n4. Προκειμένου να διευκολυνθεί η ραδιοερασιτεχνική δραστηριότητα, σε ειδικές περιπτώσεις και σε προσωρινή βάση, χορηγούνται «Ειδικά Διακριτικά Κλήσεως – ΕΔΚ» (special call sign) σε μεμονωμένους ραδιοερασιτέχνες ή ομάδες ραδιοερασιτεχνών αλλά και σε νομικά πρόσωπα για τα οποία έχει εκδοθεί ραδιοερασιτεχνική άδεια τόσο για δικές τους ανάγκες συμμετοχής σε ραδιοερασιτεχνικές εορτές-διαγωνισμούς-εκθέσεις-γεγονότα όσο και για την υποστήριξη επικοινωνιακών αναγκών εορταστικού χαρακτήρα άλλων κοινωνικών φορέων (προσκοπικές οργανώσεις, αθλητικοί όμιλοι, αθλητικές διοργανώσεις, εορτασμοί μουσείων, μεγάλες εορτές κλπ), που δεν έχουν δικαίωμα εγκατάστασης και λειτουργίας ερασιτεχνικών σταθμών.\n\n5. Τα ΕΔΚ διακρίνονται σε «μικρής διάρκειας» και «μεγάλης διάρκειας». Τα ΕΔΚ μικρής διάρκειας χορηγούνται για χρονικό διάστημα έως και δέκα πέντε (15) ημέρες. Τα ΕΔΚ μεγάλης διάρκειας χορηγούνται, για χρονικό διάστημα μεγαλύτερο των δέκα πέντε (15) ημερών. Η ΑΠΥ, για την χορήγηση ΕΔΚ, δύναται κατά την κρίση της να ζητά γνώμη και άλλων υπηρεσιών-φορέων.\n\n6. Η χορήγηση ΕΔΚ γίνεται μετά από αίτηση συνοδευόμενη από προβλεπόμενο τέλος λειτουργίας και σύμφωνα με το ΠΑΡΑΡΤΗΜΑ 1. Δικαίωμα αίτησης για χορήγηση ΕΔΚ έχουν μόνο αδειούχοι ραδιοερασιτέχνες, συμπεριλαμβανομένων και σχετικών αδειοδοτημένων νομικών προσώπων. Η αίτηση υποβάλλεται στην ΑΠΥ τουλάχιστον πενήντα (50) ημέρες πριν από την ημερομηνία έναρξης της χρήσης του ΕΔΚ.\n\n7. Τα ΕΔΚ σε καμία περίπτωση δεν θεωρούνται αποκλειστικά και είναι δυνατή η χορήγησή τους και σε άλλους ενδιαφερόμενους, εφόσον ζητηθούν.\n\n8. Για την χορήγηση ΕΔΚ προς πραγματοποίηση ραδιοερασιτεχνικών επικοινωνιών από το Άγιο Όρος είναι απαραίτητη επιπλέον η γραπτή συναίνεση της Ιερής Επιστασίας του Αγίου Όρους.\n\n9. Για την χρησιμοποίηση ΕΔΚ, ο ενδιαφερόμενος ραδιοερασιτέχνης ή ο υπεύθυνος έναντι τρίτων, στις περιπτώσεις νομικών προσώπων, πρέπει να έχει εξασφαλίσει δικαιώματα παραχώρησης του χώρου εγκατάστασης του σταθμού και όλες τις απαραίτητες άδειες και εγκρίσεις.\n\n10. Σε ειδικές περιστάσεις ιδιαιτέρως σημαντικών εθνικών ή διεθνών γεγονότων ο Υπουργός Υποδομών Μεταφορών και Δικτύων με απόφαση του μπορεί να χορηγεί ΕΔΚ για ελεύθερη χρήση από όλους τους ραδιοερασιτέχνες κατόχους ελληνικής άδειας. Η χορήγηση αυτή δίδεται για συγκεκριμένο χρονικό διάστημα, χωρίς να απαιτούνται άλλες διαδικασίες και δικαιολογητικά.\n\n11. Η αρμόδια Κεντρική Υπηρεσία του ΥΥΜΔ εγκρίνει σειρές διακριτικών κλήσεως στις ΑΠΥ για την κάλυψη των αναγκών τους και σύμφωνα με το ΠΑΡΑΡΤΗΜΑ 1."},{"number":"Άρθρο 13","title":"Ραδιοερασιτεχνικές περιοχές","body":"{{REGIONS_MAP}}\n\nΗ χώρα διαχωρίζεται σε εννέα (9) γεωγραφικές περιοχές ραδιοερασιτεχνικών διακριτικών κλήσεως οι οποίες φαίνονται στον ακόλουθο πίνακα:\n\nΠΙΝΑΚΑΣ ΡΑΔΙΟΕΡΑΣΙΤΕΧΝΙΚΩΝ ΠΕΡΙΟΧΩΝ\n\n1. SV1 ή SΥ1 — ΣΤΕΡΕΑ ΕΛΛΑΔΑ\n\n2. SV2 ή SΥ2 — ΚΕΝΤΡΙΚΗ και ΔΥΤΙΚΗ ΜΑΚΕΔΟΝΙΑ\n\n3. SV3 ή SΥ3 — ΠΕΛΟΠΟΝΝΗΣΟΣ\n\n4. SV4 ή SΥ4 — ΘΕΣΣΑΛΙΑ\n\n5. SV5 ή SΥ5 — ΝΟΜΟΣ ΔΩΔΕΚΑΝΗΣΟΥ\n\n6. SV6 ή SΥ6 — ΗΠΕΙΡΟΣ\n\n7. SV7 ή SΥ7 — ΘΡΑΚΗ και ΑΝΑΤΟΛΙΚΗ ΜΑΚΕΔΟΝΙΑ\n\n8. SV8 ή SΥ8 — Όλα τα ΝΗΣΙΑ ανεξαρτήτως εάν ανήκουν διοικητικά σε νομούς της ηπειρωτικής Ελλάδας συμπεριλαμβανομένων των νήσων ΑΡΓΟΣΑΡΩΝΙΚΟΥ και της ΕΥΒΟΙΑΣ εκτός από τα νησιά που ανήκουν στους νομούς της ΚΡΗΤΗΣ και της ΔΩΔΕΚΑΝΗΣΟΥ\n\n9. SV9 ή SΥ9 — Όλοι οι νομοί της ΚΡΗΤΗΣ (συμπεριλαμβανομένων και των νήσων που ανήκουν διοικητικά σ' αυτούς)"},{"number":"Άρθρο 14","title":"Ραδιοερασιτεχνικοί σύλλογοι","body":"1. Οι ραδιοερασιτεχνικοί σύλλογοι μπορούν να διοργανώνουν εκπαιδευτικά ή ενημερωτικά προγράμματα που αποσκοπούν στην ανάπτυξη του ραδιοερασιτεχνικού, στην ορθή και ασφαλή χρήση ραδιοεξοπλισμού και τη βελτίωση της τεχνικής κατάρτισης ενδιαφερομένων για την άσκηση της ραδιοερασιτεχνικής υπηρεσίας.\n\n2. Μετά την επιτυχή περάτωση των υπόψη προγραμμάτων, οι ραδιοερασιτεχνικοί σύλλογοι δύνανται να χορηγούν βεβαιώσεις παρακολούθησης."},{"number":"Άρθρο 15","title":"Λειτουργία ραδιοερασιτεχνικών σταθμών","body":"1. Οι ερασιτεχνικοί σταθμοί ασυρμάτου λειτουργούν σύμφωνα με τις διατάξεις του παρόντος, τις λοιπές σχετικές διατάξεις της κείμενης νομοθεσίας, τον Διεθνή Κανονισμό Ραδιοεπικοινωνιών όπως εκάστοτε ισχύει, μόνο για ερασιτεχνικούς σκοπούς και για την εξυπηρέτηση έκτακτων κοινωνικών αναγκών, σύμφωνα με το άρθρο 17.\n\n2. Ο ραδιοερασιτεχνικός σταθμός χρησιμοποιείται:\n\n2.1. Από τον κάτοχο του σταθμού ή τον υπεύθυνο λειτουργίας του σταθμού.\n\n2.2. Από κάθε άλλο αδειούχο ραδιοερασιτέχνη (Έλληνα ή αλλοδαπό) κάτω από την άμεση επίβλεψη του κατόχου του ραδιοσταθμού ή του υπευθύνου λειτουργίας.\n\n2.3. Σε ειδικές περιπτώσεις κατά τις οποίες έχουν ληφθεί ιδιαίτερα μέτρα ασφαλείας, ο κάτοχος του σταθμού, ραδιοερασιτέχνης με ισχύουσα άδεια, μπορεί για εκπαιδευτικούς λόγους και αποσκοπώντας στην πρόοδο του ραδιοερασιτεχνισμού, να επιτρέπει την χρήση του σταθμού σε τρίτο πρόσωπο που δεν έχει την ιδιότητα του ραδιοερασιτέχνη, υπό την ευθύνη του, την επίβλεψή του και τις οδηγίες του, για σύντομο χρονικό διάστημα που δεν υπερβαίνει τα είκοσι (20) λεπτά της ώρας. Στις περιπτώσεις αυτές, μετά το χαρακτηριστικό κλήσεως του σταθμού διευκρινίζεται ότι η χρήση του σταθμού γίνεται από τρίτο πρόσωπο σε διαδικασία εκπαίδευσης με την χρησιμοποίηση του διακριτικού του σταθμού ακολουθούμενο από την κατάληξη /Τ (training).\n\n3. Η λειτουργία του ραδιοερασιτεχνικού σταθμού από άλλο πρόσωπο, καταχωρείται από τον ερασιτέχνη αυθημερόν στο ημερολόγιο του σταθμού και για όλες τις εκπομπές που πραγματοποιούνται από το πρόσωπο αυτό. Στις περιπτώσεις αυτές ο ερασιτέχνης λαμβάνει όλα τα αναγκαία μέτρα, ώστε να εξασφαλίζεται η ακριβής συμμόρφωση προς τον παρόντα Κανονισμό.\n\n4. Απαγορεύεται η συνεγκατάσταση στον ίδιο χώρο αδειοδοτημένου ραδιοερασιτεχνικού σταθμού με μη νόμιμο ή μη αδειοδοτημένο σταθμό άλλης υπηρεσίας ραδιοεπικοινωνιών.\n\n5. Ο αδειούχος ερασιτέχνης απαγορεύεται να χρησιμοποιεί την ραδιοερασιτεχνική του ιδιότητα με σκοπό την παραπλάνηση των αρχών για την κάλυψη μη νόμιμων δραστηριοτήτων που σχετίζονται με ραδιοεπικοινωνίες.\n\n6. Η ανταπόκριση μεταξύ των ραδιοερασιτεχνικών σταθμών περιορίζεται στη μεταβίβαση και λήψη ανακοινώσεων τεχνικού περιεχομένου που σχετίζεται με δοκιμές και μετρήσεις, καθώς και σε παρατηρήσεις προσωπικού χαρακτήρα. Η φωνητική ανταπόκριση διεξάγεται σε σαφή γλώσσα. Απαγορεύεται η χρησιμοποίηση κρυπτοφωνίας, συνθηματικών λέξεων ή οποιουδήποτε μη γνωστού κώδικα. Ωστόσο, για την υποστήριξη της ραδιοερασιτεχνικής δραστηριότητας επιτρέπεται η χρησιμοποίηση γνωστών και αναγνωρισμένων διεθνώς τεχνολογιών-κωδικοποιήσεων-διαμορφώσεων-πρωτοκόλλων (νέες ψηφιακές τεχνολογίες και εφαρμογές μετάδοσης φωνής ή/και δεδομένων όπως ενδεικτικά D-STAR, DMR κλπ) καθώς και η χρήση μέσων επικοινωνίας αναγνωρισμένων διεθνώς που σχετίζονται με το διαδίκτυο ή άλλες διασυνδεδεμένες ψηφιακές τεχνολογίες.\n\n7. Απαγορεύεται η χρήση ραδιοερασιτεχνικών σταθμών, για εμπορικούς σκοπούς και διαφημίσεις.\n\n8. Οι ραδιοερασιτεχνικοί σταθμοί εκπέμπουν κατά την έναρξη και λήξη της εκπομπής τους το διακριτικό σήμα κλήσης τους. Κατά τη διάρκεια της εκπομπής τους, εκπέμπουν κατά χρονικά διαστήματα όχι μεγαλύτερα των δέκα (10) πρώτων λεπτών, το διακριτικό σήμα κλήσης τους.\n\n9. Για την εκφορά των διακριτικών κλήσης, συντμήσεων ή φωνητικών λέξεων, συνιστάται η χρήση του ενιαίου φωνητικού αλφαβήτου (Ελληνικού ή Διεθνούς).\n\n10. Όταν ο ερασιτέχνης αντιλαμβάνεται την λειτουργία παράνομου σταθμού ή οποιαδήποτε αντικανονική εκπομπή εντός των ραδιοερασιτεχνικών συχνοτήτων καλεί τον παράνομο σταθμό να παύσει να εκπέμπει και ενημερώνει σχετικά την ΕΕΤΤ που είναι επιφορτισμένη με τον έλεγχο και την επιτήρηση του φάσματος ραδιοσυχνοτήτων.\n\n11. Ο αδειούχος ερασιτέχνης οφείλει να παρακολουθεί τις διεθνείς τεχνολογικές και ρυθμιστικές εξελίξεις που αφορούν την άσκηση των ραδιοερασιτεχνικών επικοινωνιών και να συμμορφώνεται προς τις διατάξεις του ισχύοντα Διεθνή Κανονισμού Ραδιοεπικοινωνιών.\n\n12. Απαγορεύεται η εκπομπή εκτός των ζωνών ραδιοσυχνοτήτων που προβλέπονται για τους ραδιοερασιτέχνες. Σε εξαιρετικές περιπτώσεις που σχετίζονται με την ασφάλεια ζωής ή την ασφάλεια πλοίου ή αεροσκάφους οι ραδιοερασιτέχνες επιτρέπεται να επικοινωνούν με σταθμούς άλλων υπηρεσιών. Η λειτουργία ραδιοερασιτεχνικών δεκτών εκτός των ζωνών ραδιοερασιτεχνικών συχνοτήτων επιτρέπεται με την επιφύλαξη της παραγράφου 15.\n\n13. Απαγορεύεται από τους ερασιτεχνικούς σταθμούς η μετάδοση μουσικής, η χρήση αυτών για μετάδοση ή αναμετάδοση φωνητικών προγραμμάτων με αμοιβή ή χωρίς ή άλλων εκπομπών εκτός από αυτές που καθορίζονται στην παρούσα.\n\n14. Απαγορεύεται η κατά την ανταπόκριση χρήση διακριτικών κλήσεως άλλων ραδιοερασιτεχνών, ψευδών διακριτικών κλήσεως και η μετάδοση πάσης φύσεως (ψευδών η ανεξακρίβωτων) ειδήσεων. Απαγορεύεται επίσης η μετάδοση εκφράσεων ή μηνυμάτων που αντίκεινται στη δημόσια τάξη και προσβάλλουν την ευπρέπεια, το φύλο, τη φυλή, τις πολιτικές ή θρησκευτικές πεποιθήσεις.\n\n15. Απαγορεύεται ο ραδιοερασιτέχνης να χρησιμοποιεί τον εξοπλισμό του με σκοπό την παραβίαση του απορρήτου των επικοινωνιών.\n\n16. Απαγορεύεται με οποιονδήποτε τρόπο η παρεμπόδιση της ομαλής ανταπόκρισης άλλων ραδιοερασιτεχνικών σταθμών και ραδιοσταθμών οποιασδήποτε άλλης υπηρεσίας.\n\n17. Ο ραδιοερασιτέχνης υποχρεούται να τηρεί ημερολόγιο λειτουργίας του σταθμού βάσης (ηλεκτρονικό ή σε έντυπη μορφή) στο οποίο αναγράφονται:\n\n17.1. Η ημερομηνία, η ώρα και ο χρόνος διάρκειας κάθε ανταπόκρισης.\n\n17.2. Το διακριτικό κλήσεως του σταθμού με τον οποίο έγινε η ανταπόκριση.\n\n17.3. Στοιχεία της εκπομπής (χρησιμοποιηθείσα ισχύς πομπού, συχνότητα λειτουργίας, τύπος εκπομπής κλπ).\n\n17.4. Ο τόπος στον οποίο είναι εγκατεστημένος ο σταθμός με τον οποίο γίνεται η ανταπόκριση.\n\n17.5. Στοιχεία ποιότητας της πραγματοποιηθείσας ανταπόκρισης καθώς και κάθε άλλο στοιχείο κατά την κρίση του κατόχου του σταθμού.\n\n18. Το ημερολόγιο του ραδιοερασιτεχνικού σταθμού τηρείται και για τις περιπτώσεις ραδιοακρόασης-SWL. Στις περιπτώσεις αυτές, ο ραδιοερασιτέχνης μπορεί επίσης να στέλνει και σχετική κάρτα επιβεβαίωσης λήψης (QSL).\n\n19. Ο ραδιοερασιτέχνης κάτοχος του σταθμού είναι υποχρεωμένος να υποβάλει αντίγραφο του ημερολογίου του (ολόκληρο ή απόσπασμα) καθώς και κάθε τεχνική πληροφορία για τη σύνθεση του σταθμού του στις αρμόδιες αρχές, εάν και εφόσον του ζητηθεί.\n\n20. Ο σταθμός, η άδεια λειτουργίας ερασιτεχνικού σταθμού και το ημερολόγιο του σταθμού υπόκεινται σε έλεγχο.\n\n21. Μόνιμη θέση του σταθμού είναι αυτή που δηλώνει ο ενδιαφερόμενος ραδιοερασιτέχνης. Εάν η δηλούμενη μόνιμη θέση του σταθμού είναι διαφορετική από τη διεύθυνση μονίμου κατοικίας του ραδιοερασιτέχνη, τότε η μόνιμη θέση του σταθμού θα αναγράφεται επί της αδείας στη θέση των «παρατηρήσεων», όπου εγγράφονται και οι εναλλακτικές θέσεις του σταθμού.\n\n22. Εφόσον σταθερός ραδιοερασιτεχνικός σταθμός εγκαθίσταται και χρησιμοποιείται σε προσωρινή τοποθεσία, τα γεωγραφικά στοιχεία αναγνώρισης της τοποθεσίας αυτής (π.χ. maiden head locator, αναγνωρισμένα συστήματα συντεταγμένων, τοπωνύμιο) μεταδίδονται μαζί με την αναγγελία του διακριτικού κλήσης του σταθμού.\n\n23. Στους ραδιοερασιτέχνες κάτοχους άδειας «κατηγορίας εισαγωγικού επιπέδου», επιτρέπεται η εκπομπή σε συγκεκριμένες ζώνες συχνοτήτων σύμφωνα με το άρθρο 21 ενώ η ραδιοακρόαση επιτρέπεται σε όλες τις ραδιοερασιτεχνικές υποζώνες.\n\n24. Η επικοινωνία με άλλους ερασιτεχνικούς σταθμούς ξένων χωρών απαγορεύεται, εάν και εφόσον η αρμόδια υπηρεσία του ενδιαφερομένου Κράτους γνωστοποιήσει ότι αντιτίθεται σε αυτού του είδους την ασύρματη επικοινωνία. Η αρμόδια κεντρική υπηρεσία του ΥΥΜΔ καταρτίζει σχετικό κατάλογο ξένων χωρών οι οποίες έχουν αιτηθεί τα ανωτέρω και τον γνωστοποιεί κατά πρόσφορο τρόπο."},{"number":"Άρθρο 16","title":"Λειτουργία ραδιοερασιτεχνικού σταθμού επί πλωτών μέσων και αεροσκαφών","body":"Η εγκατάσταση και λειτουργία ενός ραδιοερασιτεχνικού σταθμού επί σκάφους ή αεροσκάφους προϋποθέτει πάντοτε την έγκριση του κυβερνήτη των μέσων αυτών. Η εγκατάσταση του σταθμού γίνεται κατά τέτοιο τρόπο, ώστε να αποκλείεται η πιθανότητα επιζήμιας παρεμβολής ή οποιαδήποτε άλλη επιβάρυνση στη καλή λειτουργία των τηλεπικοινωνιακών ή και ενδεχομένως άλλων συστημάτων ή συσκευών των σκαφών."},{"number":"Άρθρο 17","title":"Λειτουργία ραδιοερασιτεχνικού σταθμού κατά τη διάρκεια εκτάκτων αναγκών","body":"1. Σε περιπτώσεις υπολειτουργίας των δημοσίων τηλεπικοινωνιακών δικτύων λόγω εκτάκτου ανάγκης (θεομηνίες, πλημμύρες, σεισμοί, πυρκαγιές κλπ) οι ραδιοερασιτέχνικοι σταθμοί χρησιμοποιούνται για να παράσχουν επικοινωνιακή βοήθεια. Οι ανταποκρίσεις έκτακτης ανάγκης έχουν προτεραιότητα έναντι των λοιπών.\n\n2. Οι σταθμοί ραδιοερασιτέχνη που είναι ενταγμένοι στα Μητρώα Εθελοντών της Γενικής Γραμματείας Πολιτικής Προστασίας χρησιμοποιούνται για την παροχή ραδιοεπικοινωνιακής συνδρομής από τις αρμόδιες κρατικές υπηρεσίες όπως η Αστυνομία, το Εθνικό Κέντρο Άμεσης Βοήθειας, η Πυροσβεστική Υπηρεσία, το Λιμενικό Σώμα κ.λ.π. στις ανωτέρω περιπτώσεις. Τους σταθμούς χειρίζονται αποκλειστικά οι κάτοχοι των ενταγμένων ραδιοερασιτεχνικών σταθμών."},{"number":"Άρθρο 18","title":"Ένταξη των ραδιοερασιτεχνών στον επιχειρησιακό σχεδιασμό της Γενικής Γραμματείας Πολιτικής Προστασίας","body":"1. Όλοι οι αδειούχοι ραδιοερασιτέχνες μπορούν να ενταχθούν στα Μητρώα Εθελοντών της Γενικής Γραμματείας Πολιτικής Προστασίας μετά από έγκριση της αίτησής τους, είτε ως Ειδικευμένοι Εθελοντές Ραδιοερασιτέχνες είτε μέσω των ενταγμένων στα μητρώα συλλόγων ραδιοερασιτεχνών.\n\n2. Οι παραπάνω κατηγορίες εντάσσονται σύμφωνα με το αρθ. 14 του ν.3013/2002 (ΦΕΚ 102Α/1-5-2002) περί αναβάθμισης της Πολιτικής Προστασίας, όπως ισχύει."},{"number":"Άρθρο 19","title":"Ραδιοερασιτεχνικός εξοπλισμός","body":"1. Οι ραδιοερασιτέχνες υποχρεούνται να χρησιμοποιούν ραδιοεξοπλισμό και κάθε άλλου είδους εξοπλισμό που είναι σύμφωνος με τις απαιτήσεις του παρόντος Κανονισμού και των λοιπών σχετικών διατάξεων της ελληνικής νομοθεσίας, ιδίως των διατάξεων για τις κατασκευές κεραιών, την ασφάλεια και την ηλεκτρομαγνητική συμβατότητα.\n\n2. Σε περιπτώσεις που ο ραδιοερασιτέχνης τροποποιεί ερασιτεχνικό ραδιοεξοπλισμό ή κατασκευάζει τέτοιον εξοπλισμό ή περιέρχεται στην κατοχή του μη ραδιοερασιτεχνικός εξοπλισμός τον οποίο τροποποιεί κατάλληλα, οφείλει να διασφαλίσει ότι ικανοποιεί τις βασικές απαιτήσεις της νομοθεσίας. Σε περίπτωση που ο ραδιοερασιτέχνης δεν μπορεί να διασφαλίσει τις απαιτήσεις, ζητά τον έλεγχο του εξοπλισμού από Ραδιοηλεκτρολόγο Α΄ ή Β΄ και λαμβάνει σχετική βεβαίωση.\n\n3. Σε περιπτώσεις εγκατάστασης εξοπλισμού με δυνατότητες πέραν των επιτρεπομένων ορίων συχνοτήτων και ισχύος, είναι υποχρεωτική η προμήθεια και εγκατάσταση (ενσωματωμένα στις συσκευές ή χωριστά) διατάξεων ρύθμισης και οργάνων ελέγχου (για τον αποτελεσματικό έλεγχο της ισχύος εξόδου των πομπών, της συχνότητας εκπομπής τους και των στάσιμων κυμάτων των κεραιών) με ακρίβεια μέτρησης καλύτερη από 10%, με σκοπό τη συμμόρφωση με τα προβλεπόμενα όρια.\n\n4. Ο κάτοχος του σταθμού ή ο υπεύθυνος λειτουργίας του οφείλει να συντηρεί τον ραδιοεξοπλισμό του σταθμού, συμπεριλαμβανομένων και των παρελκομένων του και να λαμβάνει όλα τα απαραίτητα μέτρα για την ασφάλεια και τη σωστή λειτουργία του σταθμού."},{"number":"Άρθρο 20","title":"Ραδιοερασιτεχνικές κατασκευές κεραιών","body":"1. Οι κατασκευές κεραιών των ραδιοερασιτεχνών διέπονται από διατάξεις του ν. 2801/2000 και του ν.3431/2006 όπως ισχύουν.\n\n2. Οι κατασκευές κεραιών των ραδιοερασιτεχνών απαγορεύεται να διέρχονται πάνω από εναέρια δίκτυα κοινής ωφέλειας μέσης ή υψηλής τάσης τροφοδοσίας.\n\n3. Κάθε κάτοχος κατασκευής κεραίας της ραδιοερασιτεχνικής υπηρεσίας υποχρεούται να έχει διαρκώς αναρτημένη κοντά στη βάση της ευανάγνωστη ανεξίτηλη πινακίδα, στην οποία θα αναγράφονται τα στοιχεία του κατόχου συμπεριλαμβανομένου και του διακριτικού κλήσης του.\n\n4. Σε περιπτώσεις παύσης της νόμιμης λειτουργίας του ραδιοερασιτεχνικού σταθμού για οποιονδήποτε λόγο (ανάκληση, παύση ισχύος της άδειας κλπ), ο κάτοχος του σταθμού ή ο υπεύθυνος λειτουργίας του οφείλει αμελλητί να κατεδαφίζει τις κατασκευές κεραίας του σταθμού και να τις απομακρύνει από τον χώρο εγκατάστασής τους, αποκαθιστώντας τυχόν ζημίες ή φθορές."},{"number":"Άρθρο 21","title":"Τεχνικές διατάξεις","body":"1. Η μέγιστη επιτρεπόμενη ισχύς κορυφής περιβάλλουσας (PEP) εξόδου πομπού της υπηρεσίας ερασιτέχνη, για τις εκάστοτε ισχύουσες ραδιοερασιτεχνικές υποζώνες συχνοτήτων, με την επιφύλαξη των παραγράφων 2, 3, 4 και 5, είναι η ακόλουθη:\n\n{{POWER_TABLE}}\n\nΣΗΜΕΙΩΣΗ (*) = Οι υποζώνες συχνοτήτων 50-52 MHz και 70,20-70,25 MHz μπορούν να χρησιμοποιούνται σε προσωρινή βάση, για πειραματικούς σκοπούς της υπηρεσίας ερασιτέχνη, μόνο από ραδιοερασιτέχνες «κατηγορίας 1». Με εγκύκλιο της Κεντρικής Υπηρεσίας του ΥΥΜΔ μπορεί να καθορίζονται περιορισμοί (ακόμα και παύση) χρησιμοποίησης των ζωνών αυτών, σε συνεργασία με το Υπουργείο Εθνικής Άμυνας.\n\nΣΗΜΕΙΩΣΗ (**) = Δεν επιτρέπεται εκπομπή.\n\n2. Οι ραδιοερασιτέχνες πρέπει να λειτουργούν τον σταθμό τους έτσι ώστε να μη δημιουργούνται σε καμία περίπτωση ηλεκτρομαγνητικά πεδία που να υπερβαίνουν τις τιμές έκθεσης του κοινού που ορίζονται στην ΚΥΑ 53571/3839/2000 (ΦΕΚ Β'1105) «Μέτρα προφύλαξης του κοινού από την λειτουργία κεραιών εγκατεστημένων στην ξηρά» σε όλες τις θέσεις στο περιβάλλον του σταθμού στις οποίες είναι ελεύθερη και δυνατή η πρόσβαση του γενικού πληθυσμού, σε συνδυασμό και με τα οριζόμενα στις λοιπές ισχύουσες διατάξεις κατά περίπτωση.\n\n3. Στους ραδιοερασιτέχνες κάτοχους άδειας «κατηγορίας εισαγωγικού επιπέδου», δεν επιτρέπεται η εγκατάσταση κεραιών με μέγιστο κέρδος μεγαλύτερο των τριών (3) dbi.\n\n4. Σε κάθε περίπτωση, η ισχύς εξόδου του πομπού ρυθμίζεται στην ελάχιστη απαραίτητη για τη διεξαγωγή της συγκεκριμένης επικοινωνίας.\n\n5. Σε περιπτώσεις που ραδιοερασιτέχνες «κατηγορίας 1» επιθυμούν μεμονωμένα ή κατά ομάδες την πραγματοποίηση δοκιμών για συγκεκριμένους πειραματικούς σκοπούς (επικοινωνία μέσω σελήνης ή επικοινωνία μέσω μετεωριτών κλπ) στα πλαίσια ανάπτυξης του ραδιοερασιτεχνισμού, με χρήση ειδικών τύπων εκπομπής και με μεγαλύτερη ισχύ της επιτρεπομένης, ζητούν με αιτήσεις τους ειδική άδεια από την ΑΠΥ. Η αίτηση συνοδεύεται από λεπτομερή αιτιολόγηση του αιτήματος, από σχετική τεχνική τεκμηρίωση και από την προβλεπόμενη στην ΚΥΑ 53571/3839/2000 (ΦΕΚ Β'1105), τεχνική μελέτη ηλεκτρομαγνητικών ακτινοβολιών συνοδευόμενη από την βεβαίωση υποβολής της στην ΕΕΑΕ. Για την παραπάνω ειδική άδεια μπορούν να ζητούνται συμπληρωματικά στοιχεία από τους ενδιαφερομένους καθώς και

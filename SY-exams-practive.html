 η γνώμη άλλων συναρμοδίων φορέων. Η ΑΠΥ μετά την ολοκλήρωση της παραπάνω διαδικασίας αποφαίνεται για την χορήγηση η μη, της ειδικής άδειας κατά περίπτωση. Η ειδική άδεια μπορεί να περιλαμβάνει συγκεκριμένους περιοριστικούς όρους.\n\n6. Η χρήση ηλεκτρονικών διατάξεων συμπίεσης φωνής και άλλων μεθόδων αύξησης της μέσης ισχύος εξόδου πραγματοποιείται χωρίς να αυξάνει το στιγμιαίο εύρος εκπομπής πέρα από τα προβλεπόμενα ανά τύπο εκπομπής όρια του Κανονισμού Ραδιοεπικοινωνιών της ITU.\n\n7. Οι υποζώνες συχνοτήτων της υπηρεσίας ερασιτέχνη είναι οι εκάστοτε εκχωρημένες από τον Ελληνικό Κανονισμό Κατανομής Ζωνών Συχνοτήτων (ΕΚΚΖΣ), όπως αυτός ισχύει κάθε φορά. Οι υποζώνες κατά βάση ακολουθούν τα οριζόμενα στο σχέδιο κατανομής/χρήσης ραδιοσυχνοτήτων της «Περιοχής 1» της Διεθνούς Ενώσεως Ραδιοερασιτεχνών (Band Plan IARU - Region 1).\n\n8. Η ψηφιακή επικοινωνία σε υποζώνες κάτω των 430ΜΗz, απαγορεύεται να καταλαμβάνει μεγαλύτερο εύρος ζώνης συχνοτήτων μετάδοσης από ότι η αντίστοιχη, επιτρεπόμενη για την υποζώνη εκπομπής, αναλογική μετάδοση φωνής. Η ψηφιακή επικοινωνία μπορεί να γίνεται σύμφωνα με διεθνώς γνωστούς κώδικες (BAUDOT, ASCII, AMTOR, PACTOR, G-TOR, CLOVER κ.α.).\n\n9. Η επικοινωνία διάχυτου φάσματος γίνεται σύμφωνα με διεθνώς γνωστές μεθόδους εκπομπής σε υποζώνες συχνοτήτων άνω των 430 ΜΗz.\n\n10. Η τηλεοπτική επικοινωνία (ATV) απαγορεύεται να καταλαμβάνει εύρος ζώνης συχνοτήτων μετάδοσης πέρα από τα όρια της υποζώνης συχνοτήτων που χρησιμοποιεί, άνω των 430 ΜΗz. Σε περίπτωση διαμόρφωσης πλάτους επιβάλλεται η χρήση φίλτρων απόρριψης της κάτω πλευρικής ζώνης.\n\n11. Η τηλεοπτική επικοινωνία αργής σάρωσης (SSTV) εφαρμόζεται στις υποζώνες συχνοτήτων άνω των 3600 ΚΗz.\n\n12. Για τις δορυφορικές επικοινωνίες χρησιμοποιούνται διεθνώς εκχωρημένα ειδικά τμήματα των ερασιτεχνικών υποζωνών συχνοτήτων, που προορίζονται αποκλειστικά για το σκοπό αυτό.\n\n13. Για την επικοινωνία μέσω σελήνης (EME) και μέσω μετεωριτών (MS) χρησιμοποιούνται τα διεθνώς συμφωνημένα στην IARU κατώτερα τμήματα των υποζωνών συχνοτήτων, άνω των 50 ΜΗz. Οι επικοινωνίες αυτές, όταν απαιτούν αυξημένη ακτινοβολούμενη ισχύ εκπομπής (eirp) εμπίπτουν στις προβλέψεις της παραγράφου 5 του παρόντος άρθρου."},{"number":"Άρθρο 22","title":"Κάτοχοι αλλοδαπής ραδιοερασιτεχνικής άδειας που εκδόθηκε σύμφωνα με την Σύσταση T/R 61-01 της CEPT","body":"1. Κάτοχοι αλλοδαπής ισχύουσας ραδιοερασιτεχνικής άδειας που εκδόθηκε σύμφωνα με τη Σύσταση T/R 61-01 της CEPT και τούτο αναγράφεται-δηλώνεται επί της αδείας, έχουν δικαίωμα λειτουργίας ραδιοερασιτεχνικού σταθμού σύμφωνα με την αντίστοιχη ραδιοερασιτεχνική κατηγορία της αλλοδαπής αδείας τους, κατά τη διάρκεια της προσωρινής παραμονής τους στην Ελλάδα και όχι πέραν των τριών (3) μηνών, χωρίς να απαιτείται έκδοση Ελληνικής άδειας.\n\n2. Στη διάρκεια της προσωρινής παραμονής του ο ραδιοερασιτέχνης κάτοχος αλλοδαπής άδειας που εκδόθηκε σύμφωνα με την CEPT T/R 61-01 μπορεί να εγκαταστήσει και «σταθερό» σταθμό, χωρίς να απαιτείται έκδοση Ελληνικής άδειας. Ωστόσο, στην περίπτωση αυτή εφαρμόζονται οι τεχνικές διατάξεις που ισχύουν για την εγκατάσταση ελληνικού ραδιοερασιτεχνικού σταθερού σταθμού, συμπεριλαμβανομένων κατά περίπτωση και των διατάξεων αδειοδότησης των κατασκευών κεραιών.\n\n3. Στους κατόχους αλλοδαπής ισχύουσας ραδιοερασιτεχνικής άδειας των παραπάνω περιπτώσεων συγκαταλέγονται και αυτοί που προέρχονται από χώρες που έχουν αποδεχθεί επίσημα τη Σύσταση T/R 61-01 της CEPT και επιπλέον οι άδειες τους είναι ισοδύναμες με τις άδειες της υπόψη Σύστασης. Στις περιπτώσεις αυτές δεν είναι απαραίτητο τούτο να αναγράφεται-δηλώνεται επί της αδείας. Η Κεντρική Υπηρεσία του ΥΥΜΔ, μεριμνά για την ανάρτηση πίνακα, στον ιστότοπο του Υπουργείου, με τις χώρες που αποδέχονται τη Σύσταση T/R 61-01 της CEPT καθώς και λεπτομέρειες σχετικές με την ισοδυναμία ή όχι των κατηγοριών των ραδιοερασιτεχνικών αδειών που εκδίδονται από τις χώρες αυτές.\n\n4. Στην περίπτωση που ο ανωτέρω αδειούχος ραδιοερασιτέχνης, διαμένει στην Ελλάδα πέραν των τριών (3) μηνών, δύναται να ασκεί τις ραδιοερασιτεχνικές του δραστηριότητες μόνον εφόσον λάβει Ελληνική άδεια σύμφωνα με τις διατάξεις του παρόντος."},{"number":"Άρθρο 23","title":"Κάτοχοι αλλοδαπής άδειας ραδιοερασιτέχνη μη σύμφωνης με την Σύσταση T/R 61-01 της CEPT","body":"1. Ο κάτοχος ισχύουσας αλλοδαπής ραδιοερασιτεχνικής άδειας μη σύμφωνης με τη Σύσταση T/R 61-01 της CEPT, η οποία εκδόθηκε από χώρα με την οποία υφίσταται ισχύουσα συμφωνία αμοιβαιότητας με την Ελλάδα, έχει δικαίωμα εγκατάστασης και λειτουργίας ραδιοερασιτεχνικού σταθμού κατά τη διάρκεια της προσωρινής του παραμονής στην Ελλάδα για διάστημα μέχρι τριών (3) μηνών χωρίς να απαιτείται έκδοση ελληνικής άδειας. Η λειτουργία των σταθμών πρέπει να είναι σύμφωνη με τους περιορισμούς της ραδιοερασιτεχνικής άδειας της αλλοδαπής και πάντως σε καμία περίπτωση δεν μπορεί να υπερβαίνει τα όρια ισχύος και τις ζώνες συχνοτήτων που ισχύουν στην Ελληνική νομοθεσία. Ο ενδιαφερόμενος υποχρεούται να ενημερώσει με κάθε πρόσφορο μέσο την ΑΠΥ ή την Κεντρική Υπηρεσία του ΥΥΜΔ, δύο (2) μήνες πριν την ημερομηνία εισόδου του στη χώρα, την πρόθεση του να ασκήσει ραδιοερασιτεχνική δραστηριότητα και να δηλώσει τον εξοπλισμό που προτίθεται να εισάγει για τον σκοπό αυτό.\n\n2. Ο κάτοχος ισχύουσας αλλοδαπής ραδιοερασιτεχνικής άδειας μη σύμφωνης με τη Σύσταση T/R 61-01 της CEPT, ο οποίος προέρχεται από χώρα με την οποία δεν υφίσταται συμφωνία αμοιβαιότητας με την Ελλάδα, δεν έχει δικαίωμα εγκατάστασης και λειτουργίας ραδιοερασιτεχνικού σταθμού κατά τη διάρκεια της παραμονής του στην Ελλάδα."},{"number":"Άρθρο 24","title":"Άδεια ραδιοερασιτέχνη «SV0» βάσει άδειας της αλλοδαπής","body":"1. Η άδεια ραδιοερασιτέχνη «SV0» βάσει άδειας της αλλοδαπής εκδίδεται για ραδιοερασιτέχνες που διαμένουν στην Ελλάδα για διάστημα μεγαλύτερο των τριών (3) μηνών και κατέχουν άδεια η οποία εκδόθηκε από χώρα με την οποία υφίσταται ισχύουσα συμφωνία αμοιβαιότητας με την Ελλάδα.\n\n2. Αρμόδια υπηρεσία για την έκδοση της άδειας αυτής είναι η ΑΠΥ της περιοχής μονίμου κατοικίας του ενδιαφερομένου.\n\n3. Για την έκδοση της άδειας, ο ενδιαφερόμενος πρέπει να καταθέσει ή να αποστείλει στην ΑΠΥ τα παρακάτω δικαιολογητικά (σε Ελληνική ή Αγγλική γλώσσα):\n\n3.1. Αίτηση.\n\n3.2. Επικυρωμένο φωτοαντίγραφο της ραδιοερασιτεχνικής του άδειας (ή επίδειξη πρωτοτύπου) η οποία πρέπει να είναι σε ισχύ.\n\n3.3. Βεβαίωση (πτυχία ή άλλα αποδεικτικά έγγραφα) από την οποία να προκύπτουν τα σχετικά δικαιώματα που του παρέχει η αλλοδαπή ραδιοερασιτεχνική άδεια του σχετικά με τις περιοχές συχνοτήτων λειτουργίας, τα είδη εκπομπής και τα όρια ισχύος. Σε περίπτωση που δεν διαθέτει τέτοια έγγραφα, ο ενδιαφερόμενος υποβάλλει δική του υπεύθυνη δήλωση με τις πληροφορίες αυτές.\n\n3.4. Αποδεικτικά για την πέραν των τριών (3) μηνών παραμονή του στην Ελλάδα (Ελληνικό Δελτίο Αστυνομικής Ταυτότητας ή Ελληνικό Διαβατήριο ή συμβόλαιο αγοράς κατοικίας ή μισθωτήριο ή εκκαθαριστικό Εφορίας κ.λπ.).\n\n3.5. Το προβλεπόμενο παράβολο για την έκδοση Ελληνικών αδειών, ανεξαρτήτως διάρκειας ισχύος της εκδιδόμενης άδειας.\n\n4. Με την έκδοση άδειας ραδιοερασιτέχνη «SV0» βάσει άδειας της αλλοδαπής χορηγείται Ελληνικό διακριτικό κλήσης με πρόθεμα sierra victor zero «SV0». Ως ημερομηνία λήξης ισχύος της άδειας αυτής θεωρείται η λήξη ισχύος της άδειας της αλλοδαπής και πάντως η συνολική διάρκεια της άδειας δεν υπερβαίνει τη δεκαετία που προβλέπεται για τους έλληνες ραδιοερασιτέχνες. Η άδεια αυτή επιτρέπει στον κάτοχο της, σύμφωνα με τις διατάξεις του παρόντος, την άσκηση ραδιοερασιτεχνικής δραστηριότητας μόνο στην Ελληνική επικράτεια.\n\n5. Η λειτουργία των σταθμών πρέπει να είναι σύμφωνη με τους περιορισμούς της αντίστοιχης ραδιοερασιτεχνικής άδειας της αλλοδαπής και πάντως σε καμία περίπτωση δεν μπορεί να υπερβαίνει τα όρια ισχύος και τις ζώνες συχνοτήτων που ισχύουν στην Ελληνική νομοθεσία.\n\n6. Η άδεια ραδιοερασιτέχνη «SV0» βάσει άδειας της αλλοδαπής μπορεί να ανανεώνεται/τροποποιείται με νέα αίτηση του ενδιαφερομένου, προσκομίζοντας εκ νέου όλα τα ανωτέρω δικαιολογητικά."},{"number":"Άρθρο 25","title":"Λειτουργία ραδιοερασιτεχνικών σταθμών αλλοδαπών στην Ελλάδα","body":"1. Η ισχύς εκπομπής του ραδιοερασιτεχνικού σταθμού αλλοδαπού καθώς και οι συχνότητες λειτουργίας του, σε καμία περίπτωση δεν υπερβαίνουν τα όρια ισχύος και τις ζώνες συχνοτήτων που ισχύουν στην Ελληνική νομοθεσία.\n\n2. Εάν ο αλλοδαπός ραδιοερασιτέχνης μείνει προσωρινά (μέγιστο χρονικό διάστημα τριών μηνών) στην Ελλάδα, λειτουργεί τον σταθμό του εντός του Ελληνικού ραδιοχώρου χρησιμοποιώντας το πρόθεμα \"SV\" ακολουθούμενο από τον αριθμό Ελληνικής ραδιοερασιτεχνικής περιοχής, ακολουθούμενο από το δικό του χαρακτηριστικό κλήσεως, ακολουθούμενο από το /P ή /M ή /MM ή /AM κατά περίπτωση. Ο υπόψη ραδιοερασιτέχνης έχει δικαίωμα χρήσης ΕΔΚ σύμφωνα με τις διατάξεις του παρόντος κανονισμού.\n\n3. Ο αλλοδαπός ραδιοερασιτέχνης που μένει προσωρινά (μέγιστο χρονικό διάστημα τριών μηνών) στην Ελλάδα, δεν δικαιούται προστασίας έναντι επιβλαβών παρεμβολών σύμφωνα με τη Σύσταση T/R 61-01 της CEPT."},{"number":"Άρθρο 26","title":"Αναμεταδότες-Επαναλήπτες-Ραδιοφάροι","body":"1. Στο πλαίσιο της ανάπτυξης του ραδιοερασιτεχνισμού και της διευκόλυνσης των ραδιοερασιτεχνικών επικοινωνιών επ' ωφελεία του κοινωνικού συνόλου, εκδίδονται από τις ΑΠΥ ειδικές άδειες «κατηγορίας 1» αναμεταδοτών-επαναληπτών-ραδιοφάρων σε ραδιοερασιτεχνικούς συλλόγους έπειτα από ελέγχους ηλεκτρομαγνητικής εναρμόνισης που πραγματοποιούνται από την κεντρική υπηρεσία του Υπουργείου Υποδομών Μεταφορών και Δικτύων σε συνεργασία με την ΕΕΤΤ.\n\n2. Για την έκδοση ειδικής άδειας «κατηγορίας 1» αναμεταδοτών-επαναληπτών-ραδιοφάρων, υποβάλλεται αίτηση στην ΑΠΥ. Η αίτηση υπογράφεται από τον νόμιμο εκπρόσωπο του νομικού προσώπου ή από φυσικό πρόσωπο που νομίμως έχει εξουσιοδοτηθεί ειδικά για τον σκοπό αυτό (εφεξής «υπεύθυνος του αναμεταδότη-επαναλήπτη-ραδιοφάρου»). Η αίτηση συνοδεύεται από φάκελο που περιλαμβάνει:\n\n2.1. Υπεύθυνη δήλωση (του άρθρου 8 του ν.1599/1986) του υπεύθυνου του αναμεταδότη-επαναλήπτη-ραδιοφάρου με την οποία αποδέχεται κάθε ευθύνη για την σύννομη εγκατάσταση και καλή λειτουργία του σταθμού.\n\n2.2. Υπεύθυνη δήλωση (του άρθρου 8 του ν.1599/1986) του υπεύθυνου του αναμεταδότη-επαναλήπτη-ραδιοφάρου, στην οποία δηλώνεται ότι έχουν εξασφαλισθεί όλες οι απαραίτητες άδειες και εγκρίσεις που προβλέπονται από την νομοθεσία.\n\n2.3. Αναλυτική περιγραφή της θέσης του σταθμού (συμπεριλαμβανομένων τοπωνυμίου και των συντεταγμένων στο Ελληνικό Γεωδαιτικό Σύστημα Αναφοράς ΕΓΣΑ87) συνοδευόμενη από τοπογραφικό σκαρίφημα ή χάρτη της ευρύτερης περιοχής εγκατάστασης με αποτύπωση της ακριβούς θέσης του σταθμού.\n\n2.4. Άδεια του ιδιοκτήτη του χώρου ο οποίος επιτρέπει την εγκατάσταση του αναμεταδότη-επαναλήπτη-ραδιοφάρου συμπεριλαμβανομένης και της κεραίας.\n\n2.5. Τεχνικό παράρτημα στο οποίο περιέχονται σχέδιο συντήρησης του αναμεταδότη-επαναλήπτη-ραδιοφάρου, τα τεχνικά χαρακτηριστικά του χρησιμοποιούμενου εξοπλισμού, και τεκμηρίωση.\n\n2.6. Προβλεπόμενο παράβολο.\n\n2.7. Το ισχύον καταστατικό, εφόσον πρόκειται για ραδιοερασιτεχνικό σύλλογο.\n\n3. Υποδείγματα της ως άνω αίτησης και του τεχνικού παραρτήματος αναρτώνται στον ιστοχώρο του ΥΥΜΔ με μέριμνα της κεντρικής υπηρεσίας του ΥΥΜΔ.\n\n4. Η ΑΠΥ, μετά τον έλεγχο πληρότητας των δικαιολογητικών και των τεχνικών και λοιπών στοιχείων των αιτήσεων, αποστέλλει αντίγραφο της αίτησης (χωρίς τον φάκελο) στην κεντρική υπηρεσία του ΥΥΜΔ, η οποία προβαίνει σε ελέγχους ηλεκτρομαγνητικής εναρμόνισης των σταθμών σε συνεργασία με την ΕΕΤΤ και λοιπές συναρμόδιες υπηρεσίες. Στη συνέχεια και μετά την επιτυχή εναρμόνιση, η κεντρική υπηρεσία του ΥΥΜΔ ενημερώνει την ΑΠΥ, η οποία προβαίνει στην έκδοση της ειδικής άδειας.\n\n5. Σε περίπτωση αίτησης για νέο σταθμό, που δεν εναρμονίζεται με ήδη αδειοδοτημένο σταθμό ή σταθμό περιλαμβανόμενο σε ισχύοντα πίνακα αναμεταδοτών-επαναληπτών-ραδιοφάρων, η κεντρική υπηρεσία του ΥΥΜΔ ενημερώνει τον αιτούντα και του ζητά να υποβάλει νεώτερη αίτηση-πρόταση που θα επιλύει το πρόβλημα. Σε περιπτώσεις που κατά την επεξεργασία αιτημάτων για νέους σταθμούς ανακύψουν προβλήματα εναρμόνισης μεταξύ τους, για οποιονδήποτε λόγο, η κεντρική υπηρεσία του ΥΥΜΔ ενημερώνει τους ενδιαφερόμενους και τους ζητά να υποβάλουν εντός ευλόγου χρονικού διαστήματος κοινή νέα πρόταση που θα επιλύει το πρόβλημα. Οι υπό διένεξη αναμεταδότες-επαναλήπτες-ραδιοφάροι δεν αδειοδοτούνται από τις ΑΠΥ μέχρι την οριστική επίλυση της διένεξης.\n\n6. Απαγορεύεται η εγκατάσταση και λειτουργία οποιουδήποτε αναμεταδότη-επαναλήπτη-ραδιοφάρου για τον οποίο δεν έχει εκδοθεί ειδική άδεια.\n\n7. Σε περιπτώσεις πρόκλησης επιβλαβών παρεμβολών, ο υπεύθυνος του αναμεταδότη-επαναλήπτη-ραδιοφάρου αίρει άμεσα κάθε δυσλειτουργία ή προβαίνει σε διακοπή λειτουργίας του και ενημερώνει την ΕΕΤΤ και την ΑΠΥ.\n\n8. Τον Δεκέμβριο εκάστου έτους οι ΑΠΥ αποστέλλουν στην κεντρική υπηρεσία του ΥΥΜΔ αντίγραφα των ειδικών αδειών αναμεταδοτών-επαναληπτών-ραδιοφάρων, προκειμένου να εκδοθεί, το επόμενο έτος, ο ετήσιος συγκεντρωτικός πίνακας.\n\n9. Όταν αριθμός σταθμών λειτουργούν ταυτόχρονα σε κοινό κύκλωμα είτε ως σταθμοί αναμετάδοσης ή εν παραλλήλω ή σε διαφορετικές συχνότητες, κάθε σταθμός πρέπει να εκπέμπει το δικό του χαρακτηριστικό κλήσεως ή αυτό που χαρακτηρίζει όλους τους σχετικούς σταθμούς.\n\n10. Η διάρκεια ισχύος της ειδικής άδειας αναμεταδότη-επαναλήπτη-ραδιοφάρου είναι δεκαετής και ανανεώνεται/τροποποιείται για νέα περίοδο δέκα (10) ετών με αίτηση του ενδιαφερομένου προσκομίζοντας εκ νέου όλα τα ανωτέρω δικαιολογητικά συμπεριλαμβανομένου και του προβλεπόμενου παραβόλου. Με τη λήξη ισχύος της ειδικής άδειας αίρεται αυτομάτως κάθε δικαίωμα λειτουργίας του σταθμού, συμπεριλαμβανόμενων και των δικαιωμάτων εγκατάστασης της κεραίας του."},{"number":"Άρθρο 27","title":"Μεταβατικές διατάξεις – Καταργούμενες διατάξεις – ΠΑΡΑΡΤΗΜΑΤΑ","body":"1. Τα ελληνικά πτυχία που έχουν εκδοθεί μέχρι την έναρξη ισχύος του παρόντος κανονισμού, παραμένουν ως έχουν και θεωρούνται πτυχία HAREC. Οι κάτοχοί τους δύνανται με αίτηση τους να ζητήσουν από τις ΑΠΥ σχετική βεβαίωση, σύμφωνα με το παράρτημα 5 της σύστασης TR 61-02 της CEPT.\n\n2. Οι άδειες «κατηγορίας 1» και «κατηγορίας 2» της Υπουργικής Απόφασης 68000/763/9-12-2002 (ΦΕΚ Β' 1579) «Κανονισμός λειτουργίας ερασιτεχνικών σταθμών ασυρμάτου», που εκδόθηκαν μέχρι και την ημερομηνία ισχύος της απόφασης αυτής εξομοιώνονται αυτοδικαίως με τις άδειες «κατηγορίας 1» (άδεια CEPT) του άρθρου 6. Στα χαρακτηριστικά κλήσεως, το πρόθεμα (prefix) «SW» αντικαθίσταται με το πρόθεμα «SV». Η κατάληξη-επίθεμα (suffix) του χαρακτηριστικού κλήσης παραμένει ίδιο. Η αντικατάσταση των παλαιών εντύπων των αδειών (SW) θα πραγματοποιείται σταδιακά κατά την πρώτη ανανέωσή τους. Οι ενδιαφερόμενοι, εφόσον το επιθυμούν, μπορούν, με αίτησή τους προς τις ΑΠΥ, να ζητούν πριν τη λήξη της άδειάς τους, τη σχετική τροποποίηση του εντύπου αδείας, σύμφωνα με τις διατάξεις του άρθρου 9.\n\n3. Tα χαρακτηριστικά κλήσεως των ραδιοερασιτεχνικών συλλόγων με το πρόθεμα (prefix) «SV» αντικαθίσταται με το πρόθεμα «SΖ» μέχρι 31-12-2013. Κατά τα λοιπά, η κατάληξη-επίθεμα (suffix) παραμένει ως έχει.\n\n4. Οι Ελληνικές ραδιοερασιτεχνικές άδειες με διακριτικά κλήσης της σειράς zero «0» που έχουν χορηγηθεί μέχρι την ημερομηνία ισχύος της απόφασης αυτής, βάσει άδειας της αλλοδαπής, εξακολουθούν να ισχύουν μέχρι τη λήξη τους ως έχουν, ενώ για το διάστημα αυτό δεν αντικαθίστανται τα διακριτικά κλήσης από «SW0» σε «SV0». Μετά τη λήξη των αδειών αυτών, οι ενδιαφερόμενοι μπορούν να αποκτούν άδεια, σύμφωνα με τις διατάξεις της παρούσας απόφασης. Σε περιπτώσεις που κάτοχοι αδειών με διακριτικό κλήσεως της σειράς zero «0» αιτούνται την έκδοση αδειών «κατηγορίας 1» (άδειες CEPT) βάσει Ελληνικού ή αλλοδαπού πτυχίου HAREC ή «κατηγορίας εισαγωγικού επιπέδου» βάσει Ελληνικού πτυχίου «κατηγορίας εισαγωγικού επιπέδου», υποχρεωτικά τους εκχωρείται νέο διακριτικό κλήσεως της σειράς SV1, SV2 έως SV9 ή SY1, SY2 έως SY9, αντίστοιχα.\n\n5. Για τη λειτουργία των σταθμών που περιλαμβάνονται στους υφιστάμενους, εγκεκριμένους πίνακες επαναληπτών – αναμεταδοτών και ραδιοφάρων της υπηρεσίας ραδιοερασιτέχνη, παρέχεται μεταβατική περίοδος δέκα (10) ετών από τη θέση σε ισχύ της παρούσας απόφασης εντός της οποίας πρέπει να εξασφαλισθεί η αδειοδότησή τους σύμφωνα με τις διατάξεις του παρόντος. Εκκρεμείς αιτήσεις για έγκριση αναμεταδοτών-επαναληπτών-ραδιοφάρων που υποβλήθηκαν πριν από τη θέση σε ισχύ του παρόντος κανονισμού θα εξετασθούν κατόπιν νέων αιτήσεων στις ΑΠΥ σύμφωνα με το άρθρο 26.\n\n6. Από την έναρξη ισχύος του παρόντος κανονισμού καταργείται η Υπουργική Απόφαση 68000/763/9-12-2002 (ΦΕΚ Β' 1579) «Κανονισμός λειτουργίας ερασιτεχνικών σταθμών ασυρμάτου».\n\n7. Οι εξετάσεις που προβλέπονται στα άρθρα 3, 4 και 5 θα διενεργηθούν για πρώτη φορά μετά την έκδοση σχετικής εγκυκλίου του Γενικού Γραμματέα Επικοινωνιών, με την οποία θα ανακοινωθεί η εφαρμογή του νέου ηλεκτρονικού συστήματος εξετάσεων.\n\n8. Τα παραρτήματα 1 και 2 αποτελούν αναπόσπαστο μέρος του παρόντος κανονισμού."},{"number":"Παράρτημα 1","title":"Πίνακας Διακριτικών Κλήσεως","body":"ΕΙΔΟΣ ΔΙΑΚΡΙΤΙΚΩΝ ΚΛΗΣΕΩΣ — ΕΝΔΙΑΦΕΡΟΜΕΝΟΙ — ΔΙΑΚΡΙΤΙΚΑ ΚΛΗΣΕΩΣ (CALL SIGN)\n\n1. Διακριτικά κλήσεως ραδιοερασιτεχνικών αδειών ΚΑΤΗΓΟΡΙΑΣ 1 — CEPT\nΕνδιαφερόμενοι: Ραδιοερασιτέχνες κάτοχοι Ελληνικού Πτυχίου Ραδιοερασιτέχνη ΚΑΤΗΓΟΡΙΑΣ 1 — HAREC\nΔιακριτικά: SV1, SV2… SV9 ακολουθούμενο από δύο (2), τρία (3) ή τέσσερα (4) λατινικά γράμματα\n\n2. Διακριτικά κλήσεως ραδιοερασιτεχνικών αδειών «ΚΑΤΗΓΟΡΙΑΣ ΕΙΣΑΓΩΓΙΚΟΥ ΕΠΙΠΕΔΟΥ»\nΕνδιαφερόμενοι: Ραδιοερασιτέχνες κάτοχοι Ελληνικού Πτυχίου Ραδιοερασιτέχνη «ΚΑΤΗΓΟΡΙΑΣ ΕΙΣΑΓΩΓΙΚΟΥ ΕΠΙΠΕΔΟΥ»\nΔιακριτικά: SY1, SY2… SY9 ακολουθούμενο από τρία (3) ή τέσσερα (4) λατινικά γράμματα\n\n3. Διακριτικά κλήσεως κατόχων άδειας ραδιοερασιτέχνη SV0 βάσει αδείας της αλλοδαπής\nΕνδιαφερόμενοι: Ραδιοερασιτέχνες με άδεια αλλοδαπής (όχι CEPT), μη κατέχοντες Ελληνικό Πτυχίο Ραδιοερασιτέχνη σύμφωνα με το Άρθρο 24\nΔιακριτικά: SV0 ακολουθούμενο από δύο (2) ή τρία (3) λατινικά γράμματα. Οι νέες εκχωρήσεις γίνονται από την σειρά XAA, XAB XAC… μέχρι και XZZ\n\n4. Διακριτικά κλήσεως κατόχων άδειας ραδιοερασιτέχνη νομικών προσώπων\nΕνδιαφερόμενοι:\n• Ραδιοερασιτεχνικοί σύλλογοι\n• Ραδιοηλεκτρικά Εργαστήρια τριτοβάθμιας εκπαίδευσης\nΔιακριτικά: SZ1, SΖ2… SΖ9 ακολουθούμενο από ένα (1) μέχρι τέσσερα (4) λατινικά γράμματα\n\n5. ΕΕΤΤ\nΔιακριτικά: SV1 έως 9, SZ1 έως 9, SX1 έως 9, SY1 έως 9, J41 έως 9 — EETT\n\n6. Γενική Γραμματεία Πολιτικής Προστασίας\nΔιακριτικά: SV1 έως 9, SZ1 έως 9, SX1 έως 9, SY1 έως 9, J41 έως 9 — GGPP\n\n7. Γενική Γραμματεία Επικοινωνιών\nΔιακριτικά: SV1 έως 9, SZ1 έως 9, SX1 έως 9, SY1 έως 9, J41 έως 9 — T T\n\n8. Ειδικά διακριτικά κλήσεως (SPECIAL CALL SIGN)\n• Ραδιοερασιτεχνικοί σύλλογοι – νομικά πρόσωπα: SV, SZ, J4 ή SX\n• Ομάδες ραδιοερασιτεχνών ή Μεμονωμένοι Έλληνες ραδιοερασιτέχνες «κατηγορίας 1»: SV, J4 ή SX\n• Μεμονωμένοι Έλληνες ραδιοερασιτέχνες κατηγορίας «Εισαγωγικού Επιπέδου»: SY\n• Αλλοδαποί ραδιοερασιτέχνες: SW\n\n9. Διακριτικά κλήσεως Αναμεταδοτών — Επαναληπτών — Ραδιοφάρων\nΕνδιαφερόμενοι: Ραδιοερασιτεχνικοί σύλλογοι–νομικά πρόσωπα\nΔιακριτικά:\n• Για μετάδοση φωνής: SV1, SV2… SV9 ακολουθούμενο από ένα (1) λατινικό γράμμα ή SW1, SW2…SW9 ακολουθούμενο από ένα (1) λατινικό γράμμα\n• Για ραδιοφάρους: SV1, SV2… SV9 ακολουθούμενο από ένα (1) λατινικό γράμμα ή SW1, SW2…SW9 ακολουθούμενο από ένα (1) έως (4) λατινικά γράμματα\n• Για ψηφιακούς: J41, J42… J49 ακολουθούμενο από τρία (3) λατινικά γράμματα\n\nΣΗΜΕΙΩΣΗ 1: Σε εξαιρετικής σημασίας γεγονότα (π.χ. ανάληψη πολύ σημαντικών αθλητικών διοργανώσεων, διεθνών διασκέψεων, επετείων κλπ) μπορούν να χορηγηθούν ειδικά διακριτικά κλήσεως με σύνθεση διαφορετική από αυτή που ορίζεται στον ανωτέρω Πίνακα ακόμα και με επίθεμα περισσότερων των τεσσάρων χαρακτήρων.\n\nΣΗΜΕΙΩΣΗ 2: Σε περιπτώσεις που εξαντλούνται τα διακριτικά κλήσεως σταθμών αναμεταδοτών-επαναληπτών-ραδιοφάρων μπορούν να χορηγηθούν και άλλα διακριτικά κλήσεως με σύνθεση διαφορετική από αυτή που ορίζεται στον ανωτέρω Πίνακα.\n\nΣΗΜΕΙΩΣΗ 3: Για τους ψηφιακούς επαναλήπτες το πρώτο από τα τρία λατινικά γράμματα του διακριτικού τους υποδηλώνει την υποζώνη συχνότητας λειτουργίας (V,U,S).\n\nΣΗΜΕΙΩΣΗ 4: Δεν εκχωρούνται οι σειρές QRA έως QRZ, QSA έως QSZ και QTA έως QTZ που εμπεριέχονται στον Κώδικα Q. Επίσης δεν εκχωρείται το επίθεμα SOS."},{"number":"Παράρτημα 2","title":"Εξεταστέα Ύλη για την Απόκτηση Ελληνικού Πτυχίου Ραδιοερασιτέχνη","body":"Ι. Γενικά:\n\nΑ. Στις περιπτώσεις που αναφέρονται αριθμητικές ποσότητες, οι υποψήφιοι θα πρέπει να γνωρίζουν τις αντίστοιχες μονάδες που χρησιμοποιούνται καθώς και τα πολλαπλάσια και υποπολλαπλάσιά τους.\n\nΒ. Οι υποψήφιοι θα πρέπει να είναι εξοικειωμένοι με τα χρησιμοποιούμενα σύμβολα.\n\nΓ. Οι υποψήφιοι θα πρέπει να γνωρίζουν τις ακόλουθες μαθηματικές έννοιες και πράξεις:\n• Πρόσθεση, αφαίρεση, πολλαπλασιασμό και διαίρεση\n• Κλάσματα\n• Δυνάμεις του δέκα και εκθετικά\n• Τετραγωνισμούς\n• Τετραγωνικές ρίζες\n• Αντίστροφες τιμές\n• Ερμηνεία γραμμικών και μη-γραμμικών γραφημάτων\n\nΔ. Οι υποψήφιοι θα πρέπει να είναι εξοικειωμένοι με τους μαθηματικούς τύπους που χρησιμοποιούνται σε αυτήν την εξεταστέα ύλη και να είναι σε θέση να τους εφαρμόσουν.\n\nΙΙ. Ύλη Εξετάσεων:\n\nΚΕΦΑΛΑΙΟ A΄ – «Τεχνικά Θέματα»\n\n1. ΗΛΕΚΤΡΙΣΜΟΣ, ΗΛΕΚΤΡΟΜΑΓΝΗΤΙΣΜΟΣ ΚΑΙ ΡΑΔΙΟΘΕΩΡΙΑ\n1.1 Αγωγιμότητα — Αγωγοί, ημιαγωγοί και μονωτές· Ρεύμα, τάση και αντίσταση· Οι μονάδες ampere, volt και ohm· Ο νόμος του Ohm [E = I*R]· Οι νόμοι του Kirchhoff· Ηλεκτρική ισχύς [P = E*I]· Η μονάδα Watt· Ηλεκτρική ενέργεια [W = P*t]· Η χωρητικότητα μπαταρίας [ampere – hour].\n1.2 Πηγές Ηλεκτρισμού — Τάση πηγής, Ηλεκτρεγερτική δύναμη [EMF], ρεύμα βραχυκύκλωσης, εσωτερική αντίσταση και τάση στους πόλους· Παράλληλη και σε σειρά σύνδεση πηγών τάσης.\n1.3 Ηλεκτρικό Πεδίο — Ένταση ηλεκτρικού πεδίου· Η μονάδα volt/meter· Θωράκιση από ηλεκτρικά πεδία.\n1.4 Μαγνητικό Πεδίο — Μαγνητικό πεδίο γύρω από ηλεκτροφόρο αγωγό· Θωράκιση από μαγνητικά πεδία.\n1.5 Ηλεκτρομαγνητικό Πεδίο — Τα ραδιοκύματα όπως τα ηλεκτρομαγνητικά κύματα· Ταχύτητα διάδοσης και σχέση αυτής με τη συχνότητα και το μήκος κύματος [v = f*λ]· Πόλωση κύματος.\n1.6 Ημιτονοειδή Σήματα — Γραφική παράσταση συναρτήσει του χρόνου· Στιγμιαία τιμή, πλάτος [Emax], ενεργός τιμή [RMS] και μέση τιμή [Ueff = Umax/√2]· Περίοδος και διάρκεια περιόδων· Συχνότητα· Η μονάδα Hertz· Διαφορά φάσης.\n1.7 Μη Ημιτονοειδή Σήματα, Θόρυβος — Ακουστικά σήματα· Τετραγωνικοί παλμοί· Γραφική παράσταση συναρτήσει του χρόνου· Συνιστώσα συνεχούς ρεύματος, θεμελιώδης συνιστώσα και υψηλές αρμονικές· Θόρυβος [PN = kTB] (θερμικός θόρυβος δέκτη, θόρυβος ζώνης συχνοτήτων, πυκνότητα ισχύος θορύβου, ισχύς θορύβου στο εύρος συχνοτήτων του δέκτη).\n1.8 Διαμορφωμένα Σήματα — Συνεχούς κύματος (CW)· Διαμόρφωση πλάτους· Διαμόρφωση φάσης, συχνότητας και μίας πλευρικής ζώνης· Απόκλιση συχνότητας και δείκτης διαμόρφωσης [m = ΔF/fmod]· Φέρουσα, πλευρικές ζώνες και εύρος ζώνης· Κυματομορφές: CW, AM, SSB, FM· Φάσμα κυματομορφών CW, AM και SSB· Ψηφιακές διαμορφώσεις: FSK, 2-PSK, 4-PSK, QAM· ρυθμός μετάδοσης δεδομένων (bit rate), διαμορφωμένου σήματος (baud rate) και εύρος ζώνης· Κυκλικοί κώδικες ελέγχου σφαλμάτων (CRC) και επαναμετάδοση (πχ packet radio), εμπροσθόδοτη διόρθωση σφαλμάτων (πχ κώδικας Amtor).\n1.9 Ισχύς και Ενέργεια — Η ισχύς ημιτονοειδών σημάτων [P = i²×R, P = u²/R]· Λόγοι ισχύος σε decibel (0 db, 3 db, 6 db, 10 db, 20 db)· Λόγος ισχύος εισόδου/εξόδου σε db για σε σειρά συνδέσεις ενισχυτών και εξασθενητών· Προσαρμογή αντιστάσεων· Σχέση ισχύος εισόδου/εξόδου και απόδοσης [n = Pout/Pin × 100%]· Ισχύς κορυφής [p.e.p.].\n1.10 Ψηφιακή Επεξεργασία Σήματος — Δειγματοληψία και κβαντισμός αναλογικών σημάτων· Ελάχιστος ρυθμός δειγματοληψίας (συχνότητα Nyquist)· Συνέλιξη· Φίλτρα anti-aliasing, φίλτρα αναδόμησης σήματος· Μετατροπείς ADC/DAC.\n\n2. ΕΞΑΡΤΗΜΑΤΑ\n2.1 Αντιστάτης — Μονάδα Ohm· Αντίσταση· Χαρακτηριστικά ρεύματος/τάσης· Κατανάλωση ισχύος.\n2.2 Πυκνωτής — Χωρητικότητα· Μονάδα farad· Σχέση χωρητικότητας με διαστάσεις και διηλεκτρικό· Χωρητική αντίσταση [Xc = 1/(2πfC)]· Σχέση φάσης τάσης-ρεύματος.\n2.3 Πηνίο — Αυτεπαγωγή· Μονάδα henry· Επαγωγική αντίσταση [XL = 2πf*L]· Σχέση φάσης τάσης-ρεύματος· Συντελεστής Q.\n2.4 Μετασχηματιστές — Ιδανικός μετασχηματιστής [Pprim = Psec]· Λόγος σπειρών, τάσης, ρεύματος, σύνθετης αντίστασης.\n2.5 Δίοδος — Δίοδοι ανόρθωσης, φώρασης, LED, zener, varicap· Ανάστροφη τάση και ρεύμα διαρροής.\n2.6 Τρανζίστορ — PNP/NPN· Συντελεστής ενίσχυσης· Σύγκριση FET και BJT· Κυκλώματα κοινού εκπομπού, κοινής βάσης, κοινού συλλέκτη· Αντιστάσεις εισόδου/εξόδου.\n2.7 Διάφορα — Θερμιονική λυχνία· Ολοκληρωμένα κυκλώματα (τελεστικοί ενισχυτές)· Κυκλώματα πύλες· Λυχνίες υψηλής ισχύος.\n\n3. ΗΛΕΚΤΡΟΝΙΚΑ ΚΥΚΛΩΜΑΤΑ\n3.1 Συνδυασμοί Εξαρτημάτων — Συνδέσεις σε σειρά και παράλληλα· Συμπεριφορά πραγματικών στοιχείων σε υψηλές συχνότητες.\n3.2 Φίλτρα — Συντονισμένα κυκλώματα παράλληλα/σειρά· Σύνθετη αντίσταση· Συχνότητα συντονισμού [f = 1/(2π√(LC))]· Συντελεστής Q· Εύρος ζώνης· Χαμηλοπερατό, ζωνοπερατό, υψιπερατό, αποκοπής· Φίλτρα Π και Τ· Πιεζοηλεκτρικός κρύσταλλος· Ψηφιακά φίλτρα.\n3.3 Τροφοδοτικά — Ανορθωτές ημικύματος/πλήρους κύματος/γέφυρας· Εξομάλυνση· Σταθεροποίηση· Μεταβαλλόμενης κατάστασης· EMC.\n3.4 Ενισχυτές — Χαμηλών/υψηλών συχνοτήτων· Συντελεστής ενίσχυσης· Χαρακτηριστικά πλάτους/συχνότητας· Τάξεις Α, Α/Β, Β, C· Αρμονικές παραμορφώσεις, ενδο-διαμορφώσεις, κορεσμός.\n3.5 Φωρατές — AM, δίοδοι φώρασης, ανιχνευτής γινομένου, FM.\n3.6 Ταλαντωτές — Ανάδραση· Παράγοντες σταθερότητας· LC, κρυσταλλικός, αρμονικός· VCO· Θόρυβος φάσης.\n3.7 PLL — Βρόχος ελέγχου σύγκρισης φάσης· Σύνθεση συχνότητας.\n3.8 DSP — FIR/IIR· Μετασχηματισμοί Fourier (DFT, FFT)· DDS.\n\n4. ΔΕΚΤΕΣ\n4.1 Τύποι — Υπερετερόδυνοι απλής/διπλής μετατροπής· Απ' ευθείας μετατροπής.\n4.2 Διαγράμματα Μπλοκ — CW [A1A], AM [A3E], SSB [J3E], FM [F3E].\n4.3 Βαθμίδες — Ενισχυτής HF, ταλαντωτής, μίκτης, IF, περιοριστής, φωρατής, LF, AGC, S-meter, squelch.\n4.4 Χαρακτηριστικά — Απόρριψη γειτονικού καναλιού, επιλεκτικότητα, ευαισθησία, θόρυβος, σταθερότητα, συχνότητα ειδώλου, blocking, ενδο-διαμόρφωση, αμοιβαία μίξη.\n\n5. ΠΟΜΠΟΙ\n5.1 Τύποι — Με/χωρίς μετατροπή συχνότητας.\n5.2 Διαγράμματα Μπλοκ — CW [A1A], SSB [J3E], FM [F3E].\n5.3 Βαθμίδες — Μίκτης, ταλαντωτής, buffer, driver, multiplier, ενισχυτής ισχύος, προσαρμογή/φίλτρα εξόδου, διαμορφωτές, κρυσταλλικό φίλτρο.\n5.4 Χαρακτηριστικά — Σταθερότητα, εύρος ζώνης RF/LF, πλευρικές, μη γραμμικότητα, αντίσταση εξόδου, ισχύς εξόδου, απόδοση, απόκλιση συχνότητας, δείκτης διαμόρφωσης, κλικς, splatter, παρασιτικές εκπομπές, θόρυβος φάσης.\n\n6. ΚΕΡΑΙΕΣ ΚΑΙ ΓΡΑΜΜΕΣ ΜΕΤΑΦΟΡΑΣ\n6.1 Τύποι — Δίπολο τροφοδοτούμενο στο μέσο/άκρο· Αναδιπλωμένο· Κατακόρυφη ¼λ ground plane· Yagi· Ανοίγματος (παραβολικός, χοανοκεραία)· Δίπολο με trap.\n6.2 Χαρακτηριστικά — Κατανομή ρεύματος/τάσης· Σύνθετη αντίσταση στο σημείο τροφοδοσίας· Πόλωση· Κατευθυντικότητα, αποδοτικότητα, απολαβή· Περιοχή σύλληψης· ERP/EIRP· Front-to-back· Διάγραμμα ακτινοβολίας.\n6.3 Γραμμές Μεταφοράς — Παράλληλη γραμμή· Ομοαξονικό· Κυματοδηγός· Χαρακτηριστική αντίσταση [Z0]· Συντελεστής ταχύτητας· SWR· Απώλειες· Balun· Μονάδες προσαρμογής Π/Τ.\n\n7. ΔΙΑΔΟΣΗ ΚΥΜΑΤΩΝ — Εξασθένηση, SNR· Διάδοση οπτικής επαφής (νόμος αντίστροφου τετραγώνου)· Ιονοσφαιρικά στρώματα· Κρίσιμη συχνότητα· Επίδραση ήλιου· MUF· Κύμα εδάφους/χώρου, skip distance· Πολυδιαδρομική διάδοση· Διαλείψεις· Τροπόσφαιρα· Επίδραση ύψους κεραιών (ραδιορίζοντας)· Θερμοκρασιακή αναστροφή· Σποραδικό E· Aurora· Σκέδαση μετεωριτών· Ανακλάσεις σελήνης· Ατμοσφαιρικός/γαλαξιακός/θερμικός θόρυβος· Link budget.\n\n8. ΜΕΤΡΗΣΕΙΣ\n8.1 Λήψη Μετρήσεων — DC/AC ρεύματα και τάσεις (λάθη μετρήσεων: συχνότητα, κυματομορφή, εσωτερική αντίσταση)· Αντίσταση· DC/RF ισχύς· SWR· Κυματομορφή περιβάλλουσας· Συχνότητα· Συντονισμού.\n8.2 Όργανα — Κινητό πηνίο, πολύμετρο, γέφυρα SWR, ψηφιακό συχνόμετρο, απορρόφησης, βύθισης (dip), παλμογράφος, μετρητής ισχύος RF, γεννήτρια σημάτων, αναλυτής φάσματος.\n\n9. ΠΑΡΕΜΒΟΛΕΣ ΚΑΙ ΑΝΤΟΧΗ ΣΥΣΚΕΥΩΝ\n9.1 Παρεμβολές — Blocking· Επιθυμητό σήμα· Ενδοδιαμόρφωση· Φώραση από κυκλώματα ήχου.\n9.2 Αίτια — Ένταση πεδίου· Παρασιτική ακτινοβολία/αρμονικές· Επίδραση μέσω εισόδου κεραίας, άλλων γραμμών, απευθείας ακτινοβόλησης.\n9.3 Μέτρα — Φιλτράρισμα· Αποσύζευξη· Θωράκιση.\n\n10. ΑΣΦΑΛΕΙΑ — Ανθρώπινο σώμα· Ανθεκτικότητα σε συνεχές/εναλλασσόμενο ρεύμα· Παροχές κοινής ωφελείας· Υψηλές τάσεις σε πομπούς· Κεραυνικό πλήγμα, αποτελέσματα, ακτίνα επίδρασης· Αντικεραυνική προστασία, αλεξικέραυνα.\n\nΚΕΦΑΛΑΙΟ Β΄ – «Λειτουργικοί κανόνες και διαδικασίες»\n\n1. ΦΩΝΗΤΙΚΑ ΑΛΦΑΒΗΤΑ:\n\nΔΙΕΘΝΕΣ ΦΩΝΗΤΙΚΟ ΑΛΦΑΒΗΤΟ:\nA = Alpha, B = Bravo, C = Charlie, D = Delta, E = Echo, F = Foxtrot, G = Golf, H = Hotel, I = India, J = Juliet, K = Kilo, L = Lima, M = Mike, N = November, O = Oscar, P = Papa, Q = Quebec, R = Romeo, S = Sierra, T = Tango, U = Uniform, V = Victor, W = Whiskey, X = X-ray, Y = Yankee, Z = Zulu.\n\nΕΛΛΗΝΙΚΟ ΦΩΝΗΤΙΚΟ ΑΛΦΑΒΗΤΟ:\nΑ = Αστήρ, Β = Βύρων, Γ = Γαλή, Δ = Δόξα, Ε = Ερμής, Ζ = Ζεύς, Η = Ηρώ, Θ = Θεά, Ι = Ίσκιος, Κ = Κενόν, Λ = Λάμα, Μ = Μέλι, Ν = Ναός, Ξ = Ξέρξης, Ο = Οσμή, Π = Πέτρος, Ρ = Ρήγας, Σ = Σοφός, Τ = Τίγρης, Υ = Ύμνος, Φ = Φωφώ, Χ = Χαρά, Ψ = Ψυχή, Ω = Ωμέγα.\n\n2. ΚΩΔΙΚΑΣ Q:\nQRG — Ποια είναι η συχνότητά σου; / Η συχνότητα μου είναι …\nQRK — Ποια είναι η ευκρίνεια του σήματός μου; / Η ευκρίνεια του σήματος σου είναι …\nQRL — Είσαι απασχολημένος; / Είμαι απασχολημένος\nQRM — Παρεμβάλλεται κανείς στο σήμα μου; / Ναι ή Όχι\nQRN — Έχεις πρόβλημα από στατικά; / Έχω πρόβλημα από στατικά\nQRO — Να αυξήσω την ισχύ εκπομπής; / Αύξησε ισχύ εκπομπής\nQRP — Να μειώσω την ισχύ εκπομπής; / Μείωσε ισχύ εκπομπής\nQRT — Να σταματήσω την αποστολή; / Σταμάτα την αποστολή\nQRY — Ποιά είναι η σειρά μου; / Η σειρά σου είναι …\nQRZ — Ποιος με καλεί; / Σε καλεί ο …\nQRV — Είσαι έτοιμος; / Είμαι έτοιμος\nQSB — Έχουν τα σήματά μου διαλείψεις; / Τα σήματά σου έχουν διαλείψεις\nQSL — Μπορείς να επιβεβαιώσεις τη λήψη; / Επιβεβαιώνω τη λήψη\nQSO — Μπορείς να επικοινωνήσεις απευθείας με τον …; / Μπορώ να επικοινωνήσω απευθείας με τον …\nQSY — Να αλλάξω τη συχνότητα; / Άλλαξε συχνότητα\nQRX — Πότε θα επικοινωνήσεις πάλι; / Θα επικοινωνήσω πάλι στις …, στη συχνότητα …kHz (ή MHz)\nQTH — Ποια είναι η θέση σου (σε γεωγραφικό μήκος ή πλάτος); / Η θέση μου είναι …γεωγραφικό μήκος και …γεωγραφικό πλάτος\n\n3. ΣΥΝΤΟΜΟΓΡΑΦΙΕΣ ΟΠΩΣ ΣΥΝΗΘΩΣ ΧΡΗΣΙΜΟΠΟΙΟΥΝΤΑΙ ΑΠΟ ΤΟΥΣ ΡΑΔΙΟΕΡΑΣΙΤΕΧΝΕΣ:\nBK — Σήμα που χρησιμοποιείται για να διακόψει μία εκπομπή σε εξέλιξη\nCQ — Γενική κλήση προς όλους τους σταθμούς\nCW — Συνεχές κύμα\nDE — Εδώ ο .... (για το διαχωρισμό του διακριτικού του καλουμένου από το σταθμό που κάνει την κλήση)\nK — Πρόσκληση για εκπομπή\nMSG — Μήνυμα\nPSE ή PLZ — Παρακαλώ\nRST — Ευκρίνεια, Ισχύς σήματος, Ποιότητα τόνου\nR — Λήφθηκε\nRX — Δέκτης\nTX — Πομπός\nUR — Δικό σου\n\n4. ΔΙΕΘΝΗ ΣΗΜΑΤΑ ΚΙΝΔΥΝΟΥ, ΕΠΙΚΟΙΝΩΝΙΑ ΣΕ ΠΕΡΙΠΤΩΣΕΙΣ ΦΥΣΙΚΩΝ ΚΑΤΑΣΤΡΟΦΩΝ ΚΑΙ ΕΠΕΙΓΟΥΣΩΝ ΑΝΑΓΚΩΝ\n1. Σήματα κινδύνου:\n• Σε ραδιοτηλεγραφία: …—…— [SOS]\n• Σε ραδιοτηλεφωνία: «MAYDAY»\n• Διεθνής χρήση των ερασιτεχνικών σταθμών στην περίπτωση εθνικών καταστροφών\n2. Εκχωρημένες συχνότητες για χρήση από την υπηρεσία ερασιτέχνη\n\n5. ΔΙΑΚΡΙΤΙΚΑ ΚΛΗΣΗΣ — Αναγνώριση του ερασιτεχνικού σταθμού από το διακριτικό κλήσης του· Χρήση των διακριτικών κλήσης και των ειδικών διακριτικών κλήσης· Σύνθεση των διακριτικών κλήσης· Εθνικά προθέματα, διεθνής κατανομή προθεμάτων.\n\n6. ΚΑΤΑΝΟΜΗ ΧΡΗΣΗΣ ΥΠΟΖΩΝΩΝ ΣΥΧΝΟΤΗΤΩΝ ΑΠΟ ΤΗΝ IARU — Κατανομή χρήσης υποζωνών και διαφύλαξή της· Σκοπός κατανομής.\n\n7. ΥΠΗΡΕΣΙΑ ΕΡΑΣΙΤΕΧΝΗ — Κοινωνική ευθύνη της υπηρεσίας ερασιτέχνη· Διαδικασίες Λειτουργίας.\n\nΚΕΦΑΛΑΙΟ Γ΄ – «Εθνικό και Διεθνές Νομικό Πλαίσιο για την υπηρεσία ερασιτέχνη»\n\n1. ΚΑΝΟΝΙΣΜΟΣ ΡΑΔΙΟΕΠΙΚΟΙΝΩΝΙΩΝ ΤΗΣ ITU — Ορισμός της υπηρεσίας ερασιτέχνη και της υπηρεσίας ερασιτέχνη μέσω δορυφόρου· Ορισμός του ερασιτεχνικού σταθμού· Άρθρο 25 του Κανονισμού Ραδιοεπικοινωνιών (ARTICLE 25, Amateur services)· Κατάσταση υπηρεσίας ερασιτέχνη και της υπηρεσίας ερασιτέχνη μέσω δορυφόρου· Διεθνείς γεωγραφικές περιοχές της ITU (Regions).\n\n2. ΚΑΝΟΝΙΣΜΟΙ CEPT — Σύσταση T/R 61-01· Προσωρινή χρήση ερασιτεχνικών σταθμών σε χώρες-μέλη CEPT· Προσωρινή χρήση ερασιτεχνικών σταθμών στις χώρες-μη-μέλη CEPT που εφαρμόζουν τη Σύσταση T/R 61-01.\n\n3. ΕΘΝΙΚΟΙ ΝΟΜΟΙ, ΚΑΝΟΝΙΣΜΟΙ ΚΑΙ ΑΔΕΙΟΔΟΤΗΣΗ — Γενική εθνική νομοθεσία που σχετίζεται με τις ραδιοεπικοινωνίες και τον ραδιοερασιτεχνισμό· Ειδική νομοθεσία για την εγκατάσταση και λειτουργία κατασκευών κεραιών· Ειδική νομοθεσία για την ηλεκτρομαγνητική συμβατότητα και την ασφάλεια λειτουργίας πομποδεκτών, ηλεκτρολογικού, ηλεκτρονικού εξοπλισμού και των κεραιών ως σταθερών εγκαταστάσεων· Κανονισμοί και κατηγορίες αδειών και πτυχίων· Χρησιμοποίηση ημερολογίου σταθμού (τήρηση ημερολογίου, σκοπός, δεδομένα που καταγράφονται).\n\nΚΕΦΑΛΑΙΟ Δ΄ – «Βασικά πρακτικά θέματα»\n\n1. Εξοικείωση με συνδέσεις και χειρισμό τροφοδοτικών/δεκτών/πομπών/κεραιών (διακόπτης on/off, επιλογέας ζώνης συχνοτήτων, ρύθμιση συχνότητας και προβολή στην οθόνη, ρυθμιστής έντασης ήχου, ρύθμιση ισχύος εξόδου πομπού, κέρδος μικροφώνου, κέρδος κεραίας κ.τ.λ.).\n\n2. Δυνατότητα πραγματοποίησης επαφών με τον ενδεδειγμένο τρόπο (αναφορές σημάτων, όνομα και πληροφορίες σταθμού, σωστή χρήση του εξοπλισμού κλπ).\n\n3. Ειδικά θέματα λειτουργίας στα βραχέα κύματα HF (ρύθμιση σε άνω {USB} και κάτω {LSB} πλευρική ζώνη, πραγματοποίηση αρχικών κλήσεων, χρήση \"CQ\" κλπ).\n\n4. Ειδικά θέματα λειτουργίας στις ραδιοερασιτεχνικές υποζώνες συχνοτήτων VHF-UHF (λειτουργία σε διαμόρφωση συχνότητας (FM), λειτουργία σταθμού μέσω επαναλήπτη κ.λπ.).\n\n5. Κατανόηση θεμάτων προσαρμογής κεραίας και χρήσης του οργάνου μετρήσεως στασίμων κυμάτων (κατανόηση της σημασίας της σωστής προσαρμογής των διαφόρων βαθμίδων πομποδεκτών, χρήση οργάνων μέτρησης στασίμων κυμάτων {SWR meter} και προσαρμογέα κεραίας {Antenna Tuner} με σκοπό την προσαρμογή μιας κεραίας σε έναν πομπό, εφαρμογή ομοαξονικού συνδέσμου κλπ).\n\n6. Αποφυγή πρόκλησης παρεμβολών, αντιμετώπιση θεμάτων ηλεκτρομαγνητικής συμβατότητας και λήψη μέτρων προφύλαξης σχετικά με την λειτουργία του ραδιοεξοπλισμού."},{"number":"Άρθρο 27 (ΙΙ)","title":"Ισχύς-Δημοσίευση","body":"Ο Κανονισμός αυτός τίθεται σε ισχύ από την δημοσίευ "Όταν πρόκειται να γειώσουμε ένα ραδιοερασιτεχνικό σταθμό:","a":["Χρησιμοποιούμε ξεχωριστές γειώσεις για τα κουτιά, την κεραία και τα κυκλώματα εκπομπής σήματος.","Χρησιμοποιούμε μία ξεχωριστή γείωση για το θόρυβο και μία γείωση για όλα τα άλλα κυκλώματα.","Οδηγούμε όλα τα στοιχεία του σταθμού σε μία και μόνη, κοινή για όλα, γείωση.","Οδηγούμε όλες τις γειώσεις στο δίκτυο ύδρευσης."],"r":2},{"n":703,"c":"Γ","q":"Ποια από τα παρακάτω είναι ενδεδειγμένα μέτρα για τον περιορισμό ηλεκτρομαγνητικών παρεμβολών;","a":["Τοποθέτηση κατάλληλων φίλτρων.","Κατάλληλος τερματισμός των γραμμών μεταφοράς.","Σωστή γείωση του σταθμού.","Όλα τα παραπάνω."],"r":3},{"n":709,"c":"Γ","q":"Σε ποιες περιπτώσεις πρέπει οι ραδιοερασιτεχνικές συσκευές να φέρουν την σήμανση CE;","a":["Μόνο σε περίπτωση που οι ραδιοερασιτεχνικές συσκευές είναι εργοστασιακές.","Όταν πρόκειται για ιδιοκατασκευές.","Σε καμία περίπτωση.","Στην 1 και 2 απάντηση."],"r":0},{"n":710,"c":"Γ","q":"Τι είναι η \"Ηλεκτρομαγνητική Συμβατότητα\";","a":["Είναι Τεχνικό Χαρακτηριστικό.","Είναι Φυσικό Χαρακτηριστικό.","Είναι Σύμβαση και Πλαίσιο Λειτουργίας.","Είναι ευχή."],"r":2},{"n":712,"c":"Γ","q":"0 κάτοχος αδείας κατηγορίας \"εισαγωγικού επιπέδου\" μπορεί:","a":["Να εκπέμπει σε όλες τις εκχωρημένες ζώνες συχνοτήτων στην υπηρεσία ραδιοερασιτέχνη.","Να εκπέμπει σε όλες τις εκχωρημένες ζώνες συχνοτήτων στην υπηρεσία ραδιοερασιτέχνη μέσω δορυφόρου.","Να εκπέμπει σε όλες τις ζώνες που αναφέρονται στις δύο προηγούμενες διατυπώσεις.","Να εκπέμπει μόνο στις ζώνες που προβλέπονται από τον \"Κανονισμό Ραδιοερασιτεχνών\" για την κατηγορία αυτή."],"r":3},{"n":715,"c":"Γ","q":"Για τα Ελληνικά ραδιοερασιτεχνικά πτυχία, τι από τα παρακάτω ισχύει;","a":["Τα πτυχία ραδιοερασιτεχνών «Κατηγορίας 1» ισχύουν σε κάθε χώρα της ITU ενώ τα πτυχία \"Εισαγωγικού Επιπέδου\" ισχύουν μόνο στην Ευρώπη.","Τα πτυχία ραδιοερασιτεχνών «Κατηγορίας 1» ισχύουν μόνο για την Ελλάδα ενώ τα πτυχία \"Εισαγωγικού Επιπέδου\" ισχύουν σε όλη την Ευρώπη.","Τα πτυχία ραδιοερασιτεχνών «Κατηγορίας 1» είναι εναρμονισμένα πτυχία HAREC σύμφωνα με τη Σύσταση T/R 61-02 της CEPT ενώ τα πτυχία \"Εισαγωγικού Επιπέδου\" είναι εναρμονισμένα με την Αναφορά 89 της Επιτροπής Ηλεκτρονικών Επικοινωνιώντης CEPT."],"r":2},{"n":718,"c":"Γ","q":"Η ανταπόκριση μεταξύ ραδιοερασιτεχνικών σταθμών περιλαμβάνει:","a":["Μετάδοση μουσικής και φωνητικών προγραμμάτων.","Αποκλειστικά μεταβίβαση και λήψη ανακοινώσεων τεχνικού περιεχομένου.","Ανταλλαγή πληροφοριών προσωπικού περιεχομένου.","Διαφημιστικά και προπαγανδιστικά προγράμματα."],"r":1},{"n":719,"c":"Γ","q":"Η διάρκεια ισχύος της άδειας λειτουργίας σταθμού είναι:","a":["Ισόβια","Δεκαετής","Εξαετής","Εξαετής με τετραετή παράταση"],"r":1},{"n":721,"c":"Γ","q":"Η λήξη ισχύος της άδειας λειτουργίας ραδιοερασιτεχνικού σταθμού, τι συνέπειες έχει για τον κάτοχο της;","a":["Με τη λήξη ισχύος της ραδιοερασιτεχνικής άδειας αίρονται όλα τα δικαιώματα άσκησης ραδιοερασιτεχνικών δραστηριοτήτων εκτός από την χρησιμοποίηση ραδιοερασιτεχνικών αναμεταδοτών.","Με τη λήξη ισχύος της ραδιοερασιτεχνικής άδειας αίρεται αυτομάτως κάθε δικαίωμα άσκησης ραδιοερασιτεχνικών δραστηριοτήτων, συμπεριλαμβανόμενων και των δικαιωμάτων εγκατάστασης κεραίας ραδιοερασιτεχνικού σταθμού.","Ο ραδιοερασιτέχνης πρέπει να ζητήσει την σφράγιση των πομποδεκτών του από την αρμόδια υπηρεσία της Περιφέρειας.","Με τη λήξη ισχύος της ραδιοερασιτεχνικής άδειας, ο κάτοχος της πρέπει να μεριμνήσει για την ακύρωση του πτυχίου του."],"r":1},{"n":722,"c":"Γ","q":"Η χρήση ψευδών διακριτικών κλήσης ή ψευδών και ανεξακρίβωτων ειδήσεων επιτρέπεται:","a":["Την πρωταπριλιά για εθιμικούς λόγους.","Σε περιπτώσεις ειδικών μυστικών ανταποκρίσεων.","Ποτέ.","Για λόγους εθνικής ασφάλειας."],"r":2},{"n":723,"c":"Γ","q":"Ο ερασιτέχνης απαγορεύει τη χρήση του σταθμού του:","a":["Στους ανηλίκους.","Στους συνοικούντες και συγγενείς του.","Σε οποιονδήποτε που δεν διαθέτει τα νόμιμα προσόντα και όταν δεν είναι παρών ο ίδιος.","Σε αλλοδαπούς."],"r":2},{"n":724,"c":"Γ","q":"Ο ερασιτέχνης τηρεί ημερολόγιο λειτουργίας του σταθμού όπου αναγράφει:","a":["Την ημερομηνία, ώρα, διάρκεια της ανταπόκρισης.","Το διακριτικό κλήσης του σταθμού, την ισχύ και τη συχνότητα λειτουργίας.","Τον τύπο εκπομπής και τον τόπο εγκατάστασης του σταθμού.","όλα τα παραπάνω."],"r":3},{"n":725,"c":"Γ","q":"Οι άδειες λειτουργίας ερασιτεχνικού σταθμού έχουν διάρκεια:","a":["30 ετών","ισόβιες","3 ετών","10 ετών"],"r":3},{"n":726,"c":"Γ","q":"Οι ραδιοερασιτέχνες κάτοχοι άδειας «Κατηγορίας Εισαγωγικού Επιπέδου», δεν επιτρέπεται να εγκαθιστούν κεραίες με μέγιστο κέρδος μεγαλύτερο των τριών (3) dbi:","a":["Σωστό.","Λάθος.","Επιτρέπεται μόνο εφόσον η κεραία είναι Yagi."],"r":0},{"n":727,"c":"Γ","q":"Οριστική ανάκληση η αναστολή της άδειας λειτουργίας αναλόγως της βαρύτητας της παράβασης γίνεται:","a":["Όταν ο ερασιτεχνικός σταθμός χρησιμοποιείται για εμπορικούς σκοπούς η διαφημίσεις.","Όταν ο αδειούχος είναι υπαίτιος παρεμβολής ή επιζήμιας παρεμβολής.","Όταν ο αδειούχος εκπέμπει μουσική η φωνητικά προγράμματα με η χωρίς αμοιβή.","Για οτιδήποτε από τα παραπάνω."],"r":3},{"n":728,"c":"Γ","q":"Ποια είναι η αρμόδια Αρχή για τα θέματα ραδιοεξοπλισμού (δηλαδή για την εφαρμογή του Π.Δ. 44/2002 περί του ραδιοεξοπλισμού και τηλεπικοινωνιακού τερματικού εξοπλισμού κλπ);","a":["Ο Συνήγορος του Πολίτη.","Η Εθνική Επιτροπή Τηλεπικοινωνιών και Ταχυδρομείων (ΕΕΤΤ).","Οι υπηρεσίες Μεταφορών και Επικοινωνιών των Περιφερειών.","Η Αρχή Διασφάλισης Απορρήτου των Επικοινωνιών (ΑΔΑΕ)."],"r":1},{"n":729,"c":"Γ","q":"Ποια είναι η διάρκεια ισχύος των ραδιοερασιτεχνικών αδειών;","a":["Πέντε έτη.","Δέκα έτη.","Δεν υπάρχει λήξη ισχύος."],"r":1},{"n":731,"c":"Γ","q":"Ποιοι από τους παρακάτω φορείς έχουν δικαίωμα να λάβουν άδεια;","a":["Η Εθνική Επιτροπή Τηλεπικοινωνιών και Ταχυδρομείων.","Η Γενική Γραμματεία Πολιτικής Προστασίας.","Τα τμήματα των τριτοβάθμιων εκπαιδευτικών ιδρυμάτων με αντικείμενο τις ασύρματες επικοινωνίες.","Οποιοσδήποτε από τους παραπάνω."],"r":3},{"n":733,"c":"Γ","q":"Ποιος από τους παρακάτω δεν έχει δικαίωμα να λειτουργεί σταθμό ραδιοερασιτέχνη;","a":["Αυτός που του έχει αφαιρεθεί οριστικά η άδεια.","Πρόσωπα άνω των 65 ετών.","Τα μη κερδοσκοπικά σωματεία και σύλλογοι ραδιοερασιτεχνών.","Η Γενική Γραμματεία Πολιτικής Προστασίας."],"r":0},{"n":734,"c":"Γ","q":"Ποιος δημόσιος φορέας είναι αρμόδιος για την προφύλαξη του κοινού από ηλεκτρομαγνητικά πεδία;","a":["Η Εθνική Επιτροπή Επικοινωνιών και Ταχυδρομείων (ΕΕΤΤ).","Η Αρμόδια Περιφερειακή Υπηρεσία (ΑΠΥ).","Η Εθνική Επιτροπή Ατομικής Ενέργειας (ΕΕΑΕ).","Το Υπουργείο Υποδομών Μεταφορών και Δικτύων (ΥΥΜΔ)."],"r":2},{"n":736,"c":"Γ","q":"Ποιος έχει δικαίωμα να λειτουργεί ραδιοερασιτεχνικό σταθμό;","a":["Όποιος έχει νόμιμη άδεια άσκησης επαγγέλματος ραδιοηλεκτρολόγου.","Οι επαγγελματίες ραδιοτηλεγραφητές.","Όποιος έχει λάβει άδεια από τον ιδιοκτήτη του σταθμού.","Ο κάτοχος σχετικής άδειας ραδιοερασιτέχνη."],"r":3},{"n":738,"c":"Γ","q":"Πόσων χρονών πρέπει να είναι κανείς τουλάχιστον για να πάρει άδεια λειτουργίας ραδιερασιτεχνικού σταθμού;","a":["12 ετών.","Ενήλικος και για τις δύο.","21 για τη κατηγορία 1 και 18 για τη κατηγορία εισαγωγικού επιπέδου.","Οτιδήποτε από τα παραπάνω."],"r":0},{"n":739,"c":"Γ","q":"Πού υποβάλλεται η αίτηση για τη συμμετοχή στις εξετάσεις για την απόκτηση πτυχίου;","a":["Στις Διευθύνσεις Μεταφορών και Επικοινωνιών της Περιφέρειας που υπάγεται ο τόπος της μόνιμης κατοικίας του υποψηφίου.","Στην Κεντρική Υπηρεσία του Υπουργείου Υποδομών, Μεταφορών και Δικτύων.","Στην Υπηρεσία αλλοδαπών.","Στο Δήμο η κοινότητα του υποψηφίου."],"r":0},{"n":740,"c":"Γ","q":"Προβλέπεται ανανέωση των ραδιοερασιτεχνικών αδειών ;","a":["Όχι. Οι άδειες εκδίδονται μόνο για μια δεκαετία και δεν ανανεώνονται περαιτέρω.","Όχι. Οι άδειες δεν έχουν ημερομηνία λήξης και συνεπώς δεν χρειάζεται να ανανεώνονται.","Ναι, οι άδειες ανανεώνονται αρκεί ο ραδιοερασιτέχνης να έχει πραγματοποιήσει μεγάλο αριθμό επαφών (τουλάχιστον 100) και να έχουν καταγραφεί αυτές οι επαφές στο ημερολόγιο του σταθμού.","Με αίτηση του ενδιαφερομένου, η άδεια ανανεώνεται κάθε φορά για νέα περίοδο δέκα ετών."],"r":3},{"n":741,"c":"Γ","q":"Σε περίπτωση ανάγκης οι σταθμοί ραδιοερασιτεχνών χρησιμοποιούνται για παροχή ραδιοεπικοινωνιακής συνδρομής από:","a":["Την Αστυνομία.","Το Εθνικό Κέντρο Άμεσης Βοήθειας.","Την Πυροσβεστική -Λιμενικό.","Όποιες από τις αρμόδιες κρατικές υπηρεσίες αυτό ζητηθεί."],"r":3},{"n":742,"c":"Γ","q":"Σε ποιές από τις παρακάτω περιπτώσεις εκτάκτων αναγκών μπορούν να χρησιμοποιηθούν ραδιοερασιτεχνικοί σταθμοί για να παράσχουν επικοινωνιακή βοήθεια;","a":["Σε θεομηνίες (σεισμοί, πλημμύρες κλπ).","Εκτάκτως, σε περιπτώσεις που έτερος σταθμός δεν μπορεί να λάβει επαρκώς τα σήματα άλλων σταθμών κατά την διάρκεια διεθνών διαγωνισμών.","Σε μεγάλα εορταστικά γεγονότα.","Σε περίπτωση βλάβης του οχήματος του ραδιοερασιτέχνη προκειμένου να ειδοποιήσει την οδική βοήθεια."],"r":0},{"n":743,"c":"Γ","q":"Η Ελληνική άδεια \"Κατηγορίας 1\" είναι ισοδύναμη-αντίστοιχη:","a":["Με την άδεια CEPT της Σύστασης T/R 61-01.","Με την άδεια \"NOVICE\".","Με την άδεια \"ENTRY LEVEL\" που προβλέπεται στο ECC-REPORT-89."],"r":0},{"n":744,"c":"Γ","q":"Με την Ελληνική άδεια \"Κατηγορίας 1\", δικαιούται ο ραδιοερασιτέχνης να λειτουργήσει τον ραδιοερασιτεχνικό του σταθμό σε οποιαδήποτε άλλη χώρα που έχει αποδεχτεί την Σύσταση T/R 61-01 της CEPT;","a":["Ναι, αλλά για χρονικό διάστημα μέχρι 12 μήνες χωρίς να έχει καμία επιπλέον υποχρέωση. Μετά το πέρας των 12 μηνών πρέπει να εκδοθεί ειδική άδεια.","Ναι, αλλά για περιορισμένο χρονικό διάστημα και εφόσον τηρεί τυχόν ιδιαίτερους κανόνες που υπάρχουν στην υπόψη χώρα.","Ναι, για όσο χρονικό διάστημα επιθυμεί ο ραδιοερασιτέχνης, χωρίς να έχει καμία επιπλέον υποχρέωση.","Όχι, παρά μόνο κατόπιν ειδικής γραπτής βεβαίωσης από τις αρμόδιες Αρχές της υπόψη χώρας."],"r":1},{"n":745,"c":"Γ","q":"Οι \"χώρες CEPT\" είναι χώρες της Ευρώπης και της Αφρικής:","a":["Σωστό.","Λάθος."],"r":1},{"n":747,"c":"Γ","q":"Τα ραδιοερασιτεχνικά πτυχία κατηγορίας \"NOVICE\" χώρας CEPT, θεωρούνται ισοδύναμα με τα ελληνικά πτυχία \"Εισαγωγικού Επιπέδου\" (Entry Level):","a":["Σωστό.","Λάθος."],"r":1},{"n":748,"c":"Γ","q":"Επιτρέπεται δύο φίλοι ραδιοερασιτέχνες να επικοινωνούν στην συχνότητα 147 ΜΗz;","a":["Απαγορεύεται.","Επιτρέπεται.","Επιτρέπεται μόνο για σύντομο χρονικό διάστημα."],"r":0},{"n":749,"c":"Γ","q":"Επιτρέπεται δύο φίλοι ραδιοερασιτέχνες να επικοινωνούν στην συχνότητα 429 ΜΗz;","a":["Δεν υπάρχει κανένα πρόβλημα.","Επιτρέπεται σε καταστάσεις έκτακτης ανάγκης.","Απαγορεύεται."],"r":2},{"n":750,"c":"Γ","q":"Επιτρέπεται ένας ραδιοερασιτέχνης με άδεια \"Εισαγωγικού Επιπέδου\" να εκπέμπει στην υποζώνη συχνοτήτων 7,0 - 7,1 MHz;","a":["Ναι, αλλά μέχρι 1 Watt.","Ναι, αλλά με μέγιστη επιτρεπόμενη ισχύ κορυφής (PEP) εξόδου πομπού 10 Watt","Όχι απαγορεύεται."],"r":2},{"n":751,"c":"Γ","q":"Επιτρέπεται οι ραδιοερασιτέχνες να επικοινωνούν στην συχνότητα 792 ΜΗz;","a":["Απαγορεύεται.","Επιτρέπεται."],"r":0},{"n":753,"c":"Γ","q":"Ο ραδιοερασιτέχνης υποχρεούται να έχει διαρκώς αναρτημένη κοντά στη βάση της κεραίας του, ευανάγνωστη ανεξίτηλη πινακίδα, στην οποία θα αναγράφονται τα στοιχεία του και το διακριτικό κλήσης του:","a":["Όχι, δεν έχει τέτοια υποχρέωση.","Ναι, υποχρεούται.","Υποχρεούται μόνο αν η κεραία είναι εγκατεστημένη σε κοινόχρηστο χώρο πολυκατοικίας.","Υποχρεούται μόνο αν η κεραία είναι εγκατεστημένη σε περιοχή εκτός αστικών περιοχών."],"r":1},{"n":754,"c":"Γ","q":"Οι χώρες CEPT είναι χώρες της Διεθνούς Ένωσης Τηλεπικοινωνιών Περιοχή 1 (ITU Region 1):","a":["Σωστό.","Λάθος."],"r":0},{"n":755,"c":"Γ","q":"Σε περιπτώσεις παύσης της νόμιμης λειτουργίας του ραδιοερασιτεχνικού σταθμού για οποιονδήποτε λόγο (ανάκληση, παύση ισχύος της άδειας κλπ), τι υποχρεώσεις έχει ο κάτοχος του σταθμού σε σχέση με τις κεραίες του;","a":["Καμία υποχρέωση.","Οφείλει να \"κατεβάσει\" μόνο τις κατευθυντικές κεραίες του.","Οφείλει να κατεδαφίζει τις κεραίες του σταθμού του και να τις απομακρύνει από τον χώρο εγκατάστασής τους, εφόσον του ζητηθεί από τους περίοικους.","Οφείλει αμελλητί να κατεδαφίζει τις κατασκευές κεραίας του σταθμού και να τις απομακρύνει από τον χώρο εγκατάστασής τους, αποκαθιστώντας τυχόν ζημίες ή φθορές."],"r":3},{"n":756,"c":"Γ","q":"Σε ποια γεωγραφική περιοχή της IΑRU ανήκει η Ελλάδα:","a":["Στην περιοχή 1.","Στην περιοχή 2.","Στην περιοχή 3.","Σε όλες τις περιοχές γιατί είναι χώρα της ΕΕ."],"r":0},{"n":758,"c":"Γ","q":"Τι ονομάζουμε \"σταθμό ραδιοερασιτέχνη\";","a":["Ένας ή περισσότεροι πομποί ή δέκτες συμπεριλαμβανομένων κεραιών και παρελκομένων, σε ορισμένη θέση, που είναι αναγκαίοι για τη διεξαγωγή της υπηρεσίας ραδιοερασιτέχνη.","Η Υπηρεσία ραδιοεπικοινωνίας που έχει ως σκοπό την αυτοδιδασκαλία, την αλληλοεπικοινωνία, την έρευνα και την τηλεπικοινωνιακή υποστήριξη επιχειρήσεων βοήθειας σε περιπτώσεις εκτάκτων αναγκών.","Τη μετάδοση, εκπομπή ή λήψη σημάτων γραπτού κειμένου, εικόνων και ήχων κάθε είδους, που πραγματοποιείται με ασύρματα ραδιοηλεκτρικά συστήματα.","Ο σταθμός που εκπέμπει στα FM τραγούδια και λοιπά ψυχαγωγικά προγράμματα."],"r":0},{"n":760,"c":"Γ","q":"Τι ονομάζουμε \"υπηρεσία ραδιοερασιτέχνη\";","a":["Ο σταθμός που εκπέμπει στα FM τραγούδια και λοιπά ψυχαγωγικά προγράμματα.","Η Υπηρεσία ραδιοεπικοινωνίας που έχει ως σκοπό την αυτοδιδασκαλία, την αλληλοεπικοινωνία, την έρευνα και την τηλεπικοινωνιακή υποστήριξη επιχειρήσεων βοήθειας σε περιπτώσεις εκτάκτων αναγκών.","Τη μετάδοση, εκπομπή ή λήψη σημάτων γραπτού κειμένου, εικόνων και ήχων κάθε είδους, που πραγματοποιείται με ασύρματα ραδιοηλεκτρικά συστήματα.","Ένας ή περισσότεροι πομποί ή δέκτες συμπεριλαμβανομένων κεραιών και παρελκομένων, σε ορισμένη θέση, που είναι αναγκαίοι για τη διεξαγωγή της υπηρεσίας ραδιοερασιτέχνη."],"r":1},{"n":761,"c":"Δ","q":"Η χρησιμοποίηση επαναληπτών για επαφή μεταξύ δυο σταθερών σταθμών πρέπει να γίνεται:","a":["Πάντοτε για να έχουμε καλύτερα αποτελέσματα και να μας ακούνε περισσότεροι σταθμοί.","Σε εξαιρετικές περιπτώσεις όταν δεν είναι εφικτή η απευθείας (Simplex) επικοινωνία.","Μόνο όταν οι δύο σταθμοί είναι πολύ κοντά μεταξύ τους για την αποφυγή ενδοδιαμορφώσεων."],"r":1},{"n":762,"c":"Δ","q":"Για την καλύτερη προστασία από ηλεκτροπληξία, τι πρέπει να είναι γειωμένο στον σταθμό σου;","a":["Μόνο η κάθοδος.","Η γραμμή του ηλεκτρικού δικτύου (των 220 Volts).","Μόνο το τροφοδοτικό.","Όλες τις συσκευές που απαρτίζουν τον σταθμό."],"r":3},{"n":763,"c":"Δ","q":"Γιατί πρέπει να \"γειώνεις\" όλες τις κεραίες όταν δεν λειτουργείς τον σταθμό σου;","a":["Για να προστατεύεις τον σταθμό και το κτίριο από κεραυνούς.","Για να \"κλειδώσεις\" την κεραία προς μια κατεύθυνση.","Για να μην προκαλείς παρεμβολές."],"r":0},{"n":764,"c":"Δ","q":"Εάν η γέφυρα στασίμων κυμάτων του σταθμού δείχνει 1:1, αυτό σημαίνει ότι έχει επιτευχθεί η \"καλύτερη\" προσαρμογή της σύνθετης αντίστασης:","a":["Σωστό.","Λάθος."],"r":0},{"n":765,"c":"Δ","q":"Εάν ο κινητός πομποδέκτης λειτουργεί στο αυτοκίνητο αλλά δε λειτουργεί καθόλου στο σπίτι, τι ελέγχουμε κατ' αρχήν;","a":["Το μεγάφωνο.","Το μικρόφωνο.","Την γέφυρα στασίμων κυμάτων.","Το τροφοδοτικό."],"r":3},{"n":766,"c":"Δ","q":"Εάν ο πομποδέκτης \"λαμβάνει\" κανονικά ενώ κατά την εκπομπή \"σβήνει\", τι από τα παρακάτω μπορεί να συμβαίνει;","a":["Υπάρχει πρόβλημα στην τροφοδοσία.","Έχει αποσυνδεθεί το antenna tuner.","Δεν λειτουργεί το μικρόφωνο."],"r":0},{"n":767,"c":"Δ","q":"Ενας σταθμός δεν μπορεί να λειτουργήσει στα βραχέα κύματα (HF) χωρίς να διαθέτει \"Antenna tuner\":","a":["Σωστό.","Λάθος."],"r":1},{"n":768,"c":"Δ","q":"Ένας σύνδεσμος (connector) τύπου \"BNC\", με ποιο τρόπο συνδέεται με την αντίστοιχη υποδοχή, σε ένα πομποδέκτη;","a":["Απλά πιέζοντας τον σύνδεσμο \"προς τα μέσα\" στην υποδοχή.","Με βυσμάτωση \"προς τα μέσα\" και στη συνέχεια με πολλαπλό δεξιόστροφο βίδωμα.","Με βυσμάτωση προς τα μέσα και στη συνέχεια με δεξιά περιστροφή για να \"κουμπώσει\".","\"Συρταρωτά\" από τα αριστερά προς τα δεξιά."],"r":2},{"n":769,"c":"Δ","q":"Ένας σύνδεσμος (connector) τύπου \"Ν\" συνδέεται με την αντίστοιχη υποδοχή σε ένα πομποδέκτη;","a":["Απλά πιέζοντας τον σύνδεσμο \"προς τα μέσα\" στην υποδοχή.","Με βυσμάτωση \"προς τα μέσα\" και στη συνέχεια με πολλαπλό δεξιόστροφο βίδωμα.","Με βυσμάτωση \"προς τα μέσα\" και στη συνέχεια μισή δεξιά περιστροφή για να \"κουμπώσει\".","\"Συρταρωτά\" από αριστερά προς τα δεξιά."],"r":1},{"n":770,"c":"Δ","q":"Η \"πρίζα\" \"CAT\" σε ένα πομποδέκτη έχει σκοπό:","a":["Την σύνδεση ακουστικών στον πομποδέκτη.","Τον έλεγχο του πομποδέκτη από τον υπολογιστή μέσω ενός σειριακού καλωδίου.","Την σύνδεση του πομποδέκτη με το τροφοδοτικό.","Την σύνδεση της κεραίας."],"r":1},{"n":771,"c":"Δ","q":"Η ισχύς εξόδου του πομπού πρέπει να ρυθμίζεται:","a":["Πάντα στο μέγιστο δυνατόν για καλύτερη εκπομπή.","Πάντα στην ελάχιστη απαραίτητη για την διεξαγωγή της συγκεκριμένης επικοινωνίας.","Στο μέσο του αντιστοίχου διακόπτη επιλογής ισχύος."],"r":1},{"n":772,"c":"Δ","q":"Η συσκευή που έχει την οθόνη του σχήματος, μπορεί να είναι:","a":["Οικιακή συσκευή τηλεφώνου.","Πομποδέκτης.","Τροφοδοτικό.","Antenna tuner."],"r":1},{"n":773,"c":"Δ","q":"Κατά την \"dublex\" λειτουργία του σταθμού εκπέμπουμε και λαμβάνουμε στην ίδια συχνότητα;","a":["Σωστό.","Λάθος."],"r":1},{"n":774,"c":"Δ","q":"Κατά την διάρκεια της εκπομπής στις συχνότητες των VHF δεν χρειάζεται να ανακοινώνεται το διακριτικό κλίσης του σταθμού γιατί οι αποστάσεις που καλύπτονται στα VHF είναι μικρές.","a":["Σωστό.","Λάθος."],"r":1},{"n":775,"c":"Δ","q":"Με βάση την οθόνη του σχήματος, ο πομποδέκτης λειτουργεί με διαμόρφωση:","a":["Πάνω πλευρικής ζώνης.","Κάτω πλευρικής ζώνης.","FM."],"r":0},{"n":776,"c":"Δ","q":"Με ένα \"Antenna Tuner\" μπορούμε να λειτουργήσουμε το σταθμό μας σε μια συχνότητα χρησιμοποιώντας κεραία που έχει σχεδιαστεί για διαφορετική συχνότητα αλλά σε \"κοντινή\" ζώνη συχνοτήτων:","a":["Σωστό.","Λάθος."],"r":0},{"n":777,"c":"Δ","q":"Με ποιο όργανο μετράμε την τάση στην έξοδο του τροφοδοτικού μας;","a":["Με την γέφυρα στασίμων κυμάτων.","Με ένα αμπερόμετρο.","Με ένα βολτόμετρο.","Με το \"Antenna tuner\"."],"r":2},{"n":778,"c":"Δ","q":"Ο επιλογέας \"RIT\" σε ένα δέκτη:","a":["Ρυθμίζει σταδιακά (μικρομετρικά) την συχνότητα (receiver incremental tuning).","Επιλέγει τον διεθνή τόνο εκπομπής (receiver international tone).","Καθαρίζει τα παράσιτα.","Αυξάνει την ισχύ."],"r":0},{"n":779,"c":"Δ","q":"Οι Ραδιοερασιτεχνικοί Επαναλήπτες χρησιμοποιούνται:","a":["Αποκλειστικά από τα μέλη του συλλόγου που τους έχει εγκαταστήσει.","Από όλους τους αδειούχους ραδιοερασιτέχνες.","Από όσους ασχολούνται με διάφορα \"Χόμπι\" όπως κυνηγοί κ.λ.π.","Αποκλειστικά από την \"Πολιτική Προστασία\"."],"r":1},{"n":780,"c":"Δ","q":"Παρατηρώντας το όργανο του σχήματος, κατά την ακρόαση έτερου σταθμού τι συμπεραίνουμε;","a":["Ο έτερος σταθμός εκπέμπει με 80 watts.","Ο δικός μας σταθμός εκπέμπει με 80 watts.","Τα σήματα του έτερου σταθμού είναι πολύ ισχυρά της τάξεως 9 plus 50."],"r":2},{"n":781,"c":"Δ","q":"Ποια είναι η χρησιμότητα του διπλού \"VFO\" σ’ έναν πομποδέκτη;","a":["Για να μπορούμε να εκπέμπουμε σε δύο συχνότητες ταυτόχρονα.","Για να μπορούμε να παρακολουθούμε εύκολα τις συχνότητες εκπομπής και λήψης όταν δεν είναι ίδιες.","Για να κάνουμε εκπομπή full duplex, δηλαδή εκπομπή και λήψη μαζί."],"r":1},{"n":782,"c":"Δ","q":"Ποια η χρησιμότητα ενός επεξεργαστή ψηφιακού σήματος (Digital Signal Processor) σ’ έναν ερασιτεχνικό σταθμό;","a":["Απορρίπτει το θόρυβο από τα λαμβανόμενα σήματα.","Αυξάνει το κέρδος της κεραίας.","Αυξάνει το εύρος ζώνης της κεραίας.","Καθιστά επαρκή γείωση."],"r":0},{"n":783,"c":"Δ","q":"Ποια περιοχή συχνοτήτων καταλαμβάνεται από ένα σήμα 3 kHz LSB όταν η εμφανιζόμενη συχνότητα φέροντος είναι ρυθμισμένη στα 7,178 MHz;","a":["7,178 με 7,181 MHz","7,175 με 7,178 MHz","7,1765 με 7,1795 MHz","7,178 με 7,184 MHz"],"r":1},{"n":784,"c":"Δ","q":"Ποια περιοχή συχνοτήτων καταλαμβάνεται από ένα σήμα 3 kHz USB όταν η συχνότητα φέροντος είναι ρυθμισμένη στα 14,347 MHz;","a":["14,347 με 14,350 MHz","14,3455 με 14,3485 MHz","14,344 με 14,347 MHz","14,347 με 14,647 MHz"],"r":0},{"n":785,"c":"Δ","q":"Ποια συσκευή μπορεί να χρησιμοποιηθεί για να γίνει το \"ταίριασμα\" της εξόδου του πομπού σε κεραία με σύνθεση αντίσταση (impedance) διαφορετική από 50 ohm;","a":["Ένα εικονικό φορτίο (Dummy load).","Ένας ισορροπημένος διαμορφωτής (Balanced modulator).","Μια γέφυρα στασίμων κυμάτων (SWR).","Ένα \"Antenna coupler\"."],"r":3},{"n":786,"c":"Δ","q":"Ποιο από τα παρακάτω αποτελεί καλή ραδιοερασιτεχνική πρακτική όταν επιλέγουμε μια συχνότητα για να ξεκινήσουμε μια κλήση \"CQ\";","a":["Επιλέγουμε την συχνότητα με βάση τα δικαιώματα της αδείας μας.","Επιλέγουμε την συχνότητα με βάση το band plan της IARU και ανάλογα με το \"mode\" που θέλουμε να χρησιμοποιήσουμε.","Ελέγχουμε να δούμε αν το κανάλι χρησιμοποιείται από άλλον σταθμό.","Όλα τα παραπάνω."],"r":3},{"n":787,"c":"Δ","q":"Ποιο από τα παρακάτω αποτελεί πλεονέκτημα όταν χρησιμοποιούμε διαμόρφωση μονής πλευρικής ζώνης (single sideband) σε σύγκριση με άλλες αναλογικές διαμορφώσεις (modes) φωνής στις ραδιοερασιτεχνικές μπάντες των HF;","a":["Γίνεται καλύτερος συντονισμός στη λήψη και καλύτερη προστασία από θόρυβο.","Το σήμα υπόκειται σε λιγότερα \"ατμοσφαιρικά\" (static crashes, atmospherics).","Πολύ υψηλή πιστότητα στη διαμόρφωση φωνής.","Χρησιμοποιείται λιγότερο εύρος ζώνης και υπάρχει μεγαλύτερη απόδοση ισχύος."],"r":3},{"n":788,"c":"Δ","q":"Ποιο από τα παρακάτω είναι σωστό για τη λειτουργία SSB VOX;","a":["Το \"VOX\" επιτρέπει να μιλάμε χωρίς να χρησιμοποιούμε τα χέρια μας (\"hands free\" operation).","Το σήμα λήψης ακούγεται πιο φυσικό.","Διατηρείται το φάσμα συχνοτήτων.","Δίνει μεγαλύτερη ισχύ στην έξοδο."],"r":0},{"n":789,"c":"Δ","q":"Ποιος από τους παρακάτω τύπους διαμόρφωσης (modes) χρησιμοποιείται συνήθως για επικοινωνίες φωνής στις μπάντες των 20, 15 και 10 μέτρων;","a":["Πάνω πλευρική Ζώνη (Upper sideband).","Κάτω πλευρική Ζώνη (Lower sideband).","Υποτυπώδης πλευρική Ζώνη (Vestigial sideband).","Διπλή πλευρική Ζώνη (Double sideband)."],"r":0},{"n":790,"c":"Δ","q":"Ποιος από τους παρακάτω τύπους διαμόρφωσης (modes) χρησιμοποιείται συνήθως για επικοινωνίες φωνής στις μπάντες των 80 και 40 μέτρων;","a":["Πάνω πλευρική Ζώνη (Upper sideband).","Κάτω πλευρική Ζώνη (Lower sideband).","Διπλή πλευρική Ζώνη (Double sideband).","Tριπλή πλευρική Ζώνη."],"r":1},{"n":791,"c":"Δ","q":"Ποιος από τους παρακάτω είναι ο ενδεικνυόμενος τρόπος για να συμμετάσχουμε σε μια συζήτηση σε επικοινωνία φωνής;","a":["Λέμε \"QRZ\" αρκετές φορές και μετά αναφέρουμε το χαρακτηριστικό μας (callsign).","Λέμε \"Διακοπή\" πολλές φορές ( \"Break Break Break\") και αναμένουμε απάντηση.","Λέμε το χαρακτηριστικό μας (callsign) σ’ ένα διάλειμμα ανάμεσα στις ομιλίες των άλλων σταθμών που συμμετέχουν στη συζήτηση.","Λέμε \"CQ\" και μετά τα χαρακτηριστικά (callsign) των άλλων σταθμών που συμμετέχουν στη συζήτηση."],"r":2},{"n":792,"c":"Δ","q":"Ποιος από τους παρακάτω είναι ο σωστός τρόπος να καλείς \"CQ\" σε κλήσεις φωνής;","a":["Λες \"CQ\" τρεις φορές, ακολουθούμενο από την λέξη \"από\" (this is), ακολουθούμενη από το διακριτικό σου τρεις φορές.","Λες \"CQ\" μια φορά, ακολουθούμενο από την λέξη \"από\" (this is), ακολουθούμενη από το διακριτικό σου δέκα φορές.","Λες \"CQ\" τουλάχιστον πέντε φορές, από την λέξη \"από\" (this is), ακολουθούμενη από το διακριτικό σου.","Λες την λέξη \"από\" (this is), τρεις φορές ακολουθούμενη από το διακριτικό σου τρεις φορές και μετά το \"CQ\""],"r":0},{"n":793,"c":"Δ","q":"Ποιος είναι ο ενδεδειγμένος τρόπος για να γίνει κατανοητό το διακριτικό σου σε μια φωνητική επαφή, υπό δυσμενείς συνθήκες ακρόασης του άλλου σταθμού;","a":["Χρησιμοποιείς οποιεσδήποτε λέξεις που ξεκινάνε με τα ίδια γράμματα που αντιστοιχούν στα γράμματα του διακριτικού σου.","Μιλάς πιο \"σιγανά\" (χαμηλότερη ένταση φωνής).","Χρησιμοποιείς το διεθνές φωνητικό αλφάβητο για κάθε γράμμα του διακριτικού σου."],"r":2},{"n":794,"c":"Δ","q":"Ποιος είναι ο ενδεδειγμένος τρόπος πραγματοποίησης μιας επαφής σε ένα επαναλήπτη;","a":["Λες το όνομα του άλλου ερασιτέχνη και μετά το διακριτικό σου τρεις φορές.","Λες το διακριτικό του σταθμού που θες να επικοινωνήσεις και μετά το δικό σου διακριτικό.","Λες \"διακοπή διακοπή διακοπή\".","Λες το διακριτικό του σταθμού που θες να επικοινωνήσεις τρεις φορές."],"r":1},{"n":795,"c":"Δ","q":"Ποιος είναι ο λόγος που χρησιμοποιούμε τη \"λειτουργία attenuator\" που υπάρχει σε πολλούς πομποδέκτες βραχέων (HF);","a":["Για να μειωθεί η κατανάλωση ισχύος όταν λειτουργούμε με μπαταρίες.","Για να μειωθεί η υπερφόρτωση του σήματος (signal overload) λόγω ισχυρών σημάτων λήψης."],"r":1},{"n":796,"c":"Δ","q":"Ποιος είναι ο σκοπός του φίλτρου notch που υπάρχει σε πολλούς πομποδέκτες βραχέων (HF);","a":["Να περιορίσει το εύρος ζώνης φωνής του πομποδέκτη.","Να ενισχύσει τη λήψη μιας συγκεκριμένης συχνότητας σε μια φορτωμένη μπάντα.","Να μειώσει τα παράσιτα από φέροντα κύματα στη ζώνη διέλευσης του δέκτη."],"r":2},{"n":797,"c":"Δ","q":"Ποιος τύπος διαμόρφωσης (mode) χρησιμοποιείται συνήθως για επικοινωνίες φωνής στις μπάντες υψηλών συχνοτήτων (HF) των ραδιοερασιτεχνών;","a":["Διαμόρφωση συχνότητας (Frequency modulation).","Διπλής πλευρικής ζώνης (Double sideband).","Μονής πλευρικής ζώνης (Single sideband).","Διαμόρφωση φάσης (Phase modulation)."],"r":2},{"n":798,"c":"Δ","q":"Πόση είναι συνήθως η τάση της μπαταρίας των επιβατικών αυτοκινήτων (προκειμένου να εγκαταστήσουμε \"κινητό\" σταθμό);","a":["220 volts","9 volts","12 volts","110 Watts"],"r":2},{"n":799,"c":"Δ","q":"Πόσο πολύ πρέπει να αυξηθεί η ισχύς εξόδου ενός πομπού για να αλλάξει η ένδειξη του οργάνου \"S-meter\" σε έναν απομακρισμένο δέκτη από S8 σε S9;","a":["Περίπου 2 φορές.","Περίπου 8 φορές.","Περίπου 4 φορές.","Περίπου 1,5 φορά."],"r":2},{"n":800,"c":"Δ","q":"Πού συναντάμε συνήθως ένα όργανο \"s-meter\";","a":["Σε μια γέφυρα στασίμων κυμάτων SWR.","Σ’ έναν πομπό.","Σ’ έναν δέκτη.","Σε μια γέφυρα αγωγιμότητας."],"r":2},{"n":801,"c":"Δ","q":"Πού συνδέεται ένα \"balun\" για να προσαρμοστεί μια κεραία διπόλου σε ένα ομοαξονικό καλώδιο 50 ohm;","a":["Μεταξύ της κεραίας και της γείωσης.","Μεταξύ του πομποδέκτη και του καλωδίου καθόδου.","Μεταξύ του καλωδίου καθόδου και της γείωσης.","Μεταξύ της κεραίας και του καλωδίου καθόδου."],"r":3},{"n":802,"c":"Δ","q":"Πριν κάνεις κλήση \"CQ\" σε μία συχνότητα που δεν ακούς τίποτα, γιατί επιπροσθέτως πρέπει να ρωτήσεις αν η συχνότητα είναι σε χρήση (is this frequency in use?);","a":["Μόνο για λόγους ευγένειας.","Διότι ένας σταθμός, μέρος ενός QSO, ο οποίος βρίσκεται στη ζώνη σιγής ως προς την δική σου περιοχή, μπορεί να εκπέμπει στην συχνότητα και να μην τον ακούς.","Γιατί μπορεί η συχνότητα να είναι \"κλειδωμένη\".","Απλά είναι ένας εναλλακτικός τρόπος κλήσης."],"r":1},{"n":803,"c":"Δ","q":"Πώς \"συνδέεται\" συνήθως ο πομποδέκτης με το τροφοδοτικό του;","a":["Με έναν ειδικό \"κοτσαδόρο\".","Με ένα εύκαμπτο, διπολικό καλώδιο χρώματος κόκκινου για το (+) και μαύρου για το (-).","Με ένα ομοαξονικό καλώδιο 50 Ohm χρώματος μαύρου.","Με μία πρίζα \"σούκο\"."],"r":1},{"n":804,"c":"Δ","q":"Πώς καλείτε έναν άλλο σταθμό μέσω επαναλήπτη εάν ξέρετε το διακριτικό κλήσης του;","a":["Αρχικά λέτε \"Message to\" ή \" Μήνυμα στον\" κι έπειτα εκφωνείτε το διακριτικό κλήσης του σταθμού.","Αρχικά εκφωνείτε το διακριτικό κλήσης του σταθμού, τη συντομογραφία \"DE\" και κατόπιν αναφέρετε το διακριτικό του σταθμού σας.","Λέτε \"CQ\" τρεις φορές και κατόπιν εκφωνείτε το διακριτικό κλήσης του σταθμού.","Περιμένετε να σας καλέσει αυτός."],"r":1},{"n":805,"c":"Δ","q":"Σε κάποιον πομποδέκτη, αυξάνοντας την ένταση ήχου του μεγαφώνου (volume), πως επηρεάζεται η ισχύς του εκπεμπόμενου ηλεκτρομαγνητικού κύματος;","a":["Μειώνεται ανάλογα.","Αυξάνεται ανάλογα.","Δεν επηρεάζεται.","Εξαρτάται από τη χρησιμοποιούμενη διαμόρφωση."],"r":2},{"n":806,"c":"Δ","q":"Στη διπλανή εικόνα απεικονίζεται:","a":["Ένα βολτόμετρο","Ένα μικρόφωνο","Ακουστικά","Ρυθμιστής συχνότητας"],"r":2},{"n":807,"c":"Δ","q":"Στη διπλανή εικόνα, ο επιλογέας \"METER\" χρησιμοποιείται:","a":["Για την αυξομείωση του \"ALC\".","Για την αύξηση της έντασης φωνής.","Για το άνοιγμα - κλείσιμο του πομποδέκτη.","Για την επιλογή λ const CHAPTER_RANGES = {"\u0391": [1, 551], "\u0392": [566, 693], "\u0393": [694, 760], "\u0394": [761, 840]};
const CHAPTERS = {
  'Α': { name: 'Τεχνικά Θέματα', desc: 'Ηλεκτρισμός, κεραίες, ραδιοκύματα' },
  'Β': { name: 'Λειτουργικοί Κανόνες', desc: 'Διαδικασίες επικοινωνίας' },
  'Γ': { name: 'Νομικό Πλαίσιο', desc: 'Εθνική & διεθνής νομοθεσία' },
  'Δ': { name: 'Πρακτικά Θέματα', desc: 'Εξοπλισμός, χειρισμός' },
};

// Exam mode quotas (per official rules: 20/20/20/40)
const EXAM_QUOTAS = { 'Α': 20, 'Β': 20, 'Γ': 20, 'Δ': 40 };
const EXAM_TOTAL = 100;
const EXAM_PASS = 80;
const EXAM_MINUTES = 60;

// ---------- STATE ----------
let state = {
  view: 'home',  // home | session | results
  mode: null,    // 'exam' | 'practice'
  chapters: new Set(['Α', 'Β', 'Γ', 'Δ']),
  session: null,
};

// ---------- HELPERS ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildExamSet() {
  // Draw 20/20/20/40 from chapters Α/Β/Γ/Δ
  const out = [];
  for (const [ch, n] of Object.entries(EXAM_QUOTAS)) {
    const pool = QUESTIONS.filter(q => q.c === ch);
    const picked = shuffle(pool).slice(0, n);
    out.push(...picked);
  }
  return shuffle(out);
}

function buildPracticeSet() {
  const pool = QUESTIONS.filter(q => state.chapters.has(q.c));
  return shuffle(pool);
}

function prepareQuestion(q) {
  // Preserve answer order (some answers reference others, e.g., "all of the above", "1 and 2")
  const indexed = q.a.map((text, i) => ({ text, originalIdx: i }));
  return {
    n: q.n,
    c: q.c,
    q: q.q,
    answers: indexed,
    correctShuffledIdx: q.r,  // same as original since no shuffling
  };
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ---------- RENDERING ----------
const app = document.getElementById('app');

function render() {
  app.innerHTML = '';
  if (state.view === 'home') renderHome();
  else if (state.view === 'session') renderSession();
  else if (state.view === 'results') renderResults();
  else if (state.view === 'browse') renderBrowse();
  else if (state.view === 'docs') renderDocs();
}

    <div class="modes">

      <button class="mode-card" id="mode-practice">
        <div class="tag">Λειτουργία 02 · Εξάσκηση</div>

      <button class="mode-card" id="mode-browse">

        <p>Πρόσβαση σε όλες τις ερωτήσεις με τις σωστές απαντήσεις. Φίλτρα και αναζήτηση για μελέτη.</p>
      </button>
      <button class="mode-card" id="mode-docs">
        <div class="tag">Λειτουργία 04 · Έγγραφα</div>
        <h3>Νομοθεσία &amp; οδηγίες</h3>

      </button>
    </div>

    <div class="options-block">

    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; text-align: right;">
      Συνολική βάση: <span style="color:var(--amber)">${total}</span> ερωτήσεις &nbsp;·&nbsp; Επιλεγμένες: <span style="color:var(--amber)">${selectedCount}</span>
    </div>
  `;
  app.appendChild(container);

  const grid = container.querySelector('#chapter-grid');
  for (const [letter, info] of Object.entries(CHAPTERS)) {
    const count = QUESTIONS.filter(q => q.c === letter).length;
    const isActive = state.chapters.has(letter);
    const chip = document.createElement('button');
    chip.className = 'chapter-chip' + (isActive ? ' active' : '');
    const range = CHAPTER_RANGES[letter];
    chip.innerHTML = `
      <span class="check"></span>

      if (state.chapters.has(letter)) {

  container.querySelector('#mode-exam').onclick = () => startExam();
  container.querySelector('#mode-practice').onclick = () => startPractice();
  container.querySelector('#mode-browse').onclick = () => startBrowse();

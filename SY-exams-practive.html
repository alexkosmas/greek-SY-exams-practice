function startExam() {
  const rawSet = buildExamSet();
  state.session = {
    mode: 'exam',
    questions: rawSet.map(prepareQuestion),
    index: 0,
    answers: [],   // {selectedShuffledIdx, correct}
    startedAt: Date.now(),
    secondsRemaining: EXAM_MINUTES * 60,
    timerId: null,
  };
  state.view = 'session';
  // Start timer
  state.session.timerId = setInterval(() => {
    state.session.secondsRemaining -= 1;
    if (state.session.secondsRemaining <= 0) {
      finishSession();
      return;
    }
    updateTimer();
  }, 1000);
  render();
}

function startPractice() {
  const rawSet = buildPracticeSet();
  state.session = {
    mode: 'practice',
    questions: rawSet.map(prepareQuestion),
    index: 0,
    answers: [],
    startedAt: Date.now(),
    currentRevealed: false,
    currentChoice: null,
  };
  state.view = 'session';
  render();
}

function updateTimer() {
  const el = document.querySelector('.timer');
  if (!el || !state.session || state.session.mode !== 'exam') return;
  const s = state.session.secondsRemaining;
  el.textContent = formatTime(s);
  el.classList.toggle('warning', s <= 300 && s > 60);
  el.classList.toggle('danger', s <= 60);
}

function renderSession() {
  const s = state.session;
  const q = s.questions[s.index];
  const isExam = s.mode === 'exam';
  const total = s.questions.length;
  const progress = ((s.index + (s.currentRevealed ? 1 : 0)) / total) * 100;

  const wrap = document.createElement('div');
  wrap.className = 'fade-in';

  // ----- session bar -----
  let timerHTML = '';
  if (isExam) {
    timerHTML = `<div class="stat">Χρόνος <span class="val timer">${formatTime(s.secondsRemaining)}</span></div>`;
  }

  let correctSoFar = s.answers.filter(a => a.correct).length;

  wrap.innerHTML = `
    <div class="session-bar">
      <div class="left">
        <div class="stat">${isExam ? 'Εξέταση' : 'Εξάσκηση'} <span class="val amber">${s.index + 1}/${total}</span></div>
        ${!isExam ? `<div class="stat">Σωστά <span class="val">${correctSoFar}</span></div>` : ''}
      </div>
      <div class="right">
        ${timerHTML}
        <button class="quit-btn" id="quit-btn">Έξοδος</button>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${progress}%"></div>
    </div>

    <div class="q-meta">
      <span class="num">#${String(s.index + 1).padStart(3, '0')}</span>
      <span class="divider">/</span>
      <span>Κεφ. ${q.c} — ${CHAPTERS[q.c].name}</span>
      <span class="divider">·</span>
      <span>Αρ. ερώτησης ${q.n}</span>
    </div>

    <div class="question-text">${escapeHtml(q.q)}</div>
      ${QUESTION_IMAGES[q.n] ? `<div class="q-image-wrap"><img class="q-image" src="${QUESTION_IMAGES[q.n]}" alt="Σχήμα ερώτησης" loading="lazy"></div>` : ''}

    <div class="answers" id="answers"></div>

    <div id="feedback"></div>

    <div class="actions">
      <button class="btn" id="back-btn" ${isExam || s.index === 0 ? 'disabled' : ''}>← Προηγούμενη</button>
      <button class="btn btn-primary" id="next-btn">${nextBtnLabel()}</button>
    </div>
  `;
  app.appendChild(wrap);

  // Render answers
  const answersEl = wrap.querySelector('#answers');
  const previousAnswer = s.answers[s.index];
  const isAnswered = isExam ? !!previousAnswer : s.currentRevealed;

  q.answers.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    const marker = String(i + 1); // 1, 2, 3, 4 — matches PDF order

    let cls = '';
    if (isExam) {
      if (previousAnswer && previousAnswer.selectedShuffledIdx === i) cls = ' selected';
    } else {
      if (s.currentRevealed) {
        if (i === q.correctShuffledIdx) cls = ' correct';
        else if (i === s.currentChoice) cls = ' incorrect';
        else cls = ' dimmed';
      } else if (s.currentChoice === i) {
        cls = ' selected';
      }
    }
    if (isAnswered) cls += ' disabled';
    btn.className = 'answer' + cls;
    btn.innerHTML = `<span class="marker">${marker}</span><span>${escapeHtml(a.text)}</span>`;

    btn.onclick = () => {
      if (isExam) {
        // Single-select toggle, but allow change before "Next"
        s.answers[s.index] = {
          selectedShuffledIdx: i,
          correct: i === q.correctShuffledIdx,
        };
        render();
      } else {
        // Practice: clicking reveals immediately
        if (s.currentRevealed) return;
        s.currentChoice = i;
        s.currentRevealed = true;
        s.answers[s.index] = {
          selectedShuffledIdx: i,
          correct: i === q.correctShuffledIdx,
        };
        render();
      }
    };
    answersEl.appendChild(btn);
  });

  // Practice feedback
  if (!isExam && s.currentRevealed) {
    const feedback = wrap.querySelector('#feedback');
    const isRight = s.currentChoice === q.correctShuffledIdx;
    const fb = document.createElement('div');
    fb.className = 'explanation ' + (isRight ? 'right' : 'wrong');
    if (isRight) {
      fb.innerHTML = `<span class="lbl">Σωστά</span>Η απάντησή σου είναι ορθή.`;
    } else {
      fb.innerHTML = `<span class="lbl">Λάθος</span>Η σωστή απάντηση είναι: <strong>${q.correctShuffledIdx + 1}</strong> — ${escapeHtml(q.answers[q.correctShuffledIdx].text)}`;
    }
    feedback.appendChild(fb);
  }

  // Wire up buttons
  wrap.querySelector('#quit-btn').onclick = () => {
    // No confirmation in practice mode — nothing to lose
    if (s.mode === 'exam') {
      if (!confirm('Είσαι σίγουρος ότι θέλεις να βγεις από την εξέταση; Η πρόοδος θα χαθεί.')) return;
    }
    cleanupSession();
    state.view = 'home';
    state.session = null;
    render();
  };

  wrap.querySelector('#next-btn').onclick = () => advance();

  const backBtn = wrap.querySelector('#back-btn');
  if (backBtn && !backBtn.disabled) {
    backBtn.onclick = () => {
      if (s.index > 0) {
        s.index--;
        render();
      }
    };
  }
}

function nextBtnLabel() {
  const s = state.session;
  const isLast = s.index === s.questions.length - 1;
  if (s.mode === 'exam') {
    return isLast ? 'Υποβολή ▸' : 'Επόμενη →';
  } else {
    // practice
    if (!s.currentRevealed) return 'Παράλειψη →';
    return isLast ? 'Τέλος ▸' : 'Επόμενη →';
  }
}

function advance() {
  const s = state.session;
  const isLast = s.index === s.questions.length - 1;
  if (s.mode === 'exam') {
    if (isLast) {
      // Confirm submission
      const unanswered = s.questions.length - s.answers.filter(Boolean).length;
      if (unanswered > 0 && !confirm(`Έχεις ${unanswered} αναπάντητες ερωτήσεις. Να υποβληθεί η εξέταση;`)) {
        return;
      }
      finishSession();
    } else {
      s.index++;
      render();
    }
  } else {
    // practice mode
    if (isLast) {
      finishSession();
    } else {
      s.index++;
      s.currentRevealed = false;
      s.currentChoice = null;
      render();
    }
  }
}

function cleanupSession() {
  if (state.session && state.session.timerId) {
    clearInterval(state.session.timerId);
  }
}

function finishSession() {
  cleanupSession();
  state.view = 'results';
  render();
}

function renderResults() {
  const s = state.session;
  const isExam = s.mode === 'exam';
  const total = s.questions.length;
  const answered = s.answers.filter(Boolean).length;
  const correct = s.answers.filter(a => a && a.correct).length;
  const incorrect = answered - correct;
  const unanswered = total - answered;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  const elapsedSec = Math.round((Date.now() - s.startedAt) / 1000);

  // Per-chapter breakdown
  const perChapter = {};
  for (const ch of Object.keys(CHAPTERS)) {
    perChapter[ch] = { total: 0, correct: 0 };
  }
  s.questions.forEach((q, i) => {
    perChapter[q.c].total++;
    if (s.answers[i] && s.answers[i].correct) perChapter[q.c].correct++;
  });

  let verdict;
  if (isExam) {
    const passed = correct >= EXAM_PASS;
    verdict = passed ? `<div class="verdict pass">✓ Επιτυχία</div>` : `<div class="verdict fail">✗ Αποτυχία</div>`;
  } else {
    verdict = `<div class="verdict" style="color:var(--amber)">Ολοκληρώθηκε</div>`;
  }

  const wrap = document.createElement('div');
  wrap.className = 'fade-in';

  let chapterRows = '';
  for (const [ch, data] of Object.entries(perChapter)) {
    if (data.total === 0) continue;
    const chPct = Math.round((data.correct / data.total) * 100);
    const color = chPct >= 80 ? 'var(--green)' : chPct >= 50 ? 'var(--amber)' : 'var(--red)';
    chapterRows += `
      <div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--ink-faint);width:120px;">${ch}. ${CHAPTERS[ch].name}</div>
        <div style="flex:1;height:4px;background:var(--line);position:relative;overflow:hidden;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:${chPct}%;background:${color};"></div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);width:90px;text-align:right;">${data.correct}/${data.total} <span style="color:var(--ink-faint);font-size:11px;">(${chPct}%)</span></div>
      </div>
    `;
  }

  wrap.innerHTML = `
    <div class="results">
      ${verdict}
      <div class="score-display"><span style="color:${isExam ? (correct >= EXAM_PASS ? 'var(--green)' : 'var(--red)') : 'var(--amber)'}">${correct}</span><span class="out-of">/${total}</span></div>
      <h2>${isExam ? (correct >= EXAM_PASS ? 'Συγχαρητήρια!' : 'Δοκίμασε ξανά') : 'Καλή προσπάθεια'}</h2>
      <div class="sub">
        ${isExam
          ? `Όριο επιτυχίας: ${EXAM_PASS}/${total} &nbsp;·&nbsp; Διάρκεια: ${formatTime(elapsedSec)}`
          : `Διάρκεια εξάσκησης: ${formatTime(elapsedSec)}`
        }
      </div>

      <div class="result-stats">
        <div class="result-stat"><div class="label">Επίδοση</div><div class="value amber">${pct}%</div></div>
        <div class="result-stat"><div class="label">Σωστές</div><div class="value green">${correct}</div></div>
        <div class="result-stat"><div class="label">Λάθος</div><div class="value red">${incorrect}</div></div>
        ${unanswered > 0 ? `<div class="result-stat"><div class="label">Αναπάντητες</div><div class="value">${unanswered}</div></div>` : ''}
      </div>

      <div style="text-align:left;margin-bottom:32px;">
        <h3 style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px;">Ανά κεφάλαιο</h3>
        ${chapterRows}
      </div>

      <div class="results-actions">
        <button class="btn btn-primary btn-large" id="retry-btn">${isExam ? 'Νέα Εξέταση' : 'Νέα Εξάσκηση'}</button>
        <button class="btn btn-large" id="home-btn">Αρχική</button>
        ${incorrect > 0 ? `<button class="btn btn-large" id="review-btn">Ανασκόπηση λαθών</button>` : ''}
      </div>

      <div id="review-list"></div>
    </div>
  `;
  app.appendChild(wrap);

  wrap.querySelector('#retry-btn').onclick = () => {
    if (isExam) startExam();
    else startPractice();
  };
  wrap.querySelector('#home-btn').onclick = () => {
    state.view = 'home';
    state.session = null;
    render();
  };
  const reviewBtn = wrap.querySelector('#review-btn');
  if (reviewBtn) {
    reviewBtn.onclick = () => {
      const list = wrap.querySelector('#review-list');
      if (list.children.length > 0) {
        list.innerHTML = '';
        return;
      }
      const section = document.createElement('div');
      section.className = 'review-section';
      section.style.marginTop = '24px';
      section.style.textAlign = 'left';
      let html = '<h3>Λάθος απαντήσεις</h3>';
      s.questions.forEach((q, idx) => {
        const ans = s.answers[idx];
        if (ans && ans.correct) return;
        const yourText = ans ? q.answers[ans.selectedShuffledIdx].text : '(αναπάντητο)';
        const correctText = q.answers[q.correctShuffledIdx].text;
        html += `
          <div class="review-item">
            <div class="qhead">#${idx+1} · Κεφ. ${q.c} · Αρ. ${q.n}</div>
            <div class="qtext">${escapeHtml(q.q)}</div>
            ${QUESTION_IMAGES[q.n] ? `<div class="q-image-wrap small"><img class="q-image" src="${QUESTION_IMAGES[q.n]}" alt="Σχήμα ερώτησης" loading="lazy"></div>` : ''}
            <div class="review-row"><span class="lbl">Δική σου</span><span class="your">${escapeHtml(yourText)}</span></div>
            <div class="review-row"><span class="lbl">Σωστή</span><span class="right">${escapeHtml(correctText)}</span></div>
          </div>
        `;
      });
      section.innerHTML = html;
      list.appendChild(section);
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }
}

function startBrowse() {
  state.browse = state.browse || {
    chapters: new Set(['Α', 'Β', 'Γ', 'Δ']),
    search: '',
    expanded: new Set(),
  };
  state.view = 'browse';
  render();
}

function renderBrowse() {
  const b = state.browse;
  const wrap = document.createElement('div');
  wrap.className = 'fade-in';

  // Filter questions
  const term = b.search.trim().toLowerCase();
  const filtered = QUESTIONS.filter(q => {
    if (!b.chapters.has(q.c)) return false;
    if (!term) return true;
    if (String(q.n).includes(term)) return true;
    if (q.q.toLowerCase().includes(term)) return true;
    if (q.a.some(a => a.toLowerCase().includes(term))) return true;
    return false;
  }).sort((a, b) => a.n - b.n);

  wrap.innerHTML = `
    <div class="session-bar">
      <div class="left">
        <div class="stat">Ευρετήριο <span class="val amber">${filtered.length}/${QUESTIONS.length}</span></div>
      </div>
      <div class="right">
        <button class="quit-btn" id="browse-home">Αρχική</button>
      </div>
    </div>

    <div class="browse-controls">
      <input type="text" class="browse-search" id="browse-search" placeholder="Αναζήτηση: αριθμός, κείμενο, απάντηση..." value="${escapeHtml(b.search)}">
      <div class="browse-chapters" id="browse-chapters"></div>
    </div>

    <div class="browse-list" id="browse-list"></div>
  `;
  app.appendChild(wrap);

  // Render chapter chips (compact)
  const chGrid = wrap.querySelector('#browse-chapters');
  for (const [letter, info] of Object.entries(CHAPTERS)) {
    const count = QUESTIONS.filter(q => q.c === letter).length;
    const isActive = b.chapters.has(letter);
    const chip = document.createElement('button');
    chip.className = 'browse-chip' + (isActive ? ' active' : '');
    chip.innerHTML = `<strong>${letter}.</strong> ${info.name} <span class="cnt">${count}</span>`;
    chip.onclick = () => {
      if (b.chapters.has(letter)) {
        if (b.chapters.size > 1) b.chapters.delete(letter);
      } else {
        b.chapters.add(letter);
      }
      render();
    };
    chGrid.appendChild(chip);
  }

  // Search input - debounced re-render to keep focus
  const searchInput = wrap.querySelector('#browse-search');
  let timer;
  searchInput.oninput = (e) => {
    b.search = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(() => {
      // Only re-render the list, not whole view, so input keeps focus
      renderBrowseList();
    }, 120);
  };
  // Focus restore: if user was typing, keep cursor
  if (b.search) {
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }

  // List
  function renderBrowseList() {
    const term = b.search.trim().toLowerCase();
    const items = QUESTIONS.filter(q => {
      if (!b.chapters.has(q.c)) return false;
      if (!term) return true;
      if (String(q.n).includes(term)) return true;
      if (q.q.toLowerCase().includes(term)) return true;
      if (q.a.some(a => a.toLowerCase().includes(term))) return true;
      return false;
    }).sort((a, b) => a.n - b.n);

    // Update count in session bar
    const stat = wrap.querySelector('.stat .val');
    if (stat) stat.textContent = `${items.length}/${QUESTIONS.length}`;

    const list = wrap.querySelector('#browse-list');
    list.innerHTML = '';
    if (items.length === 0) {
      list.innerHTML = '<div class="browse-empty">Δεν βρέθηκαν ερωτήσεις.</div>';
      return;
    }
    for (const q of items) {
      const item = document.createElement('div');
      item.className = 'browse-item';
      const isExpanded = b.expanded.has(q.n);
      item.innerHTML = `
        <button class="browse-row" data-n="${q.n}">
          <span class="browse-num">${String(q.n).padStart(3, '0')}</span>
          <span class="browse-ch">Κεφ. ${q.c}</span>
          <span class="browse-q">${escapeHtml(q.q)}</span>
          ${QUESTION_IMAGES[q.n] ? '<span class="browse-icon" title="Με σχήμα">▦</span>' : ''}
          <span class="browse-expand">${isExpanded ? '−' : '+'}</span>
        </button>
        ${isExpanded ? renderBrowseDetail(q) : ''}
      `;
      list.appendChild(item);
    }
    // Wire row clicks
    list.querySelectorAll('.browse-row').forEach(row => {
      row.onclick = () => {
        const n = parseInt(row.dataset.n);
        if (b.expanded.has(n)) b.expanded.delete(n);
        else b.expanded.add(n);
        renderBrowseList();
      };
    });
  }

  function renderBrowseDetail(q) {
    let html = '<div class="browse-detail">';
    if (QUESTION_IMAGES[q.n]) {
      html += `<div class="q-image-wrap small"><img class="q-image" src="${QUESTION_IMAGES[q.n]}" alt="Σχήμα ερώτησης" loading="lazy"></div>`;
    }
    html += '<ol class="browse-answers">';
    q.a.forEach((a, i) => {
      const isCorrect = i === q.r;
      html += `<li class="browse-answer${isCorrect ? ' correct' : ''}"><span class="ba-num">${i + 1}.</span><span>${escapeHtml(a)}</span>${isCorrect ? '<span class="ba-mark">✓ Σωστή</span>' : ''}</li>`;
    });
    html += '</ol>';
    html += '</div>';
    return html;
  }

  renderBrowseList();

  // Home button
  wrap.querySelector('#browse-home').onclick = () => {
    state.view = 'home';
    render();
  };
}

function startDocs() {

    selected: null,  // null = list, 'preamble' or 'fek' when reading
    expandedArticle: null,

}

function renderDocs() {

function renderDocsList() {

    <div class="session-bar">
      <div class="left">
        <div class="stat">Έγγραφα <span class="val amber">2 διαθέσιμα</span></div>
      </div>
      <div class="right">

    <div class="docs-intro">

    <div class="docs-list">

function renderDocsReader() {
  const d = state.docs;
  const doc = DOCUMENTS[d.selected];
  const isFek = d.selected === 'fek';
  const items = isFek ? doc.articles : doc.sections;

    <div class="session-bar">

        <div class="stat">${escapeHtml(isFek ? 'ΦΕΚ 1969/Β΄/2011' : 'Προοίμιο')} <span class="val amber">${items.length} ${itemLabel}</span></div>
      </div>
      <div class="right">
        <button class="quit-btn" id="docs-back">← Έγγραφα</button>
        <button class="quit-btn" id="docs-home2">Αρχική</button>
      </div>
    </div>

    <div class="doc-header">
      <div class="doc-publisher">${escapeHtml(doc.publisher).replace(/\n/g, '<br>')}</div>
      <h2 class="doc-title">${escapeHtml(doc.title)}</h2>
      <div class="doc-sub">${escapeHtml(doc.subtitle)}</div>
      <div class="doc-date mono">${escapeHtml(doc.date)}</div>
      ${doc.preamble ? '<div class="doc-preamble">' + escapeHtml(doc.preamble) + '</div>' : ''}
    </div>

    <div class="doc-body" id="doc-body"></div>

  `;
  app.appendChild(wrap);

  const body = wrap.querySelector('#doc-body');
  items.forEach((item, idx) => {
    const heading = isFek ? item.number : item.heading;
    const title = isFek ? item.title : '';
    const isExpanded = d.expandedArticle === idx;
    const div = document.createElement('div');
    div.className = 'doc-section' + (isExpanded ? ' open' : '');
    div.innerHTML = `
      <button class="doc-section-head" data-idx="${idx}">
        <span class="doc-num mono">${escapeHtml(heading)}</span>
        ${title ? '<span class="doc-stitle">' + escapeHtml(title) + '</span>' : ''}
        <span class="doc-toggle">${isExpanded ? '−' : '+'}</span>
      </button>
      ${isExpanded ? '<div class="doc-section-body">' + formatDocBody(item.body) + '</div>' : ''}
    `;
    body.appendChild(div);
  });

  // Wire section toggles
  body.querySelectorAll('.doc-section-head').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);

  if (d.expandedArticle !== null) {
    setTimeout(() => {

      if (openSection) {
        openSection.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      }
    }, 50);
  }
}

function formatDocBody(text) {
  // Substitute embedded resources, then escape and paragraph-wrap the remaining text
  // Sentinels: {{REGIONS_MAP}} → SVG map; {{POWER_TABLE}} → power/frequency HTML table
  const tokenRe = /(\{\{REGIONS_MAP\}\}|\{\{POWER_TABLE\}\})/;
  const segments = text.split(tokenRe);
  return segments.map(seg => {
    if (seg === '{{REGIONS_MAP}}') return '<div class="doc-map">' + REGIONS_MAP_SVG + '</div>';
    if (seg === '{{POWER_TABLE}}') return '<div class="doc-table-wrap">' + POWER_TABLE_HTML + '</div>';
    const escaped = escapeHtml(seg);
    return escaped.split(/\n\n+/)
      .filter(p => p.trim())
      .map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>')
      .join('');
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
